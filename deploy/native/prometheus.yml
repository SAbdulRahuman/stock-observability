# Prometheus configuration for the native (install.sh / install.ps1) install.
# Same jobs as deploy/prometheus/prometheus.yml, with every service on 127.0.0.1
# behind the portal route prefixes (/prometheus, /alertmanager).
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  # Exposes scrape_timeout_seconds / scrape_sample_limit used by StockScrapeUnhealthy.
  extra_scrape_metrics: true
  external_labels:
    system: stock-observability

# The core tier alone ingests ~13k samples/s: keep a desktop install bounded.
storage:
  tsdb:
    retention:
      time: 15d
      size: 20GB

# Relative to this file, so the same config works on Linux and Windows.
rule_files:
  - rules/*.rules.yml

alerting:
  alertmanagers:
    - path_prefix: /alertmanager
      static_configs:
        - targets: ["127.0.0.1:9093"]

scrape_configs:
  - job_name: stock_core
    scrape_interval: 1s
    scrape_timeout: 900ms
    sample_limit: 20000
    label_limit: 16
    scrape_protocols: [PrometheusProto, OpenMetricsText1.0.0, PrometheusText0.0.4]
    params:
      tier: [core]
      exclude[]: [daily]
    static_configs:
      - targets: ["127.0.0.1:9101"]

  - job_name: stock_daily
    scrape_interval: 60s
    scrape_timeout: 10s
    sample_limit: 15000
    label_limit: 16
    params:
      tier: [core]
      collect[]: [daily]
    static_configs:
      - targets: ["127.0.0.1:9101"]

  - job_name: stock_broad
    scrape_interval: 5s
    scrape_timeout: 4s
    sample_limit: 80000
    label_limit: 16
    scrape_protocols: [PrometheusProto, OpenMetricsText1.0.0, PrometheusText0.0.4]
    params:
      tier: [broad]
      collect[]: [quote, circuit]
    static_configs:
      - targets: ["127.0.0.1:9101"]

  - job_name: prometheus
    metrics_path: /prometheus/metrics
    static_configs:
      - targets: ["127.0.0.1:9090"]

  - job_name: alertmanager
    metrics_path: /alertmanager/metrics
    static_configs:
      - targets: ["127.0.0.1:9093"]
