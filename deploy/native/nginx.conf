worker_processes 1;
daemon off;
pid logs/nginx.pid;
error_log logs/error.log warn;

events {
    worker_connections 128;
}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    access_log off;
    client_max_body_size 10m;
    client_body_temp_path client_body_temp;
    proxy_temp_path proxy_temp;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 300s;

    server {
        listen @PORTAL_BIND@:@PORTAL_PORT@;
        server_tokens off;
        absolute_redirect off;

        location = /healthz { access_log off; return 200 "ok\n"; }

        location = /grafana { return 308 /grafana/; }
        location /grafana/ {
            proxy_pass http://127.0.0.1:3000;
        }

        location = /prometheus { return 308 /prometheus/; }
        location /prometheus/ {
            proxy_pass http://127.0.0.1:9090;
        }

        location = /alertmanager { return 308 /alertmanager/; }
        location /alertmanager/ {
            proxy_pass http://127.0.0.1:9093;
        }

        # Only the Kite login flow is exposed from the exporter.
        location = /exporter/login {
            proxy_pass http://127.0.0.1:9101/login;
        }
        location = /exporter/kite/callback {
            proxy_pass http://127.0.0.1:9101/kite/callback;
        }

        location / {
            proxy_pass http://127.0.0.1:8081;
        }
    }
}