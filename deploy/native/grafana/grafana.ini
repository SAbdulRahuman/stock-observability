# Rendered once by the installer (@...@ placeholders); later upgrades keep your edits.
[paths]
data = @DATA_DIR@/grafana
logs = @DATA_DIR@/grafana/log
plugins = @DATA_DIR@/grafana/plugins
provisioning = @CONFIG_DIR@/grafana/provisioning

[server]
http_addr = 127.0.0.1
http_port = 3000
root_url = http://localhost:@PORTAL_PORT@/grafana/
serve_from_sub_path = true

[security]
admin_user = admin
admin_password = @GRAFANA_ADMIN_PASSWORD@

[users]
allow_sign_up = false

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
