{{- $prom := include "so.fullname" (list . "prometheus") -}}
{{- $am := include "so.fullname" (list . "alertmanager") -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "so.fullname" (list . "grafana-datasources") }}
  labels:
    {{- include "so.labels" (list . "grafana") | nindent 4 }}
data:
  datasources.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://{{ $prom }}:9090/prometheus
        isDefault: true
        editable: false
        jsonData:
          httpMethod: POST
          timeInterval: 5s
          manageAlerts: true
          alertmanagerUid: alertmanager
      - name: Alertmanager
        uid: alertmanager
        type: alertmanager
        access: proxy
        url: http://{{ $am }}:9093/alertmanager
        editable: false
        jsonData:
          implementation: prometheus
          handleGrafanaManagedAlerts: false
