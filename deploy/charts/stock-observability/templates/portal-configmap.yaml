{{- $prom := include "so.fullname" (list . "prometheus") -}}
{{- $am := include "so.fullname" (list . "alertmanager") -}}
{{- $grafana := include "so.fullname" (list . "grafana") -}}
{{- $exporter := include "so.fullname" (list . "stock-exporter") -}}
{{- $auth := .Values.portal.auth.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "so.fullname" (list . "portal") }}
  labels:
    {{- include "so.labels" (list . "portal") | nindent 4 }}
data:
  default.conf: |
    map $http_upgrade $connection_upgrade {
      default upgrade;
      ''      close;
    }

    server {
      listen 8080;
      server_tokens off;
      # Behind the Route/Gateway: absolute redirects would leak http and port 8080.
      absolute_redirect off;
      client_max_body_size 10m;

      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 300s;

      location = /healthz { access_log off; return 200 "ok\n"; }
      {{- if .Values.home.enabled }}

      # Product home page and its /api/v1 JSON.
      location / {
        proxy_pass http://{{ include "so.fullname" (list . "stock-home") }}:8080;
      }
      {{- else }}
      location = / { return 302 /grafana/; }
      {{- end }}

      # Grafana has its own login.
      location /grafana/ {
        proxy_pass http://{{ $grafana }}:3000;
      }

      location /prometheus/ {
        {{- if $auth }}
        auth_basic "stock-observability";
        auth_basic_user_file /etc/nginx/auth/htpasswd;
        {{- end }}
        proxy_pass http://{{ $prom }}:9090;
      }

      location /alertmanager/ {
        {{- if $auth }}
        auth_basic "stock-observability";
        auth_basic_user_file /etc/nginx/auth/htpasswd;
        {{- end }}
        proxy_pass http://{{ $am }}:9093;
      }

      # Only the Kite login flow is public; /metrics and /debug/pprof stay cluster-internal.
      location = /exporter/login {
        {{- if $auth }}
        auth_basic "stock-observability";
        auth_basic_user_file /etc/nginx/auth/htpasswd;
        {{- end }}
        proxy_pass http://{{ $exporter }}:9101/login;
      }

      location = /exporter/kite/callback {
        {{- if $auth }}
        auth_basic "stock-observability";
        auth_basic_user_file /etc/nginx/auth/htpasswd;
        {{- end }}
        proxy_pass http://{{ $exporter }}:9101/kite/callback;
      }
    }
