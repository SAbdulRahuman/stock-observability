apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "so.fullname" (list . "alertmanager") }}
  labels:
    {{- include "so.labels" (list . "alertmanager") | nindent 4 }}
data:
  {{- $cfg := .Files.Glob "files/alertmanager/alertmanager.yml" }}
  {{- if not $cfg }}
  {{- fail "files/alertmanager/alertmanager.yml not found" }}
  {{- end }}
  {{- $cfg.AsConfig | nindent 2 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "so.fullname" (list . "alertmanager-templates") }}
  labels:
    {{- include "so.labels" (list . "alertmanager") | nindent 4 }}
data:
  {{- (.Files.Glob "files/alertmanager/templates/*.tmpl").AsConfig | nindent 2 }}
