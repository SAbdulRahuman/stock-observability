{{- $name := include "so.fullname" (list . "grafana-admin") -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "so.labels" (list . "grafana") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if $existing }}
  admin-user: {{ index $existing.data "admin-user" }}
  admin-password: {{ index $existing.data "admin-password" }}
  {{- else }}
  admin-user: {{ .Values.grafana.adminUser | b64enc }}
  admin-password: {{ randAlphaNum 24 | b64enc }}
  {{- end }}
