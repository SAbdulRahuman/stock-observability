{{- if .Values.portal.auth.enabled }}
{{- $name := include "so.fullname" (list . "portal-auth") -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "so.labels" (list . "portal") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if $existing }}
  username: {{ index $existing.data "username" }}
  password: {{ index $existing.data "password" }}
  htpasswd: {{ index $existing.data "htpasswd" }}
  {{- else }}
  {{- $user := .Values.portal.auth.username }}
  {{- $pass := randAlphaNum 24 }}
  username: {{ $user | b64enc }}
  password: {{ $pass | b64enc }}
  htpasswd: {{ printf "%s\n" (htpasswd $user $pass) | b64enc }}
  {{- end }}
{{- end }}
