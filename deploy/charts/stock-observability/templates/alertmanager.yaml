{{- $name := include "so.fullname" (list . "alertmanager") -}}
{{- $v := .Values.alertmanager -}}
{{ include "so.pvc" (list . "alertmanager" $v.persistence) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "so.labels" (list . "alertmanager") | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "so.selectorLabels" (list . "alertmanager") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "so.labels" (list . "alertmanager") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/alertmanager-configmap.yaml") . | sha256sum }}
    spec:
      {{- include "so.podSpecCommon" . | nindent 6 }}
      containers:
        - name: alertmanager
          image: {{ include "so.image" $v.image }}
          imagePullPolicy: {{ $v.image.pullPolicy }}
          args:
            - --config.file=/etc/alertmanager/config/alertmanager.yml
            - --storage.path=/alertmanager
            - --web.external-url={{ include "so.externalURL" . }}/alertmanager/
            - --web.route-prefix=/alertmanager
            - --cluster.listen-address=
          ports:
            - name: http
              containerPort: 9093
          readinessProbe:
            httpGet:
              path: /alertmanager/-/ready
              port: http
          livenessProbe:
            httpGet:
              path: /alertmanager/-/healthy
              port: http
          resources:
            {{- toYaml $v.resources | nindent 12 }}
          securityContext:
            {{- include "so.containerSecurityContext" . | nindent 12 }}
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager/config
            - name: templates
              mountPath: /etc/alertmanager/templates
            - name: data
              mountPath: /alertmanager
      volumes:
        - name: config
          configMap:
            name: {{ $name }}
        - name: templates
          configMap:
            name: {{ include "so.fullname" (list . "alertmanager-templates") }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ $name }}-data
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "so.labels" (list . "alertmanager") | nindent 4 }}
spec:
  selector:
    {{- include "so.selectorLabels" (list . "alertmanager") | nindent 4 }}
  ports:
    - name: http
      port: 9093
      targetPort: http
