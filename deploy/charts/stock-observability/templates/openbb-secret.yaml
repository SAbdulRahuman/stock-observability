{{- if and .Values.openbb.enabled .Values.openbb.auth.enabled }}
{{- $name := include "so.fullname" (list . "openbb-auth") -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "so.labels" (list . "openbb") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if $existing }}
  username: {{ index $existing.data "username" }}
  password: {{ index $existing.data "password" }}
  {{- with index $existing.data "htpasswd" }}
  htpasswd: {{ . }}
  {{- else }}
  {{- /* Secrets from older chart versions lack htpasswd. */}}
  htpasswd: {{ printf "%s\n" (htpasswd (index $existing.data "username" | b64dec) (index $existing.data "password" | b64dec)) | b64enc }}
  {{- end }}
  {{- else }}
  {{- $user := .Values.openbb.auth.username }}
  {{- $pass := randAlphaNum 24 }}
  username: {{ $user | b64enc }}
  password: {{ $pass | b64enc }}
  htpasswd: {{ printf "%s\n" (htpasswd $user $pass) | b64enc }}
  {{- end }}
{{- end }}
