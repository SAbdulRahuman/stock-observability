# 1-minute bars (proposal §7.0, Release 2), core tier, recorded once per minute in session.
#   H/L = max/min of the 1s LTP samples in the last minute (not exchange candles), C = LTP
#   V   = day volume delta over the minute; on the session reset the whole new day volume
#   MFV = ((C - L) - (H - C)) / (H - L) * V   (Chaikin money-flow volume, 0 when H = L)
groups:
  - name: nse_bars
    interval: 1m
    rules:
      - record: stock:bar_1m_high:price
        expr: max_over_time(stock_last_price{tier="core"}[1m]) and on() stock_market_open == 1
      - record: stock:bar_1m_low:price
        expr: min_over_time(stock_last_price{tier="core"}[1m]) and on() stock_market_open == 1
      - record: stock:bar_1m_close:price
        expr: stock_last_price{tier="core"} and on() stock_market_open == 1
      - record: stock:bar_1m_volume:shares
        expr: |
          (
              (stock_day_volume_shares{tier="core", instrument_type="EQ"} - stock_day_volume_shares{tier="core", instrument_type="EQ"} offset 1m >= 0)
            or stock_day_volume_shares{tier="core", instrument_type="EQ"}
          )
          and on() stock_market_open == 1
      - record: stock:bar_1m_typical:price
        expr: (stock:bar_1m_high:price + stock:bar_1m_low:price + stock:bar_1m_close:price) / 3
      - record: stock:bar_1m_money_flow_volume:shares
        expr: |
          (
              ((stock:bar_1m_close:price - stock:bar_1m_low:price) - (stock:bar_1m_high:price - stock:bar_1m_close:price))
            / ((stock:bar_1m_high:price - stock:bar_1m_low:price) > 0)
            * stock:bar_1m_volume:shares
          )
          or 0 * stock:bar_1m_volume:shares
