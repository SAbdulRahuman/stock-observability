# Volume and liquidity (proposal §6.5, Release 1).
#   Turnover (INR)  = V * VWAP
#   RVOL            = V / (avg session volume over 14 days * elapsed / 22500), after 09:45, >= 5 sessions
#   Depth (INR)     = sum of price * qty over the top-5 bid and ask levels
#   Depth vs 1h     = depth / avg_over_time(depth[1h])
groups:
  - name: nse_volume_liquidity
    interval: 15s
    rules:
      - record: stock:turnover:inr
        expr: stock_day_volume_shares{instrument_type="EQ"} * stock_average_traded_price{instrument_type="EQ"}

      # Assumes linear intraday volume (NSE volume is U-shaped), hence the 09:45 gate.
      - record: stock:relative_volume:ratio
        expr: |
          (
            stock_day_volume_shares{tier="core", instrument_type="EQ"}
            / (
                avg_over_time(stock:session_volume:shares[14d])
                * on() group_left() ((22500 - stock_market_seconds_to_close) / 22500)
                > 0
              )
          )
          and count_over_time(stock:session_volume:shares[14d]) >= 5
          and on() stock_market_open == 1
          and on() stock_market_seconds_to_close < 20700

      - record: stock:orderbook_depth:inr
        expr: sum without (side) (stock_orderbook_notional{tier="core"})
      - record: stock:depth_vs_1h:ratio
        expr: stock:orderbook_depth:inr / (avg_over_time(stock:orderbook_depth:inr[1h]) > 0)

  - name: nse_volume_liquidity_alerts
    interval: 15s
    rules:
      # The 1h spread mean uses the 15s-recorded 5m average to avoid reading 1s samples.
      - alert: StockLiquidityDrain
        expr: |
          stock:depth_vs_1h:ratio{instrument_type="EQ"} < 0.25
          and stock_orderbook_spread_bps > 2 * avg_over_time(stock:orderbook_spread_5m_avg:bps[1h])
          and on() stock_market_open == 1
        for: 2m
        labels: {severity: warning, category: flow, layer: condition, condition: liquidity_drain}
        annotations:
          summary: "{{ $labels.symbol }} top-5 depth at {{ $value | humanizePercentage }} of its 1h average"
          description: "Order book depth of {{ $labels.exchange }}:{{ $labels.symbol }} fell below 25% of its 1h average while the spread widened to more than twice its 1h mean."
          link: "https://www.nseindia.com/get-quotes/equity?symbol={{ $labels.symbol | urlquery }}"
