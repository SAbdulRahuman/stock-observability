# Momentum (proposal §6.2, Release 1). Oscillators run on 1-minute bars: x[14m:1m] samples LTP
# at minute boundaries, i.e. 1m closes.
#   RSI(14)  = 100 - 100 / (1 + avg_gain / avg_loss)   Cutler (SMA) RSI; Wilder RSI in nse_momentum_wilder
#   %K(14)   = (C - LL14) / (HH14 - LL14) * 100
#   RS_NIFTY = change%(stock) - change%(NIFTY 50)
groups:
  - name: nse_momentum
    interval: 15s
    rules:
      # avg_loss = 0 -> RSI 100; flat price -> NaN.
      - record: stock:rsi_14m:index
        expr: |
          100 - 100 / (1 +
              avg_over_time(clamp_min(stock_last_price{tier="core"} - stock_last_price{tier="core"} offset 1m, 0)[14m:1m])
            / avg_over_time(clamp_min(stock_last_price{tier="core"} offset 1m - stock_last_price{tier="core"}, 0)[14m:1m])
          )
      - record: stock:stochastic_k_14m:percent
        expr: |
          (stock_last_price{tier="core"} - min_over_time(stock_last_price{tier="core"}[14m]))
          / ((max_over_time(stock_last_price{tier="core"}[14m]) - min_over_time(stock_last_price{tier="core"}[14m])) > 0)
          * 100
      - record: stock:relative_strength_nifty:percent
        expr: |
          stock_change_percent{tier="core", instrument_type="EQ"}
          - on() group_left()
          stock_change_percent{symbol="NIFTY 50", instrument_type="INDEX"}
      # Release 2 (§7.4 #44, #46): momentum C - C[10m ago]; %D = SMA3 of %K at the last three 1m closes.
      - record: stock:momentum_10m:points
        expr: stock_last_price{tier="core"} - stock_last_price{tier="core"} offset 10m
      - record: stock:stochastic_d_3m:percent
        expr: avg_over_time(stock:stochastic_k_14m:percent[3m:1m]) and count_over_time(stock:stochastic_k_14m:percent[3m:1m]) >= 3

  # Bar oscillators (§7.4 #48, #49, #52, Release 2) on nse_bars, once the window holds a full session of bars:
  #   CCI(20) = (TP - SMA20(TP)) / (0.015 * MD), MD = rolling mean of |TP - SMA20(TP)| (approximation)
  #   MFI(14) = 100 - 100 / (1 + sum(TP*V, TP up) / sum(TP*V, TP down))
  #   AO      = SMA5(median) - SMA34(median), median = (H + L) / 2
  - name: nse_momentum_bars
    interval: 1m
    rules:
      - record: stock:cci_20m:index
        expr: |
          (stock:bar_1m_typical:price - avg_over_time(stock:bar_1m_typical:price[20m]))
          / (0.015 * avg_over_time(abs(stock:bar_1m_typical:price - avg_over_time(stock:bar_1m_typical:price[20m]))[20m:1m]) > 0)
          and count_over_time(stock:bar_1m_typical:price[20m]) >= 20
      # One-sided flow counts as 0 on the other side: no down-flow -> 100, no up-flow -> 0.
      - record: stock:mfi_14m:index
        expr: |
          100 - 100 / (1 +
              (
                  sum_over_time((stock:bar_1m_typical:price * stock:bar_1m_volume:shares and stock:bar_1m_typical:price > stock:bar_1m_typical:price offset 1m)[14m:1m])
                or 0 * sum_over_time((stock:bar_1m_typical:price * stock:bar_1m_volume:shares and stock:bar_1m_typical:price < stock:bar_1m_typical:price offset 1m)[14m:1m])
              )
            / (
                  sum_over_time((stock:bar_1m_typical:price * stock:bar_1m_volume:shares and stock:bar_1m_typical:price < stock:bar_1m_typical:price offset 1m)[14m:1m])
                or 0 * sum_over_time((stock:bar_1m_typical:price * stock:bar_1m_volume:shares and stock:bar_1m_typical:price > stock:bar_1m_typical:price offset 1m)[14m:1m])
              )
          )
          and count_over_time(stock:bar_1m_typical:price[15m]) >= 15
      - record: stock:awesome_oscillator:price
        expr: |
          (
              (avg_over_time(stock:bar_1m_high:price[5m]) + avg_over_time(stock:bar_1m_low:price[5m])) / 2
            - (avg_over_time(stock:bar_1m_high:price[34m]) + avg_over_time(stock:bar_1m_low:price[34m])) / 2
          )
          and count_over_time(stock:bar_1m_high:price[34m]) >= 34

  # Wilder RSI (§7.4 #41, Release 2): avg = avg[1m ago] + (x - avg[1m ago]) / 14 on 1m bars, seeded
  # with the Cutler averages of the session's first 14 bars (Wilder's own seed). Stateful, see nse_trend.
  - name: nse_momentum_wilder
    interval: 1m
    rules:
      - record: stock:rsi_avg_gain_14m:points
        expr: |
          (
              1/14 * clamp_min(stock_last_price{tier="core"} - stock_last_price{tier="core"} offset 1m, 0)
            + 13/14 * last_over_time(stock:rsi_avg_gain_14m:points[3m])
            or (
                avg_over_time(clamp_min(stock_last_price{tier="core"} - stock_last_price{tier="core"} offset 1m, 0)[14m:1m])
              and on() stock_market_seconds_to_close <= 21660
            )
          )
          and on() stock_market_open == 1
      - record: stock:rsi_avg_loss_14m:points
        expr: |
          (
              1/14 * clamp_min(stock_last_price{tier="core"} offset 1m - stock_last_price{tier="core"}, 0)
            + 13/14 * last_over_time(stock:rsi_avg_loss_14m:points[3m])
            or (
                avg_over_time(clamp_min(stock_last_price{tier="core"} offset 1m - stock_last_price{tier="core"}, 0)[14m:1m])
              and on() stock_market_seconds_to_close <= 21660
            )
          )
          and on() stock_market_open == 1
      # avg_loss = 0 -> RSI 100; no movement at all -> NaN.
      - record: stock:rsi_wilder_14m:index
        expr: 100 - 100 / (1 + stock:rsi_avg_gain_14m:points / stock:rsi_avg_loss_14m:points)

  - name: nse_momentum_alerts
    interval: 15s
    rules:
      # Overbought/oversold on two oscillators, MACD histogram turning against the move, and
      # tick-rule volume flowing the other way.
      - alert: StockMomentumExhaustion
        expr: |
          (
            label_replace(
                stock:rsi_14m:index{instrument_type="EQ"} > 70
              and stock:stochastic_k_14m:percent > 80
              and stock:macd_histogram:price < stock:macd_histogram:price offset 2m
              and stock:volume_delta_1h:ratio < 0,
              "direction", "bearish", "", "")
            or
            label_replace(
                stock:rsi_14m:index{instrument_type="EQ"} < 30
              and stock:stochastic_k_14m:percent < 20
              and stock:macd_histogram:price > stock:macd_histogram:price offset 2m
              and stock:volume_delta_1h:ratio > 0,
              "direction", "bullish", "", "")
          )
          and on() stock_market_open == 1
        for: 2m
        labels: {severity: info, category: price, layer: condition, condition: momentum_exhaustion}
        annotations:
          summary: "{{ $labels.symbol }} {{ $labels.direction }} momentum exhaustion (RSI {{ $value | printf \"%.1f\" }})"
          description: "{{ $labels.exchange }}:{{ $labels.symbol }} is {{ if eq $labels.direction \"bearish\" }}overbought{{ else }}oversold{{ end }} on RSI(14) and %K, its MACD histogram is turning and volume delta opposes the move."
          link: "https://www.nseindia.com/get-quotes/equity?symbol={{ $labels.symbol | urlquery }}"
