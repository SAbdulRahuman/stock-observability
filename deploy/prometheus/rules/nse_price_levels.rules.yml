# Price levels (proposal §6.1, Release 1): intraday return, floor pivots, opening range.
#   P = (PH + PL + PC) / 3   R1 = 2P - PL   S1 = 2P - PH   R2 = P + (PH - PL)   S2 = P - (PH - PL)
# PH/PL come from the previous session's EOD snapshot (nse_eod_snapshot), PC from Kite ohlc.close.
groups:
  - name: nse_price_levels
    interval: 15s
    rules:
      - record: stock:intraday_return:percent
        expr: (stock_last_price{tier="core"} - stock_open_price{tier="core"}) / (stock_open_price{tier="core"} > 0) * 100

      - record: stock:pivot:price
        labels: {level: P}
        expr: |
          (
              last_over_time(stock:session_high:price[7d])
            + last_over_time(stock:session_low:price[7d])
            + stock_previous_close_price{tier="core"}
          ) / 3
          and on() stock_market_phase{phase=~"pre_open|open"} == 1
      - record: stock:pivot:price
        labels: {level: R1}
        expr: |
          2 * stock:pivot:price{level="P"} - ignoring(level) last_over_time(stock:session_low:price[7d])
      - record: stock:pivot:price
        labels: {level: S1}
        expr: |
          2 * stock:pivot:price{level="P"} - ignoring(level) last_over_time(stock:session_high:price[7d])
      - record: stock:pivot:price
        labels: {level: R2}
        expr: |
          stock:pivot:price{level="P"}
          + ignoring(level) (last_over_time(stock:session_high:price[7d]) - last_over_time(stock:session_low:price[7d]))
      - record: stock:pivot:price
        labels: {level: S2}
        expr: |
          stock:pivot:price{level="P"}
          - ignoring(level) (last_over_time(stock:session_high:price[7d]) - last_over_time(stock:session_low:price[7d]))

      # Day high/low during the first 15 minutes (09:15-09:30). Read with last_over_time(...[6h15m]).
      - record: stock:opening_range:price
        labels: {bound: high}
        expr: |
          stock_high_price{tier="core"}
          and on() stock_market_open == 1
          and on() stock_market_seconds_to_close > 21600
      - record: stock:opening_range:price
        labels: {bound: low}
        expr: |
          stock_low_price{tier="core"}
          and on() stock_market_open == 1
          and on() stock_market_seconds_to_close > 21600

  - name: nse_price_levels_alerts
    interval: 15s
    rules:
      # 20-session high/low from the EOD snapshots (28 calendar days), with volume confirmation.
      - alert: StockMultiSessionBreakout
        expr: |
          (
            label_replace(
                stock_last_price{tier="core", instrument_type="EQ"} > max_over_time(stock:session_high:price[28d])
              and count_over_time(stock:session_high:price[28d]) >= 15
              and stock:relative_volume:ratio > 1.5,
              "direction", "bullish", "", "")
            or
            label_replace(
                stock_last_price{tier="core", instrument_type="EQ"} < min_over_time(stock:session_low:price[28d])
              and count_over_time(stock:session_low:price[28d]) >= 15
              and stock:relative_volume:ratio > 1.5,
              "direction", "bearish", "", "")
          )
          and on() stock_market_open == 1
        for: 1m
        keep_firing_for: 30m
        labels: {severity: info, category: price, layer: condition, condition: multi_session_breakout}
        annotations:
          summary: "{{ $labels.symbol }} {{ $labels.direction }} 20-session breakout at {{ $value }}"
          description: "{{ $labels.exchange }}:{{ $labels.symbol }} is trading beyond its 20-session {{ if eq $labels.direction \"bullish\" }}high{{ else }}low{{ end }} on more than 1.5x relative volume."
          link: "https://www.nseindia.com/get-quotes/equity?symbol={{ $labels.symbol | urlquery }}"

      # Relative volume only exists from 09:45, so in practice this fires from 09:45.
      - alert: StockOpeningRangeBreakout
        expr: |
          (
            label_replace(
                stock_last_price{tier="core", instrument_type="EQ"} > ignoring(bound) last_over_time(stock:opening_range:price{bound="high"}[6h15m])
              unless stock_last_price{tier="core", instrument_type="EQ"} offset 1m > ignoring(bound) last_over_time(stock:opening_range:price{bound="high"}[6h15m] offset 1m)
              and stock:relative_volume:ratio > 1.5,
              "direction", "bullish", "", "")
            or
            label_replace(
                stock_last_price{tier="core", instrument_type="EQ"} < ignoring(bound) last_over_time(stock:opening_range:price{bound="low"}[6h15m])
              unless stock_last_price{tier="core", instrument_type="EQ"} offset 1m < ignoring(bound) last_over_time(stock:opening_range:price{bound="low"}[6h15m] offset 1m)
              and stock:relative_volume:ratio > 1.5,
              "direction", "bearish", "", "")
          )
          and on() stock_market_open == 1
          and on() stock_market_seconds_to_close < 21600
        keep_firing_for: 15m
        labels: {severity: info, category: price, layer: condition, condition: opening_range_breakout}
        annotations:
          summary: "{{ $labels.symbol }} {{ $labels.direction }} opening range breakout at {{ $value }}"
          description: "{{ $labels.exchange }}:{{ $labels.symbol }} crossed its 09:15-09:30 opening range {{ if eq $labels.direction \"bullish\" }}high{{ else }}low{{ end }} on more than 1.5x relative volume."
          link: "https://www.nseindia.com/get-quotes/equity?symbol={{ $labels.symbol | urlquery }}"
