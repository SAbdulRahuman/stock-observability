# Events (proposal §A3, Release 2): signal transitions, recorded once in the minute they happen.
#   stock:event:bool{event, direction} = 1 when the condition holds now but not 1m ago (EQ, core, in session)
# Events never notify; Grafana shows them as annotations and the effectiveness ledger scores them.
groups:
  - name: nse_events
    interval: 1m
    rules:
      - record: stock:event:bool
        labels: {event: macd_cross, direction: bullish}
        expr: |
          (stock:macd_histogram:price{instrument_type="EQ"} > 0 and stock:macd_histogram:price{instrument_type="EQ"} offset 1m <= 0) * 0 + 1
          and on() stock_market_open == 1
      - record: stock:event:bool
        labels: {event: macd_cross, direction: bearish}
        expr: |
          (stock:macd_histogram:price{instrument_type="EQ"} < 0 and stock:macd_histogram:price{instrument_type="EQ"} offset 1m >= 0) * 0 + 1
          and on() stock_market_open == 1

      # Keeps the pivot `level` label (R1/R2 upward, S1/S2 downward).
      - record: stock:event:bool
        labels: {event: pivot_break, direction: bullish}
        expr: |
          (
              stock:pivot:price{instrument_type="EQ", level=~"R1|R2"} < ignoring(level) group_left() stock_last_price{tier="core", instrument_type="EQ"}
            unless stock:pivot:price{instrument_type="EQ", level=~"R1|R2"} offset 1m < ignoring(level) group_left() stock_last_price{tier="core", instrument_type="EQ"} offset 1m
          ) * 0 + 1
          and on() stock_market_open == 1
      - record: stock:event:bool
        labels: {event: pivot_break, direction: bearish}
        expr: |
          (
              stock:pivot:price{instrument_type="EQ", level=~"S1|S2"} > ignoring(level) group_left() stock_last_price{tier="core", instrument_type="EQ"}
            unless stock:pivot:price{instrument_type="EQ", level=~"S1|S2"} offset 1m > ignoring(level) group_left() stock_last_price{tier="core", instrument_type="EQ"} offset 1m
          ) * 0 + 1
          and on() stock_market_open == 1

      - record: stock:event:bool
        labels: {event: bollinger_breakout, direction: bullish}
        expr: |
          (stock:bollinger_percent_b_20m:ratio{instrument_type="EQ"} > 1 and stock:bollinger_percent_b_20m:ratio{instrument_type="EQ"} offset 1m <= 1) * 0 + 1
          and on() stock_market_open == 1
      - record: stock:event:bool
        labels: {event: bollinger_breakout, direction: bearish}
        expr: |
          (stock:bollinger_percent_b_20m:ratio{instrument_type="EQ"} < 0 and stock:bollinger_percent_b_20m:ratio{instrument_type="EQ"} offset 1m >= 0) * 0 + 1
          and on() stock_market_open == 1

      - record: stock:event:bool
        labels: {event: rsi_cross_70, direction: bearish}
        expr: |
          (stock:rsi_wilder_14m:index{instrument_type="EQ"} > 70 and stock:rsi_wilder_14m:index{instrument_type="EQ"} offset 1m <= 70) * 0 + 1
          and on() stock_market_open == 1
      - record: stock:event:bool
        labels: {event: rsi_cross_30, direction: bullish}
        expr: |
          (stock:rsi_wilder_14m:index{instrument_type="EQ"} < 30 and stock:rsi_wilder_14m:index{instrument_type="EQ"} offset 1m >= 30) * 0 + 1
          and on() stock_market_open == 1

      # Intraday golden / death cross of SMA50 and SMA200 on 1m closes (§7.2 #20-21).
      - record: stock:event:bool
        labels: {event: ma_cross_50_200, direction: bullish}
        expr: |
          (stock:sma_50m:price{instrument_type="EQ"} > stock:sma_200m:price and stock:sma_50m:price{instrument_type="EQ"} offset 1m <= stock:sma_200m:price offset 1m) * 0 + 1
          and on() stock_market_open == 1
      - record: stock:event:bool
        labels: {event: ma_cross_50_200, direction: bearish}
        expr: |
          (stock:sma_50m:price{instrument_type="EQ"} < stock:sma_200m:price and stock:sma_50m:price{instrument_type="EQ"} offset 1m >= stock:sma_200m:price offset 1m) * 0 + 1
          and on() stock_market_open == 1
