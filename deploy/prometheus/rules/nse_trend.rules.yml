# Trend (proposal §6.3 / §7.5, Release 1 + 2).
#   EMA(n)  = a * C + (1 - a) * EMA[1m ago], a = 2 / (n + 1), one step per 1m evaluation
#   MACD    = EMA12 - EMA26;  signal = EMA9(MACD);  histogram = MACD - signal
# Stateful rules (§7.0): each reads its own previous value. A series is seeded with the SMA of
# the session's first n bars, n minutes after the open (textbook seed), and re-seeded from the
# last n bars after a gap > 3m. Session gating lets the state lapse overnight.
# EMA12/26 live here so MACD and its signal read them in the same evaluation.
groups:
  - name: nse_trend
    interval: 1m
    rules:
      - record: stock:ema_12m:price
        expr: |
          (
              2/13 * stock_last_price{tier="core"} + 11/13 * last_over_time(stock:ema_12m:price[3m])
            or (avg_over_time(stock_last_price{tier="core"}[12m:1m]) and on() stock_market_seconds_to_close <= 21780)
          )
          and on() stock_market_open == 1
      - record: stock:ema_26m:price
        expr: |
          (
              2/27 * stock_last_price{tier="core"} + 25/27 * last_over_time(stock:ema_26m:price[3m])
            or (avg_over_time(stock_last_price{tier="core"}[26m:1m]) and on() stock_market_seconds_to_close <= 20940)
          )
          and on() stock_market_open == 1
      - record: stock:macd_12_26m:price
        expr: stock:ema_12m:price - stock:ema_26m:price
      - record: stock:macd_signal_9m:price
        expr: |
          0.2 * stock:macd_12_26m:price + 0.8 * last_over_time(stock:macd_signal_9m:price[3m])
          or (avg_over_time(stock:macd_12_26m:price[9m]) and count_over_time(stock:macd_12_26m:price[9m]) >= 9)
      - record: stock:macd_histogram:price
        expr: stock:macd_12_26m:price - stock:macd_signal_9m:price

  # Least-squares trend over the last 30 1m bars (§7.5, §8.10, Release 2), from 30 minutes after the open:
  #   b = deriv(C[30m:1m]) (per second);  slope %/h = b * 3600 / C * 100
  #   R^2 = b^2 * Var(t) / Var(C), Var(t) = 60^2 * (30^2 - 1) / 12 = 269700 s^2;  t = sgn(b) * sqrt(R^2 * 28 / (1 - R^2))
  - name: nse_trend_regression
    interval: 1m
    rules:
      - record: stock:trend_slope_30m:percent_per_hour
        expr: |
          deriv(stock_last_price{tier="core"}[30m:1m]) * 3600 / (stock_last_price{tier="core"} > 0) * 100
          and on() stock_market_open == 1
          and on() stock_market_seconds_to_close <= 20700
      - record: stock:trend_r2_30m:ratio
        expr: |
          clamp_max(
            deriv(stock_last_price{tier="core"}[30m:1m]) ^ 2 * 269700
            / (stdvar_over_time(stock_last_price{tier="core"}[30m:1m]) > 0),
            1)
          and on() stock_market_open == 1
          and on() stock_market_seconds_to_close <= 20700
      # A perfect fit (R^2 = 1) has no finite t-statistic and is left out.
      - record: stock:trend_tstat_30m:ratio
        expr: |
          sgn(deriv(stock_last_price{tier="core"}[30m:1m]))
          * sqrt(stock:trend_r2_30m:ratio * 28 / ((1 - stock:trend_r2_30m:ratio) > 0))

  - name: nse_trend_alerts
    interval: 15s
    rules:
      # Least-squares projection of the last 10 minutes, 15 minutes ahead; all EQ tiers, within 5% of the band.
      # The offset 9m guard requires a (nearly) full window, e.g. after a Prometheus restart.
      - alert: StockProjectedCircuitHit
        expr: |
          (
              label_replace(
                  predict_linear(stock_last_price{instrument_type="EQ"}[10m], 900) >= stock_circuit_upper_limit_price
                and (stock_circuit_upper_limit_price - stock_last_price) < 0.05 * stock_last_price,
                "band", "upper", "", "")
            or
              label_replace(
                  predict_linear(stock_last_price{instrument_type="EQ"}[10m], 900) <= stock_circuit_lower_limit_price
                and (stock_last_price - stock_circuit_lower_limit_price) < 0.05 * stock_last_price,
                "band", "lower", "", "")
          )
          unless ignoring(band) stock_last_price >= stock_circuit_upper_limit_price
          unless ignoring(band) stock_last_price <= stock_circuit_lower_limit_price
          and ignoring(band) stock_last_price offset 9m
          and on() stock_market_open == 1
        for: 1m
        labels: {severity: warning, category: circuit, layer: condition, condition: projected_circuit_hit}
        annotations:
          summary: "{{ $labels.symbol }} on pace to hit its {{ $labels.band }} circuit within 15 minutes"
          description: "At the trend of the last 10 minutes {{ $labels.exchange }}:{{ $labels.symbol }} ({{ $labels.tier }} tier) projects to {{ $value | printf \"%.2f\" }}, beyond its {{ $labels.band }} price band."
          effectiveness: '{{ with printf `alert:forward_return_5d:percent{alertname="StockProjectedCircuitHit",band=%q,horizon="15m"}` $labels.band | query }}Mean 15m return after this alert over the last 5 days: {{ . | first | value | printf "%.2f" }}%{{ else }}No history yet{{ end }}'
          link: "https://www.nseindia.com/get-quotes/equity?symbol={{ $labels.symbol | urlquery }}"
