# promtool test rules prometheus/tests/nse_risk_test.yml
# Daily risk values are checked against the reference in reference_risk_test.yml; this file
# covers PortfolioVaRBreach. 25 session returns -1.2% .. +1.2%: VaR(95) = 1.08%.
rule_files:
  - ../rules/nse_risk.rules.yml

evaluation_interval: 1m

group_eval_order:
  - nse_risk_daily
  - nse_risk_portfolio
  - nse_risk_intraday
  - nse_risk_alerts

tests:
  - name: portfolio VaR breach fires after 5 minutes beyond the 1-day VaR
    interval: 1m
    input_series:
      - series: 'stock_market_open{job="stock_core",instance="se"}'
        values: '1x40'
      - series: 'portfolio:session_return:ratio'
        values: '-0.012+0.001x24'
      - series: 'portfolio:holding_value:sum'
        values: '1000000x40'
      # -0.5% until 29m, then -3%.
      - series: 'portfolio:day_change:sum'
        values: '-5000x29 -30927.84x10'
    promql_expr_test:
      - expr: portfolio:var_95_1d:percent
        eval_time: 30m
        exp_samples:
          - labels: 'portfolio:var_95_1d:percent'
            value: 1.0799999999999998
    alert_rule_test:
      - eval_time: 29m
        alertname: PortfolioVaRBreach
        exp_alerts: []
      - eval_time: 34m
        alertname: PortfolioVaRBreach
        exp_alerts: []
      - eval_time: 35m
        alertname: PortfolioVaRBreach
        exp_alerts:
          - exp_labels: {severity: warning, category: portfolio, layer: incident, incident: portfolio_var_breach}
            exp_annotations:
              summary: "Portfolio is down 3.00% today, beyond its 1-day VaR(95)"
              description: "Today's portfolio loss exceeds the historical 95% one-day value at risk of the last 90 days."

  - name: no portfolio VaR breach while the market is closed or without 20 sessions
    interval: 1m
    input_series:
      - series: 'stock_market_open{job="stock_core",instance="se"}'
        values: '0x20 1x20'
      - series: 'portfolio:session_return:ratio'
        values: '-0.012+0.001x24'
      - series: 'portfolio:holding_value:sum'
        values: '1000000x40'
      - series: 'portfolio:day_change:sum'
        values: '-30927.84x40'
    alert_rule_test:
      - eval_time: 15m
        alertname: PortfolioVaRBreach
        exp_alerts: []
    promql_expr_test:
      # 10 sessions only.
      - expr: portfolio:var_95_1d:percent
        eval_time: 9m
        exp_samples: []

  # Positive and negative cases of the intraday alerts are in reference_intraday_risk_test.yml.
  - name: no implied-move or abnormal-return alerts while the market is closed
    interval: 1m
    input_series:
      - series: 'stock_market_open{job="stock_core",instance="se"}'
        values: '0x150'
      - series: 'stock_last_price{job="stock_core",instance="se",exchange="NSE",symbol="NIFTY 50",sector="Index",instrument_type="INDEX",tier="core"}'
        values: '20000 20020 20000 20030 20010x146'
      - series: 'stock_previous_close_price{job="stock_core",instance="se",exchange="NSE",symbol="NIFTY 50",sector="Index",instrument_type="INDEX",tier="core"}'
        values: '19000x150'
      - series: 'stock_last_price{job="stock_core",instance="se",exchange="NSE",symbol="INDIA VIX",sector="Index",instrument_type="INDEX",tier="core"}'
        values: '14x150'
      - series: 'stock_last_price{job="stock_core",instance="se",exchange="NSE",symbol="INFY",sector="IT",instrument_type="EQ",tier="core"}'
        values: '1500 1501 1499 1502 1500x120 1600x26'
    promql_expr_test:
      - expr: market:implied_move:points
        eval_time: 2h
        exp_samples: []
      - expr: stock:abnormal_return_15m:percent
        eval_time: 2h
        exp_samples: []
    alert_rule_test:
      - eval_time: 2h10m
        alertname: MarketImpliedMoveExceeded
        exp_alerts: []
      - eval_time: 2h10m
        alertname: StockAbnormalReturn
        exp_alerts: []
