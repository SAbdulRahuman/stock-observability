# Generated by prometheus/tests/reference/kpiref.py (family price_levels). DO NOT EDIT.
rule_files:
  - ../rules/nse_price_levels.rules.yml

evaluation_interval: 15s

tests:
  - name: intraday return matches the reference
    interval: 1m
    input_series:
      - series: 'stock_last_price{job="stock_core",instance="se",exchange="NSE",symbol="INFY",sector="IT",instrument_type="EQ",tier="core"}'
        values: '100.95 100.65 100.85 100.90 101.25 100.65 100.50 100.20 99.75 99.45 99.20 99.10 98.75 98.90 98.70 97.45 97.90 97.75 97.45 97.55 97.65 97.70 97.35 97.45 96.85 97.40 96.90 96.80 96.80 96.90 96.80'
      - series: 'stock_open_price{job="stock_core",instance="se",exchange="NSE",symbol="INFY",sector="IT",instrument_type="EQ",tier="core"}'
        values: '99.75 99.75 99.75 99.75 99.75 99.75 99.75 99.75 99.75 99.75 99.75 99.75 99.75 99.75 99.75 99.75 99.75 99.75 99.75 99.75 99.75 99.75 99.75 99.75 99.75 99.75 99.75 99.75 99.75 99.75 99.75'
    promql_expr_test:
      - eval_time: 1m
        expr: 'abs(stock:intraday_return:percent{job="stock_core",instance="se",exchange="NSE",symbol="INFY",sector="IT",instrument_type="EQ",tier="core"} - (0.9022556390977501)) <= bool 1e-09'
        exp_samples:
          - labels: '{job="stock_core",instance="se",exchange="NSE",symbol="INFY",sector="IT",instrument_type="EQ",tier="core"}'
            value: 1
      - eval_time: 10m
        expr: 'abs(stock:intraday_return:percent{job="stock_core",instance="se",exchange="NSE",symbol="INFY",sector="IT",instrument_type="EQ",tier="core"} - (-0.5513784461152854)) <= bool 1e-09'
        exp_samples:
          - labels: '{job="stock_core",instance="se",exchange="NSE",symbol="INFY",sector="IT",instrument_type="EQ",tier="core"}'
            value: 1
      - eval_time: 30m
        expr: 'abs(stock:intraday_return:percent{job="stock_core",instance="se",exchange="NSE",symbol="INFY",sector="IT",instrument_type="EQ",tier="core"} - (-2.957393483709276)) <= bool 2.957393483709276e-09'
        exp_samples:
          - labels: '{job="stock_core",instance="se",exchange="NSE",symbol="INFY",sector="IT",instrument_type="EQ",tier="core"}'
            value: 1
