# promtool test rules prometheus/tests/nse_alerts_test.yml
# Release 1 condition and incident alerts: positive, negative and market-closed cases.
# KPI series are fed directly where the alert only reads recorded KPIs.
rule_files:
  - ../rules/nse_price_levels.rules.yml
  - ../rules/nse_trend.rules.yml
  - ../rules/nse_momentum.rules.yml
  - ../rules/nse_volatility.rules.yml
  - ../rules/nse_volume_liquidity.rules.yml
  - ../rules/nse_order_flow.rules.yml
  - ../rules/nse_market_breadth.rules.yml

evaluation_interval: 15s

tests:
  # --- StockMultiSessionBreakout ----------------------------------------------------------
  - name: multi-session breakout above the 20-session high on volume
    interval: 1m
    input_series:
      - series: 'stock_market_open{job="stock_core",instance="se"}'
        values: '1x30'
      - series: 'stock:session_high:price{job="stock_core",instance="se",exchange="NSE",symbol="INFY",sector="IT",instrument_type="EQ",tier="core"}'
        values: '100x15'
      - series: 'stock:session_low:price{job="stock_core",instance="se",exchange="NSE",symbol="INFY",sector="IT",instrument_type="EQ",tier="core"}'
        values: '90x15'
      - series: 'stock:relative_volume:ratio{job="stock_core",instance="se",exchange="NSE",symbol="INFY",sector="IT",instrument_type="EQ",tier="core"}'
        values: '2x30'
      - series: 'stock_last_price{job="stock_core",instance="se",exchange="NSE",symbol="INFY",sector="IT",instrument_type="EQ",tier="core"}'
        values: '99x16 105x14'
    alert_rule_test:
      - eval_time: 16m
        alertname: StockMultiSessionBreakout
      - eval_time: 19m
        alertname: StockMultiSessionBreakout
        exp_alerts:
          - exp_labels: {<<: &infy {job: stock_core, instance: se, exchange: NSE, symbol: INFY, sector: IT, instrument_type: EQ, tier: core}, direction: bullish, severity: info, category: price, layer: condition, condition: multi_session_breakout}
            exp_annotations:
              summary: INFY bullish 20-session breakout at 105
              description: NSE:INFY is trading beyond its 20-session high on more than 1.5x relative volume.
              effectiveness: No history yet
              link: https://www.nseindia.com/get-quotes/equity?symbol=INFY

  - name: no multi-session breakout with fewer than 15 sessions or low volume
    interval: 1m
    input_series:
      - series: 'stock_market_open{job="stock_core",instance="se"}'
        values: '1x30'
      - series: 'stock:session_high:price{job="stock_core",instance="se",exchange="NSE",symbol="FEW",sector="IT",instrument_type="EQ",tier="core"}'
        values: '100x10'
      - series: 'stock:relative_volume:ratio{job="stock_core",instance="se",exchange="NSE",symbol="FEW",sector="IT",instrument_type="EQ",tier="core"}'
        values: '2x30'
      - series: 'stock_last_price{job="stock_core",instance="se",exchange="NSE",symbol="FEW",sector="IT",instrument_type="EQ",tier="core"}'
        values: '105x30'
      - series: 'stock:session_high:price{job="stock_core",instance="se",exchange="NSE",symbol="QUIET",sector="IT",instrument_type="EQ",tier="core"}'
        values: '100x15'
      - series: 'stock:relative_volume:ratio{job="stock_core",instance="se",exchange="NSE",symbol="QUIET",sector="IT",instrument_type="EQ",tier="core"}'
        values: '1.2x30'
      - series: 'stock_last_price{job="stock_core",instance="se",exchange="NSE",symbol="QUIET",sector="IT",instrument_type="EQ",tier="core"}'
        values: '105x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: StockMultiSessionBreakout

  - name: multi-session breakout is silent while the market is closed
    interval: 1m
    input_series:
      - series: 'stock_market_open{job="stock_core",instance="se"}'
        values: '0x30'
      - series: 'stock:session_high:price{job="stock_core",instance="se",exchange="NSE",symbol="INFY",sector="IT",instrument_type="EQ",tier="core"}'
        values: '100x15'
      - series: 'stock:relative_volume:ratio{job="stock_core",instance="se",exchange="NSE",symbol="INFY",sector="IT",instrument_type="EQ",tier="core"}'
        values: '2x30'
      - series: 'stock_last_price{job="stock_core",instance="se",exchange="NSE",symbol="INFY",sector="IT",instrument_type="EQ",tier="core"}'
        values: '105x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: StockMultiSessionBreakout

  # --- StockOpeningRangeBreakout ----------------------------------------------------------
  - name: opening range breakout on the cross, with volume
    interval: 1m
    input_series:
      - series: 'stock_market_open{job="stock_core",instance="se"}'
        values: '1x60'
      - series: 'stock_market_seconds_to_close{job="stock_core",instance="se"}'
        values: '22500-60x60'
      - series: 'stock_high_price{job="stock_core",instance="se",exchange="NSE",symbol="INFY",sector="IT",instrument_type="EQ",tier="core"}'
        values: '101x60'
      - series: 'stock_low_price{job="stock_core",instance="se",exchange="NSE",symbol="INFY",sector="IT",instrument_type="EQ",tier="core"}'
        values: '99x60'
      - series: 'stock:relative_volume:ratio{job="stock_core",instance="se",exchange="NSE",symbol="INFY",sector="IT",instrument_type="EQ",tier="core"}'
        values: '2x60'
      - series: 'stock_last_price{job="stock_core",instance="se",exchange="NSE",symbol="INFY",sector="IT",instrument_type="EQ",tier="core"}'
        values: '100x34 102x25'
    alert_rule_test:
      - eval_time: 34m
        alertname: StockOpeningRangeBreakout
      - eval_time: 35m
        alertname: StockOpeningRangeBreakout
        exp_alerts:
          - exp_labels: {<<: *infy, direction: bullish, severity: info, category: price, layer: condition, condition: opening_range_breakout}
            exp_annotations:
              summary: INFY bullish opening range breakout at 102
              description: NSE:INFY crossed its 09:15-09:30 opening range high on more than 1.5x relative volume.
              effectiveness: No history yet
              link: https://www.nseindia.com/get-quotes/equity?symbol=INFY
      # Held by keep_firing_for after the crossing minute.
      - eval_time: 45m
        alertname: StockOpeningRangeBreakout
        exp_alerts:
          - exp_labels: {<<: *infy, direction: bullish, severity: info, category: price, layer: condition, condition: opening_range_breakout}
            exp_annotations:
              summary: INFY bullish opening range breakout at 102
              description: NSE:INFY crossed its 09:15-09:30 opening range high on more than 1.5x relative volume.
              effectiveness: No history yet
              link: https://www.nseindia.com/get-quotes/equity?symbol=INFY
      - eval_time: 55m
        alertname: StockOpeningRangeBreakout

  - name: no opening range breakout without volume or while closed
    interval: 1m
    input_series:
      - series: 'stock_market_open{job="stock_core",instance="se"}'
        values: '1x40 0x20'
      - series: 'stock_market_seconds_to_close{job="stock_core",instance="se"}'
        values: '22500-60x60'
      - series: 'stock_high_price{job="stock_core",instance="se",exchange="NSE",symbol="INFY",sector="IT",instrument_type="EQ",tier="core"}'
        values: '101x60'
      - series: 'stock_low_price{job="stock_core",instance="se",exchange="NSE",symbol="INFY",sector="IT",instrument_type="EQ",tier="core"}'
        values: '99x60'
      - series: 'stock:relative_volume:ratio{job="stock_core",instance="se",exchange="NSE",symbol="INFY",sector="IT",instrument_type="EQ",tier="core"}'
        values: '1.2x40 2x20'
      - series: 'stock_last_price{job="stock_core",instance="se",exchange="NSE",symbol="INFY",sector="IT",instrument_type="EQ",tier="core"}'
        values: '100x34 102x5 100x5 102x14'
    alert_rule_test:
      - eval_time: 35m
        alertname: StockOpeningRangeBreakout
      # Crosses again at 47m, after the close.
      - eval_time: 48m
        alertname: StockOpeningRangeBreakout

  # --- StockRangeExpansion ----------------------------------------------------------------
  - name: range expansion on volume, not on a quiet day or when closed
    interval: 1m
    input_series:
      - series: 'stock_market_open{job="stock_core",instance="se"}'
        values: '1x10 0x10'
      - series: 'stock:atr_14d:points{job="stock_core",instance="se",exchange="NSE",symbol="INFY",sector="IT",instrument_type="EQ",tier="core"}'
        values: '4x20'
      - series: 'stock_high_price{job="stock_core",instance="se",exchange="NSE",symbol="INFY",sector="IT",instrument_type="EQ",tier="core"}'
        values: '110x20'
      - series: 'stock_low_price{job="stock_core",instance="se",exchange="NSE",symbol="INFY",sector="IT",instrument_type="EQ",tier="core"}'
        values: '100x20'
      - series: 'stock:relative_volume:ratio{job="stock_core",instance="se",exchange="NSE",symbol="INFY",sector="IT",instrument_type="EQ",tier="core"}'
        values: '2.5x20'
      - series: 'stock:atr_14d:points{job="stock_core",instance="se",exchange="NSE",symbol="TCS",sector="IT",instrument_type="EQ",tier="core"}'
        values: '4x20'
      - series: 'stock_high_price{job="stock_core",instance="se",exchange="NSE",symbol="TCS",sector="IT",instrument_type="EQ",tier="core"}'
        values: '110x20'
      - series: 'stock_low_price{job="stock_core",instance="se",exchange="NSE",symbol="TCS",sector="IT",instrument_type="EQ",tier="core"}'
        values: '100x20'
      - series: 'stock:relative_volume:ratio{job="stock_core",instance="se",exchange="NSE",symbol="TCS",sector="IT",instrument_type="EQ",tier="core"}'
        values: '1.5x20'
    alert_rule_test:
      - eval_time: 30s
        alertname: StockRangeExpansion
      - eval_time: 3m
        alertname: StockRangeExpansion
        exp_alerts:
          - exp_labels: {<<: *infy, severity: warning, category: price, layer: condition, condition: range_expansion}
            exp_annotations:
              summary: INFY day range is 2.5x its ATR(14)
              description: NSE:INFY has a wide-range day (more than 2x its 14-session average true range) on more than 2x relative volume.
              effectiveness: No history yet
              link: https://www.nseindia.com/get-quotes/equity?symbol=INFY
      - eval_time: 15m
        alertname: StockRangeExpansion

  # --- StockLiquidityDrain ----------------------------------------------------------------
  - name: liquidity drain needs both a depth drop and a wide spread
    interval: 1m
    input_series:
      - series: 'stock_market_open{job="stock_core",instance="se"}'
        values: '1x40 0x10'
      - series: 'stock:depth_vs_1h:ratio{job="stock_core",instance="se",exchange="NSE",symbol="INFY",sector="IT",instrument_type="EQ",tier="core"}'
        values: '1x30 0.2x20'
      - series: 'stock_orderbook_spread_bps{job="stock_core",instance="se",exchange="NSE",symbol="INFY",sector="IT",instrument_type="EQ",tier="core"}'
        values: '5x30 15x20'
      - series: 'stock:orderbook_spread_5m_avg:bps{job="stock_core",instance="se",exchange="NSE",symbol="INFY",sector="IT",instrument_type="EQ",tier="core"}'
        values: '5x50'
      - series: 'stock:depth_vs_1h:ratio{job="stock_core",instance="se",exchange="NSE",symbol="TCS",sector="IT",instrument_type="EQ",tier="core"}'
        values: '1x30 0.2x20'
      - series: 'stock_orderbook_spread_bps{job="stock_core",instance="se",exchange="NSE",symbol="TCS",sector="IT",instrument_type="EQ",tier="core"}'
        values: '5x50'
      - series: 'stock:orderbook_spread_5m_avg:bps{job="stock_core",instance="se",exchange="NSE",symbol="TCS",sector="IT",instrument_type="EQ",tier="core"}'
        values: '5x50'
    alert_rule_test:
      - eval_time: 31m
        alertname: StockLiquidityDrain
      - eval_time: 34m
        alertname: StockLiquidityDrain
        exp_alerts:
          - exp_labels: {<<: *infy, severity: warning, category: flow, layer: condition, condition: liquidity_drain}
            exp_annotations:
              summary: INFY top-5 depth at 20% of its 1h average
              description: Order book depth of NSE:INFY fell below 25% of its 1h average while the spread widened to more than twice its 1h mean.
              effectiveness: No history yet
              link: https://www.nseindia.com/get-quotes/equity?symbol=INFY
      - eval_time: 45m
        alertname: StockLiquidityDrain

  # --- StockProjectedCircuitHit -----------------------------------------------------------
  - name: projected circuit hit, skipping instruments already at the band
    interval: 1m
    input_series:
      - series: 'stock_market_open{job="stock_core",instance="se"}'
        values: '1x20 0x10'
      - series: 'stock_last_price{job="stock_core",instance="se",exchange="NSE",symbol="INFY",sector="IT",instrument_type="EQ",tier="core"}'
        values: '100+0.5x30'
      - series: 'stock_circuit_upper_limit_price{job="stock_core",instance="se",exchange="NSE",symbol="INFY",sector="IT",instrument_type="EQ",tier="core"}'
        values: '120x30'
      - series: 'stock_circuit_lower_limit_price{job="stock_core",instance="se",exchange="NSE",symbol="INFY",sector="IT",instrument_type="EQ",tier="core"}'
        values: '80x30'
      - series: 'stock_last_price{job="stock_broad",instance="se",exchange="NSE",symbol="ZZZ",sector="unknown",instrument_type="EQ",tier="broad"}'
        values: '110x30'
      - series: 'stock_circuit_upper_limit_price{job="stock_broad",instance="se",exchange="NSE",symbol="ZZZ",sector="unknown",instrument_type="EQ",tier="broad"}'
        values: '110x30'
      - series: 'stock_circuit_lower_limit_price{job="stock_broad",instance="se",exchange="NSE",symbol="ZZZ",sector="unknown",instrument_type="EQ",tier="broad"}'
        values: '90x30'
    alert_rule_test:
      # 9m: 104.5 + 7.5 = 112 < 120.
      - eval_time: 9m
        alertname: StockProjectedCircuitHit
      # From 25m the projection (112.5 + 7.5) reaches 120.
      - eval_time: 18m
        alertname: StockProjectedCircuitHit
      - eval_time: 27m
        alertname: StockProjectedCircuitHit

  - name: no projected circuit hit while still more than 5% from the band
    interval: 1m
    input_series:
      - series: 'stock_market_open{job="stock_core",instance="se"}'
        values: '1x30'
      # 10m: LTP 110 projects to 125 >= 120, but the band is still 9% away.
      - series: 'stock_last_price{job="stock_core",instance="se",exchange="NSE",symbol="INFY",sector="IT",instrument_type="EQ",tier="core"}'
        values: '100+1x30'
      - series: 'stock_circuit_upper_limit_price{job="stock_core",instance="se",exchange="NSE",symbol="INFY",sector="IT",instrument_type="EQ",tier="core"}'
        values: '120x30'
      - series: 'stock_circuit_lower_limit_price{job="stock_core",instance="se",exchange="NSE",symbol="INFY",sector="IT",instrument_type="EQ",tier="core"}'
        values: '80x30'
    alert_rule_test:
      - eval_time: 12m
        alertname: StockProjectedCircuitHit

  - name: projected circuit hit fires on the trend
    interval: 1m
    input_series:
      - series: 'stock_market_open{job="stock_core",instance="se"}'
        values: '1x30'
      - series: 'stock_last_price{job="stock_core",instance="se",exchange="NSE",symbol="INFY",sector="IT",instrument_type="EQ",tier="core"}'
        values: '100+0.5x30'
      - series: 'stock_circuit_upper_limit_price{job="stock_core",instance="se",exchange="NSE",symbol="INFY",sector="IT",instrument_type="EQ",tier="core"}'
        values: '109x30'
      - series: 'stock_circuit_lower_limit_price{job="stock_core",instance="se",exchange="NSE",symbol="INFY",sector="IT",instrument_type="EQ",tier="core"}'
        values: '90x30'
      # Ledger history: only the matching band and the 15m horizon are quoted.
      - series: 'alert:forward_return_5d:percent{alertname="StockProjectedCircuitHit",band="upper",horizon="15m"}'
        values: '0.4321x30'
      - series: 'alert:forward_return_5d:percent{alertname="StockProjectedCircuitHit",band="upper",horizon="5m"}'
        values: '0.2x30'
      - series: 'alert:forward_return_5d:percent{alertname="StockProjectedCircuitHit",band="lower",horizon="15m"}'
        values: '-1x30'
    alert_rule_test:
      # Within 5% of the band and projected through it, but there is no 9-minute history yet.
      - eval_time: 8m
        alertname: StockProjectedCircuitHit
      - eval_time: 10m
        alertname: StockProjectedCircuitHit
        exp_alerts:
          - exp_labels: {<<: *infy, band: upper, severity: warning, category: circuit, layer: condition, condition: projected_circuit_hit}
            exp_annotations:
              summary: INFY on pace to hit its upper circuit within 15 minutes
              description: At the trend of the last 10 minutes NSE:INFY (core tier) projects to 112.50, beyond its upper price band.
              effectiveness: 'Mean 15m return after this alert over the last 5 days: 0.43%'
              link: https://www.nseindia.com/get-quotes/equity?symbol=INFY
      # 20m: LTP 110 is at the band, so the circuit-hit alert takes over.
      - eval_time: 20m
        alertname: StockProjectedCircuitHit

  # --- StockMomentumExhaustion ------------------------------------------------------------
  - name: bearish momentum exhaustion
    interval: 1m
    input_series:
      - series: 'stock_market_open{job="stock_core",instance="se"}'
        values: '1x30'
      - series: 'stock:rsi_14m:index{job="stock_core",instance="se",exchange="NSE",symbol="INFY",sector="IT",instrument_type="EQ",tier="core"}'
        values: '75x30'
      - series: 'stock:stochastic_k_14m:percent{job="stock_core",instance="se",exchange="NSE",symbol="INFY",sector="IT",instrument_type="EQ",tier="core"}'
        values: '85x30'
      - series: 'stock:macd_histogram:price{job="stock_core",instance="se",exchange="NSE",symbol="INFY",sector="IT",instrument_type="EQ",tier="core"}'
        values: '0+1x15 14-1x14'
      - series: 'stock:volume_delta_1h:ratio{job="stock_core",instance="se",exchange="NSE",symbol="INFY",sector="IT",instrument_type="EQ",tier="core"}'
        values: '-0.2x30'
      # Same oscillators but volume still supports the move.
      - series: 'stock:rsi_14m:index{job="stock_core",instance="se",exchange="NSE",symbol="TCS",sector="IT",instrument_type="EQ",tier="core"}'
        values: '75x30'
      - series: 'stock:stochastic_k_14m:percent{job="stock_core",instance="se",exchange="NSE",symbol="TCS",sector="IT",instrument_type="EQ",tier="core"}'
        values: '85x30'
      - series: 'stock:macd_histogram:price{job="stock_core",instance="se",exchange="NSE",symbol="TCS",sector="IT",instrument_type="EQ",tier="core"}'
        values: '0+1x15 14-1x14'
      - series: 'stock:volume_delta_1h:ratio{job="stock_core",instance="se",exchange="NSE",symbol="TCS",sector="IT",instrument_type="EQ",tier="core"}'
        values: '0.2x30'
      # Ledger history: only the matching direction and the 15m horizon are quoted.
      - series: 'alert:hit_rate_5d:ratio{alertname="StockMomentumExhaustion",direction="bearish",horizon="15m"}'
        values: '0.625x30'
      - series: 'alert:hit_rate_5d:ratio{alertname="StockMomentumExhaustion",direction="bearish",horizon="1h"}'
        values: '0.9x30'
      - series: 'alert:hit_rate_5d:ratio{alertname="StockMomentumExhaustion",direction="bullish",horizon="15m"}'
        values: '0.1x30'
    alert_rule_test:
      - eval_time: 12m
        alertname: StockMomentumExhaustion
      - eval_time: 22m
        alertname: StockMomentumExhaustion
        exp_alerts:
          - exp_labels: {<<: *infy, direction: bearish, severity: info, category: price, layer: condition, condition: momentum_exhaustion}
            exp_annotations:
              summary: INFY bearish momentum exhaustion (RSI 75.0)
              description: NSE:INFY is overbought on RSI(14) and %K, its MACD histogram is turning and volume delta opposes the move.
              effectiveness: '15m hit rate over the last 5 days: 62.5%'
              link: https://www.nseindia.com/get-quotes/equity?symbol=INFY

  - name: momentum exhaustion is silent while the market is closed
    interval: 1m
    input_series:
      - series: 'stock_market_open{job="stock_core",instance="se"}'
        values: '0x30'
      - series: 'stock:rsi_14m:index{job="stock_core",instance="se",exchange="NSE",symbol="INFY",sector="IT",instrument_type="EQ",tier="core"}'
        values: '75x30'
      - series: 'stock:stochastic_k_14m:percent{job="stock_core",instance="se",exchange="NSE",symbol="INFY",sector="IT",instrument_type="EQ",tier="core"}'
        values: '85x30'
      - series: 'stock:macd_histogram:price{job="stock_core",instance="se",exchange="NSE",symbol="INFY",sector="IT",instrument_type="EQ",tier="core"}'
        values: '0+1x15 14-1x14'
      - series: 'stock:volume_delta_1h:ratio{job="stock_core",instance="se",exchange="NSE",symbol="INFY",sector="IT",instrument_type="EQ",tier="core"}'
        values: '-0.2x30'
    alert_rule_test:
      - eval_time: 22m
        alertname: StockMomentumExhaustion

  # --- StockOrderFlowPressure -------------------------------------------------------------
  - name: order flow pressure needs all three microstructure signals
    interval: 1m
    input_series:
      - series: 'stock_market_open{job="stock_core",instance="se"}'
        values: '1x10 0x10'
      - series: 'stock:volume_delta_1h:ratio{job="stock_core",instance="se",exchange="NSE",symbol="INFY",sector="IT",instrument_type="EQ",tier="core"}'
        values: '-0.7x20'
      - series: 'stock:microprice_deviation:bps{job="stock_core",instance="se",exchange="NSE",symbol="INFY",sector="IT",instrument_type="EQ",tier="core"}'
        values: '-0.5x20'
      - series: 'stock_orderbook_imbalance_ratio{job="stock_core",instance="se",exchange="NSE",symbol="INFY",sector="IT",instrument_type="EQ",tier="core"}'
        values: '-0.4x20'
      - series: 'stock:volume_delta_1h:ratio{job="stock_core",instance="se",exchange="NSE",symbol="TCS",sector="IT",instrument_type="EQ",tier="core"}'
        values: '0.7x20'
      - series: 'stock:microprice_deviation:bps{job="stock_core",instance="se",exchange="NSE",symbol="TCS",sector="IT",instrument_type="EQ",tier="core"}'
        values: '0.5x20'
      - series: 'stock_orderbook_imbalance_ratio{job="stock_core",instance="se",exchange="NSE",symbol="TCS",sector="IT",instrument_type="EQ",tier="core"}'
        values: '0.1x20'
    alert_rule_test:
      - eval_time: 1m
        alertname: StockOrderFlowPressure
      - eval_time: 3m
        alertname: StockOrderFlowPressure
        exp_alerts:
          - exp_labels: {<<: *infy, direction: bearish, severity: info, category: flow, layer: condition, condition: order_flow_pressure}
            exp_annotations:
              summary: INFY bearish order flow pressure (volume delta -0.70)
              description: Tick-rule volume delta, microprice and top-5 depth imbalance of NSE:INFY all point down.
              effectiveness: No history yet
              link: https://www.nseindia.com/get-quotes/equity?symbol=INFY
      - eval_time: 15m
        alertname: StockOrderFlowPressure

  # --- SectorRotation ---------------------------------------------------------------------
  - name: sector rotation after 10 minutes of relative strength
    interval: 1m
    input_series:
      - series: 'stock_market_open{job="stock_core",instance="se"}'
        values: '1x20 0x10'
      - series: 'stock_change_percent{job="stock_core",instance="se",exchange="NSE",symbol="NIFTY 50",sector="Index",instrument_type="INDEX",tier="core"}'
        values: '0.5x30'
      - series: 'stock_change_percent{job="stock_core",instance="se",exchange="NSE",symbol="INFY",sector="IT",instrument_type="EQ",tier="core"}'
        values: '3x30'
      - series: 'stock_change_percent{job="stock_core",instance="se",exchange="NSE",symbol="SBIN",sector="Financial Services",instrument_type="EQ",tier="core"}'
        values: '2x30'
      - series: 'stock_change_percent{job="stock_broad",instance="se",exchange="NSE",symbol="ZZZ",sector="unknown",instrument_type="EQ",tier="broad"}'
        values: '9x30'
    alert_rule_test:
      - eval_time: 9m
        alertname: SectorRotation
      - eval_time: 12m
        alertname: SectorRotation
        exp_alerts:
          - exp_labels: {sector: IT, direction: bullish, severity: info, category: market, layer: condition, condition: sector_rotation}
            exp_annotations:
              summary: IT outperforms NIFTY 50 by 2.50 pp
              description: The average day change of NIFTY 200 stocks in IT has differed from NIFTY 50 by more than 2 percentage points for 10 minutes.
      - eval_time: 25m
        alertname: SectorRotation

  # --- MarketBreadthStress ----------------------------------------------------------------
  - name: breadth stress (warning) and euphoria (info)
    interval: 1m
    input_series:
      - series: 'stock_market_open{job="stock_core",instance="se"}'
        values: '1x60'
      - series: 'market:trin:ratio'
        values: '2.5x20 1x10 0.4x30'
      - series: 'market:above_vwap:ratio'
        values: '0.15x20 0.5x10 0.85x30'
    alert_rule_test:
      - eval_time: 9m
        alertname: MarketBreadthStress
      - eval_time: 12m
        alertname: MarketBreadthStress
        exp_alerts:
          - exp_labels: {incident: breadth_stress, direction: bearish, severity: warning, category: market, layer: incident}
            exp_annotations:
              summary: "Market breadth stress: TRIN 2.50"
              description: TRIN is above 2 and fewer than 20% of tracked equities trade above VWAP; selling is broad and volume-heavy.
      - eval_time: 25m
        alertname: MarketBreadthStress
      - eval_time: 45m
        alertname: MarketBreadthStress
        exp_alerts:
          - exp_labels: {incident: breadth_stress, direction: bullish, severity: info, category: market, layer: incident}
            exp_annotations:
              summary: "Market breadth euphoria: TRIN 0.40"
              description: TRIN is below 0.5 and more than 80% of tracked equities trade above VWAP; buying is broad and volume-heavy.

  - name: high TRIN alone is not breadth stress, nor when closed
    interval: 1m
    input_series:
      - series: 'stock_market_open{job="stock_core",instance="se"}'
        values: '1x20 0x20'
      - series: 'market:trin:ratio'
        values: '2.5x40'
      - series: 'market:above_vwap:ratio'
        values: '0.5x20 0.1x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: MarketBreadthStress
      - eval_time: 38m
        alertname: MarketBreadthStress

