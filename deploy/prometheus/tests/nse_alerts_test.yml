  # --- StockRSIDivergence (Release 2) ---------------------------------------------------------
  - name: bearish RSI divergence at a new 30m high, not when RSI keeps up
    interval: 1m
    input_series:
      - series: 'stock_market_open{job="stock_core",instance="se"}'
        values: '1x40'
      - series: 'stock_last_price{job="stock_core",instance="se",exchange="NSE",symbol="INFY",sector="IT",instrument_type="EQ",tier="core"}'
        values: '100+0.1x40'
      - series: 'stock:rsi_wilder_14m:index{job="stock_core",instance="se",exchange="NSE",symbol="INFY",sector="IT",instrument_type="EQ",tier="core"}'
        values: '80x9 65x30'
      - series: 'stock_last_price{job="stock_core",instance="se",exchange="NSE",symbol="TCS",sector="IT",instrument_type="EQ",tier="core"}'
        values: '100+0.1x40'
      - series: 'stock:rsi_wilder_14m:index{job="stock_core",instance="se",exchange="NSE",symbol="TCS",sector="IT",instrument_type="EQ",tier="core"}'
        values: '75x40'
    alert_rule_test:
      - eval_time: 8m
        alertname: StockRSIDivergence
      - eval_time: 12m
        alertname: StockRSIDivergence
        exp_alerts:
          - exp_labels: {<<: *infy, direction: bearish, severity: info, category: price, layer: condition, condition: rsi_divergence}
            exp_annotations:
              summary: INFY bearish RSI divergence (RSI 65.0)
              description: NSE:INFY made a new 30-minute high while Wilder RSI(14) stayed more than 10 points from its own 30-minute extreme.
              effectiveness: No history yet
              link: https://www.nseindia.com/get-quotes/equity?symbol=INFY

  - name: RSI divergence is silent while the market is closed
    interval: 1m
    input_series:
      - series: 'stock_market_open{job="stock_core",instance="se"}'
        values: '0x40'
      - series: 'stock_last_price{job="stock_core",instance="se",exchange="NSE",symbol="INFY",sector="IT",instrument_type="EQ",tier="core"}'
        values: '100+0.1x40'
      - series: 'stock:rsi_wilder_14m:index{job="stock_core",instance="se",exchange="NSE",symbol="INFY",sector="IT",instrument_type="EQ",tier="core"}'
        values: '80x9 65x30'
    alert_rule_test:
      - eval_time: 12m
        alertname: StockRSIDivergence

  # --- StockOrderBookWall (Release 2) ---------------------------------------------------------
  - name: order-book wall needs size and notional, only in session
    interval: 1m
    input_series:
      - series: 'stock_market_open{job="stock_core",instance="se"}'
        values: '1x10 0x10'
      - series: 'stock_depth_quantity{job="stock_core",instance="se",exchange="NSE",symbol="INFY",sector="IT",instrument_type="EQ",tier="core",side="bid",level="1"}'
        values: '100x20'
      - series: 'stock_depth_quantity{job="stock_core",instance="se",exchange="NSE",symbol="INFY",sector="IT",instrument_type="EQ",tier="core",side="bid",level="2"}'
        values: '100x20'
      - series: 'stock_depth_quantity{job="stock_core",instance="se",exchange="NSE",symbol="INFY",sector="IT",instrument_type="EQ",tier="core",side="bid",level="3"}'
        values: '10000x20'
      - series: 'stock_depth_price{job="stock_core",instance="se",exchange="NSE",symbol="INFY",sector="IT",instrument_type="EQ",tier="core",side="bid",level="1"}'
        values: '1000x20'
      - series: 'stock_depth_price{job="stock_core",instance="se",exchange="NSE",symbol="INFY",sector="IT",instrument_type="EQ",tier="core",side="bid",level="2"}'
        values: '999.95x20'
      - series: 'stock_depth_price{job="stock_core",instance="se",exchange="NSE",symbol="INFY",sector="IT",instrument_type="EQ",tier="core",side="bid",level="3"}'
        values: '999.9x20'
      # Same shape, but only INR 1 lakh at the wall.
      - series: 'stock_depth_quantity{job="stock_core",instance="se",exchange="NSE",symbol="PENNY",sector="IT",instrument_type="EQ",tier="core",side="bid",level="1"}'
        values: '100x20'
      - series: 'stock_depth_quantity{job="stock_core",instance="se",exchange="NSE",symbol="PENNY",sector="IT",instrument_type="EQ",tier="core",side="bid",level="2"}'
        values: '100x20'
      - series: 'stock_depth_quantity{job="stock_core",instance="se",exchange="NSE",symbol="PENNY",sector="IT",instrument_type="EQ",tier="core",side="bid",level="3"}'
        values: '10000x20'
      - series: 'stock_depth_price{job="stock_core",instance="se",exchange="NSE",symbol="PENNY",sector="IT",instrument_type="EQ",tier="core",side="bid",level="3"}'
        values: '10x20'
    alert_rule_test:
      - eval_time: 30s
        alertname: StockOrderBookWall
      - eval_time: 3m
        alertname: StockOrderBookWall
        exp_alerts:
          - exp_labels: {<<: *infy, side: bid, level: "3", severity: info, category: flow, layer: condition, condition: order_book_wall}
            exp_annotations:
              summary: "INFY bid wall at level 3: 100.0x the other levels"
              description: Level 3 on the bid side of NSE:INFY has held at least 5 times the average quantity of the other levels and INR 50 lakh for 1 minute.
              effectiveness: No history yet
              link: https://www.nseindia.com/get-quotes/equity?symbol=INFY
      - eval_time: 15m
        alertname: StockOrderBookWall
