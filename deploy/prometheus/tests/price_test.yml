# promtool test rules prometheus/tests/price_test.yml
rule_files:
  - ../rules/stock_recording.rules.yml
  - ../rules/stock_alerts.rules.yml

evaluation_interval: 15s

tests:
  - name: spike up fires for core equities only while the market is open
    interval: 15s
    input_series:
      - series: 'stock_market_open{job="stock_core",instance="se"}'
        values: '1x40'
      - series: 'stock_last_price{job="stock_core",instance="se",exchange="NSE",symbol="INFY",sector="IT",instrument_type="EQ",tier="core"}'
        values: '100x20 103x20'
      - series: 'stock_last_price{job="stock_broad",instance="se",exchange="NSE",symbol="ZZZ",sector="unknown",instrument_type="EQ",tier="broad"}'
        values: '100x20 103x20'
    alert_rule_test:
      - eval_time: 5m
        alertname: StockPriceSpikeUp
      - eval_time: 6m
        alertname: StockPriceSpikeUp
        exp_alerts:
          - exp_labels: {<<: &infy {job: stock_core, instance: se, exchange: NSE, symbol: INFY, sector: IT, instrument_type: EQ, tier: core}, severity: warning, category: price, layer: condition}
            exp_annotations:
              summary: INFY up 3.00% in 1 minute
              description: NSE:INFY (IT) rose more than 2% within one minute.
              link: https://www.nseindia.com/get-quotes/equity?symbol=INFY
      - eval_time: 7m30s
        alertname: StockPriceSpikeUp

  - name: market closed silences price alerts
    interval: 15s
    input_series:
      - series: 'stock_market_open{job="stock_core",instance="se"}'
        values: '0x40'
      - series: 'stock_last_price{job="stock_core",instance="se",exchange="NSE",symbol="INFY",sector="IT",instrument_type="EQ",tier="core"}'
        values: '100x20 90x20'
    alert_rule_test:
      - eval_time: 6m
        alertname: StockPriceSpikeUp
      - eval_time: 6m
        alertname: StockPriceSharpDrop
      - eval_time: 9m
        alertname: StockIntradayDrawdown

  - name: sharp drop over 5 minutes
    interval: 15s
    input_series:
      - series: 'stock_market_open{job="stock_core",instance="se"}'
        values: '1x40'
      - series: 'stock_last_price{job="stock_core",instance="se",exchange="NSE",symbol="INFY",sector="IT",instrument_type="EQ",tier="core"}'
        values: '100x20 96x20'
    alert_rule_test:
      - eval_time: 6m
        alertname: StockPriceSharpDrop
        exp_alerts:
          - exp_labels: {<<: *infy, severity: critical, category: price, layer: incident}
            exp_annotations:
              summary: INFY 5m return -4.00%
              description: NSE:INFY (IT) fell more than 3% within five minutes.
              link: https://www.nseindia.com/get-quotes/equity?symbol=INFY

  - name: intraday drawdown from day high
    interval: 15s
    input_series:
      - series: 'stock_market_open{job="stock_core",instance="se"}'
        values: '1x40'
      - series: 'stock_high_price{job="stock_core",instance="se",exchange="NSE",symbol="INFY",sector="IT",instrument_type="EQ",tier="core"}'
        values: '110x40'
      - series: 'stock_last_price{job="stock_core",instance="se",exchange="NSE",symbol="INFY",sector="IT",instrument_type="EQ",tier="core"}'
        values: '110x10 103x30'
    alert_rule_test:
      - eval_time: 3m
        alertname: StockIntradayDrawdown
      - eval_time: 5m
        alertname: StockIntradayDrawdown
        exp_alerts:
          - exp_labels: {<<: *infy, severity: warning, category: price, layer: condition}
            exp_annotations:
              summary: INFY drawdown from day high -6.36%
              description: NSE:INFY has given up at least 5% from today's high.

  - name: gap open only in the first 15 minutes
    interval: 15s
    input_series:
      - series: 'stock_market_open{job="stock_core",instance="se"}'
        values: '1x80'
      - series: 'stock_market_seconds_to_close{job="stock_core",instance="se"}'
        values: '22500-15x80'
      - series: 'stock_open_price{job="stock_core",instance="se",exchange="NSE",symbol="INFY",sector="IT",instrument_type="EQ",tier="core"}'
        values: '103x80'
      - series: 'stock_previous_close_price{job="stock_core",instance="se",exchange="NSE",symbol="INFY",sector="IT",instrument_type="EQ",tier="core"}'
        values: '100x80'
    alert_rule_test:
      - eval_time: 5m
        alertname: StockGapOpen
        exp_alerts:
          - exp_labels: {<<: *infy, severity: info, category: price, layer: condition}
            exp_annotations:
              summary: INFY opened with a 3.00% gap
              description: NSE:INFY opened at least 3% away from the previous close.
      - eval_time: 16m
        alertname: StockGapOpen

  - name: VWAP deviation sustained for 2 minutes
    interval: 15s
    input_series:
      - series: 'stock_market_open{job="stock_core",instance="se"}'
        values: '1x40'
      - series: 'stock_average_traded_price{job="stock_core",instance="se",exchange="NSE",symbol="INFY",sector="IT",instrument_type="EQ",tier="core"}'
        values: '100x40'
      - series: 'stock_last_price{job="stock_core",instance="se",exchange="NSE",symbol="INFY",sector="IT",instrument_type="EQ",tier="core"}'
        values: '100x4 102x36'
    alert_rule_test:
      - eval_time: 2m
        alertname: StockVWAPDeviation
      - eval_time: 5m
        alertname: StockVWAPDeviation
        exp_alerts:
          - exp_labels: {<<: *infy, severity: info, category: price, layer: condition}
            exp_annotations:
              summary: INFY is 2.00% away from VWAP
              description: NSE:INFY has traded at least 2% away from its volume weighted average price for 3 minutes.

  - name: bullish 5m/30m moving average crossover
    interval: 15s
    input_series:
      - series: 'stock_market_open{job="stock_core",instance="se"}'
        values: '1x160'
      - series: 'stock_last_price{job="stock_core",instance="se",exchange="NSE",symbol="INFY",sector="IT",instrument_type="EQ",tier="core"}'
        values: '100x120 110x40'
    alert_rule_test:
      - eval_time: 29m
        alertname: StockMACrossover
      - eval_time: 31m
        alertname: StockMACrossover
        exp_alerts:
          - exp_labels: {<<: *infy, direction: bullish, severity: info, category: price, layer: condition}
            exp_annotations:
              summary: INFY bullish 5m/30m moving average crossover
              description: The 5 minute average price of NSE:INFY crossed its 30 minute average (bullish).
