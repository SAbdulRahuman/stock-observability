# promtool test rules prometheus/tests/nse_momentum_test.yml
# Formula values are checked in reference_momentum_test.yml; this file covers edge cases.
rule_files:
  - ../rules/nse_momentum.rules.yml
  - ../rules/nse_trend.rules.yml

evaluation_interval: 15s

tests:
  - name: RSI edge cases and tier scoping
    interval: 1m
    input_series:
      - series: 'stock_last_price{job="stock_core",instance="se",exchange="NSE",symbol="UP",sector="IT",instrument_type="EQ",tier="core"}'
        values: '100+1x30'
      - series: 'stock_last_price{job="stock_core",instance="se",exchange="NSE",symbol="DOWN",sector="IT",instrument_type="EQ",tier="core"}'
        values: '200-1x30'
      - series: 'stock_last_price{job="stock_core",instance="se",exchange="NSE",symbol="FLAT",sector="IT",instrument_type="EQ",tier="core"}'
        values: '100x30'
      - series: 'stock_last_price{job="stock_broad",instance="se",exchange="NSE",symbol="ZZZ",sector="unknown",instrument_type="EQ",tier="broad"}'
        values: '100+1x30'
    promql_expr_test:
      - expr: stock:rsi_14m:index{symbol=~"UP|DOWN"}
        eval_time: 20m
        exp_samples:
          - labels: 'stock:rsi_14m:index{job="stock_core",instance="se",exchange="NSE",symbol="UP",sector="IT",instrument_type="EQ",tier="core"}'
            value: 100
          - labels: 'stock:rsi_14m:index{job="stock_core",instance="se",exchange="NSE",symbol="DOWN",sector="IT",instrument_type="EQ",tier="core"}'
            value: 0
      # Flat price: 0/0 -> NaN, which never satisfies an alert threshold.
      - expr: stock:rsi_14m:index{symbol="FLAT"} > 0 or stock:rsi_14m:index{symbol="FLAT"} <= 0
        eval_time: 20m
        exp_samples: []
      - expr: count(stock:rsi_14m:index{symbol="FLAT"})
        eval_time: 20m
        exp_samples:
          - labels: '{}'
            value: 1
      - expr: stock:rsi_14m:index{tier="broad"}
        eval_time: 20m
        exp_samples: []
      # %K: rising price closes at the 14m high, falling at the low; flat has no range.
      - expr: stock:stochastic_k_14m:percent
        eval_time: 20m
        exp_samples:
          - labels: 'stock:stochastic_k_14m:percent{job="stock_core",instance="se",exchange="NSE",symbol="UP",sector="IT",instrument_type="EQ",tier="core"}'
            value: 100
          - labels: 'stock:stochastic_k_14m:percent{job="stock_core",instance="se",exchange="NSE",symbol="DOWN",sector="IT",instrument_type="EQ",tier="core"}'
            value: 0
      # MACD of a linear ramp: SMA12 - SMA26 = slope * (26 - 12) / 2.
      - expr: stock:macd_12_26m:price{symbol="UP"}
        eval_time: 28m
        exp_samples:
          - labels: 'stock:macd_12_26m:price{job="stock_core",instance="se",exchange="NSE",symbol="UP",sector="IT",instrument_type="EQ",tier="core"}'
            value: 7

  - name: relative strength vs NIFTY 50 for core equities
    interval: 1m
    input_series:
      - series: 'stock_change_percent{job="stock_core",instance="se",exchange="NSE",symbol="NIFTY 50",sector="Index",instrument_type="INDEX",tier="core"}'
        values: '-0.5x5'
      - series: 'stock_change_percent{job="stock_core",instance="se",exchange="NSE",symbol="NIFTY BANK",sector="Index",instrument_type="INDEX",tier="core"}'
        values: '1x5'
      - series: 'stock_change_percent{job="stock_core",instance="se",exchange="NSE",symbol="INFY",sector="IT",instrument_type="EQ",tier="core"}'
        values: '2x5'
      - series: 'stock_change_percent{job="stock_broad",instance="se",exchange="NSE",symbol="ZZZ",sector="unknown",instrument_type="EQ",tier="broad"}'
        values: '3x5'
    promql_expr_test:
      - expr: stock:relative_strength_nifty:percent
        eval_time: 2m
        exp_samples:
          - labels: 'stock:relative_strength_nifty:percent{job="stock_core",instance="se",exchange="NSE",symbol="INFY",sector="IT",instrument_type="EQ",tier="core"}'
            value: 2.5

  - name: relative strength is absent without NIFTY 50
    interval: 1m
    input_series:
      - series: 'stock_change_percent{job="stock_core",instance="se",exchange="NSE",symbol="INFY",sector="IT",instrument_type="EQ",tier="core"}'
        values: '2x5'
    promql_expr_test:
      - expr: stock:relative_strength_nifty:percent
        eval_time: 2m
        exp_samples: []
