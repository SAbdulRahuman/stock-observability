# promtool test rules prometheus/tests/nse_regimes_test.yml
# Regime and score values are checked against the reference in reference_regime_test.yml;
# this file covers the two regime alerts.
rule_files:
  - ../rules/nse_regimes.rules.yml

evaluation_interval: 1m

group_eval_order:
  - nse_regimes
  - nse_regimes_stock
  - nse_regimes_alerts

tests:
  # VIX 15 -> 26 at 20m: NORMAL until 19m, HIGH_VOLATILITY from 20m.
  - name: regime change alerts while the new regime is younger than 15 minutes
    interval: 1m
    input_series:
      - series: 'stock_market_open{job="stock_core",instance="se"}'
        values: '1x45'
      - series: 'stock_market_seconds_to_close{job="stock_core",instance="se"}'
        values: '22500-60x45'
      - series: 'stock_last_price{job="stock_core",instance="se",exchange="NSE",symbol="INDIA VIX",sector="Index",instrument_type="INDEX",tier="core"}'
        values: '15x19 26x25'
    promql_expr_test:
      - expr: market:regime:info
        eval_time: 10m
        exp_samples:
          - labels: 'market:regime:info{regime="NORMAL"}'
            value: 1
      - expr: market:regime:code
        eval_time: 25m
        exp_samples:
          - labels: 'market:regime:code'
            value: 2
    alert_rule_test:
      # First 15 minutes of the session: no history to compare with.
      - eval_time: 10m
        alertname: MarketRegimeChange
        exp_alerts: []
      - eval_time: 25m
        alertname: MarketRegimeChange
        exp_alerts:
          - exp_labels:
              severity: info
              category: market
              layer: condition
              condition: regime_change
              regime: HIGH_VOLATILITY
            exp_annotations:
              summary: "Market regime is now HIGH_VOLATILITY"
              description: "The NSE market regime changed to HIGH_VOLATILITY within the last 15 minutes (precedence-ordered heuristic from breadth, momentum, volatility, liquidity and trend scores)."
      # 15 minutes after the change the regime is no longer new.
      - eval_time: 40m
        alertname: MarketRegimeChange
        exp_alerts: []

  # Weak breadth, VIX 30, thin depth and 50 lower circuits from 10m: stress 94.
  - name: market stress incident fires after 5 minutes above 70
    interval: 1m
    input_series:
      - series: 'stock_market_open{job="stock_core",instance="se"}'
        values: '1x20'
      - series: 'market:advancers:count'
        values: '1000x9 200x11'
      - series: 'market:decliners:count'
        values: '900x9 1800x11'
      - series: 'market:above_vwap:ratio'
        values: '0.5x9 0.1x11'
      - series: 'market:trin:ratio'
        values: '1x9 2.5x11'
      - series: 'stock_last_price{job="stock_core",instance="se",exchange="NSE",symbol="INDIA VIX",sector="Index",instrument_type="INDEX",tier="core"}'
        values: '15x9 30x11'
      - series: 'stock:depth_vs_1h:ratio{job="stock_core",instance="se",exchange="NSE",symbol="INFY",sector="IT",instrument_type="EQ",tier="core"}'
        values: '1x9 0.2x11'
      - series: 'stock:depth_vs_1h:ratio{job="stock_core",instance="se",exchange="NSE",symbol="TCS",sector="IT",instrument_type="EQ",tier="core"}'
        values: '1x9 0.2x11'
      - series: 'market:circuit_hits:count{band="lower"}'
        values: '0x9 50x11'
    alert_rule_test:
      - eval_time: 5m
        alertname: MarketStressIncident
        exp_alerts: []
      # Pending from 10m.
      - eval_time: 14m
        alertname: MarketStressIncident
        exp_alerts: []
      - eval_time: 15m
        alertname: MarketStressIncident
        exp_alerts:
          - exp_labels:
              severity: warning
              category: market
              layer: incident
              incident: market_stress
            exp_annotations:
              summary: "Market stress score 94"
              description: "Weak breadth, high volatility, thin liquidity and lower-circuit hits combine to a stress score above 70 for 5 minutes."

  - name: no regimes or regime alerts while the market is closed
    interval: 1m
    input_series:
      - series: 'stock_market_open{job="stock_core",instance="se"}'
        values: '0x40'
      - series: 'stock_market_seconds_to_close{job="stock_core",instance="se"}'
        values: '0x40'
      - series: 'stock_last_price{job="stock_core",instance="se",exchange="NSE",symbol="INDIA VIX",sector="Index",instrument_type="INDEX",tier="core"}'
        values: '15x19 30x20'
      - series: 'market:advancers:count'
        values: '200x40'
      - series: 'market:decliners:count'
        values: '1800x40'
      - series: 'market:above_vwap:ratio'
        values: '0.1x40'
      - series: 'market:trin:ratio'
        values: '2.5x40'
      - series: 'stock:depth_vs_1h:ratio{job="stock_core",instance="se",exchange="NSE",symbol="INFY",sector="IT",instrument_type="EQ",tier="core"}'
        values: '0.2x40'
      - series: 'market:circuit_hits:count{band="lower"}'
        values: '50x40'
    promql_expr_test:
      - expr: market:regime:info
        eval_time: 25m
        exp_samples: []
    alert_rule_test:
      - eval_time: 25m
        alertname: MarketRegimeChange
        exp_alerts: []
      - eval_time: 25m
        alertname: MarketStressIncident
        exp_alerts: []
