# Prometheus configuration for stock observability.
#
# Ingestion budget (default watchlist, see stock_exporter/examples/watchlist.yml):
#   stock_core  : NIFTY 200 + indices, all collectors incl. depth/orderbook, 1s -> ~13,000 samples/s
#   stock_daily : daily candle indicators of the core tier (forecast rules), 60s -> ~7,000 samples/min
#   stock_broad : every other NSE EQ symbol, quote+circuit, 5s -> ~6,000 samples/s
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  # Exposes scrape_timeout_seconds / scrape_sample_limit used by StockScrapeUnhealthy.
  extra_scrape_metrics: true
  external_labels:
    system: stock-observability

storage:
  tsdb:
    retention:
      time: 90d
      size: 60GB

rule_files:
  - /etc/prometheus/rules/*.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: stock_core
    scrape_interval: 1s
    scrape_timeout: 900ms
    sample_limit: 20000
    label_limit: 16
    scrape_protocols: [PrometheusProto, OpenMetricsText1.0.0, PrometheusText0.0.4]
    params:
      tier: [core]
      exclude[]: [daily]
    static_configs:
      - targets: ["stock_exporter:9101"]

  # Completed-session indicators for the forecast rules (nse_forecast.rules.yml); change once per session.
  - job_name: stock_daily
    scrape_interval: 60s
    scrape_timeout: 10s
    sample_limit: 15000
    label_limit: 16
    params:
      tier: [core]
      collect[]: [daily]
    static_configs:
      - targets: ["stock_exporter:9101"]

  - job_name: stock_broad
    scrape_interval: 5s
    scrape_timeout: 4s
    sample_limit: 80000
    label_limit: 16
    scrape_protocols: [PrometheusProto, OpenMetricsText1.0.0, PrometheusText0.0.4]
    params:
      tier: [broad]
      collect[]: [quote, circuit]
    static_configs:
      - targets: ["stock_exporter:9101"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  # Quant Lab (deploy/quantlab): option analytics and forecasts.
  - job_name: stock_quantlab
    scrape_interval: 30s
    static_configs:
      - targets: ["quantlab:9108"]
