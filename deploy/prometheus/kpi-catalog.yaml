  - name: stock:range_position:ratio
    kind: kpi
    family: technical
    level: stock_intelligence
    capability: price
    release: R2
    formula: "(C - L) / (H - L)"
    inputs: [stock_last_price, stock_high_price, stock_low_price]
    rule_file: nse_returns.rules.yml
    frequency: 15s
    scope: core
    unit: ratio
    range: {min: 0, max: 1}
    warmup: 0s
    quality: exact
    method: close location within the day range; the post_close value is the daily close location
    limitation: "absent while H = L"

  # --- Trend regression (nse_trend_regression) ------------------------------------------------
  - name: stock:trend_slope_30m:percent_per_hour
    kind: kpi
    family: technical
    level: stock_intelligence
    capability: trend
    release: R2
    formula: "deriv(C[30m:1m]) * 3600 / C * 100"
    inputs: [stock_last_price]
    rule_file: nse_trend.rules.yml
    frequency: 1m
    scope: core
    unit: percent_per_hour
    warmup: 30m
    quality: exact
    method: least-squares slope of the last 30 1m closes
    dashboard_default: true

  - name: stock:trend_r2_30m:ratio
    kind: kpi
    family: technical
    level: stock_intelligence
    capability: trend
    release: R2
    formula: "R^2 = b^2 * 269700 / Var(C), 30 1m closes"
    inputs: [stock_last_price]
    rule_file: nse_trend.rules.yml
    frequency: 1m
    scope: core
    unit: ratio
    range: {min: 0, max: 1}
    warmup: 30m
    quality: exact
    method: coefficient of determination of the 30-bar linear trend
    limitation: "residuals are autocorrelated; use for ranking, not significance"
    dashboard_default: true

  - name: stock:trend_tstat_30m:ratio
    kind: kpi
    family: technical
    level: stock_intelligence
    capability: trend
    release: R2
    formula: "t = sgn(b) * sqrt(R^2 * 28 / (1 - R^2))"
    inputs: [stock:trend_r2_30m:ratio]
    rule_file: nse_trend.rules.yml
    frequency: 1m
    scope: core
    unit: ratio
    warmup: 30m
    quality: exact
    method: t-statistic of the 30-bar slope
    limitation: "absent for a perfect fit; overstates significance (autocorrelated residuals)"

  # --- Momentum oscillators (Release 2) --------------------------------------------------------
  - name: stock:momentum_10m:points
    kind: kpi
    family: technical
