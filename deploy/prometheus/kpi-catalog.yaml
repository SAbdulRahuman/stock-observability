    inputs: [stock_change_percent]
    rule_file: nse_momentum.rules.yml
    frequency: 15s
    scope: core
    unit: percent
    warmup: 0s
    quality: exact
    method: percentage-point spread vs the benchmark, core EQ
    alertable: true
    coverage: true
    dashboard_default: true

  - name: stock:macd_12_26m:price
    kind: kpi
    family: technical
    level: stock_intelligence
    capability: momentum
    release: R1
    formula: "MACD = EMA12(C) - EMA26(C), 1m bars"
    inputs: [stock:ema_12m:price, stock:ema_26m:price]
    rule_file: nse_trend.rules.yml
    frequency: 1m
    scope: core
    unit: price
    warmup: 26m
    quality: exact
    method: stateful EMAs seeded with the SMA of the session's first n bars (EMA-based since R2)
    limitation: "re-seeded from the last n bars after a gap longer than 3 minutes"
    alertable: true
    coverage: true
    dashboard_default: true

