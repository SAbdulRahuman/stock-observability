# KPI contracts (proposal §A4). `make check-kpis` keeps this file, the rule files and the
# generated stock_kpi_info textfile in sync.
#
# kind:     kpi | snapshot | signal | quality | helper   (only kpi entries need family..frequency;
#           helper = intermediate state of a stateful KPI)
# family:   technical | microstructure | market | risk | derivatives | predictive
# level:    market_health | sector_intelligence | stock_intelligence | risk_intelligence | ...
# scope:    core (tier=core) | broad | all_eq (EQ in both tiers) | market | sector
# quality:  exact | approximation | proxy | heuristic | model
# rule_file: rule file base name, or `exporter` for metrics stock_exporter exposes directly
# warmup_sessions: completed sessions of EOD snapshots needed before the KPI has a value
# coverage: tracked by kpi:coverage:ratio and KPIDataQualityDegraded
kpis:
  # --- EOD session snapshots (nse_eod_snapshot) ----------------------------------------------
  - name: stock:session_high:price
    kind: snapshot
    release: R1
    formula: "H at post_close (one sample per trading day)"
    inputs: [stock_high_price, stock_market_phase]
    rule_file: nse_eod_snapshot.rules.yml
    frequency: 30m
    scope: core
    unit: price

  - name: stock:session_low:price
    kind: snapshot
    release: R1
    formula: "L at post_close (one sample per trading day)"
    inputs: [stock_low_price, stock_market_phase]
    rule_file: nse_eod_snapshot.rules.yml
    frequency: 30m
    scope: core
    unit: price

  - name: stock:session_true_range:points
    kind: snapshot
    release: R1
    formula: "TR = max(H, PC) - min(L, PC) at post_close"
    inputs: [stock_high_price, stock_low_price, stock_previous_close_price, stock_market_phase]
    rule_file: nse_eod_snapshot.rules.yml
    frequency: 30m
    scope: core
    unit: points

  - name: stock:session_volume:shares
    kind: snapshot
    release: R1
    formula: "V at post_close, EQ only"
    inputs: [stock_day_volume_shares, stock_market_phase]
    rule_file: nse_eod_snapshot.rules.yml
    frequency: 30m
    scope: core
    unit: shares

  - name: stock:session_log_return:ratio
    kind: snapshot
    release: R2
    formula: "ln(C / PC) at post_close"
    inputs: [stock_last_price, stock_previous_close_price, stock_market_phase]
    rule_file: nse_eod_snapshot.rules.yml
    frequency: 30m
    scope: core
    unit: ratio

  - name: stock:session_turnover:inr
    kind: snapshot
    release: R2
    formula: "V * VWAP at post_close, EQ only"
    inputs: [stock_day_volume_shares, stock_average_traded_price, stock_market_phase]
    rule_file: nse_eod_snapshot.rules.yml
    frequency: 30m
    scope: core
    unit: inr

  - name: stock:session_log_range_sq:ratio
    kind: snapshot
    release: R2
    formula: "ln(H / L)^2 at post_close (Parkinson input)"
    inputs: [stock_high_price, stock_low_price, stock_market_phase]
    rule_file: nse_eod_snapshot.rules.yml
    frequency: 30m
    scope: core
    unit: ratio

  - name: market:session_dispersion:percent
    kind: snapshot
    release: R2
    formula: "market:dispersion:percent at post_close"
    inputs: [market:dispersion:percent, stock_market_phase]
    rule_file: nse_eod_snapshot.rules.yml
    frequency: 30m
    scope: market
    unit: percent

  # --- Signals and data quality -------------------------------------------------------------
  - name: stock:signal_active:bool
    kind: signal
    release: R1
    formula: "1 while a KPI threshold holds during the session; labels signal, direction"
    inputs: [stock:rsi_14m:index, stock:stochastic_k_14m:percent, stock:bollinger_percent_b_20m:ratio, stock:bollinger_width_20m:percent, stock:relative_volume:ratio, stock:pivot:price, stock:relative_strength_nifty:percent]
    rule_file: nse_signals.rules.yml
    frequency: 1m
    scope: core
    unit: bool

  - name: stock:event:bool
    kind: signal
    release: R2
    formula: "1 in the minute a condition starts to hold; labels event, direction (+ level for pivot_break)"
    inputs: [stock:macd_histogram:price, stock:pivot:price, stock:bollinger_percent_b_20m:ratio, stock:rsi_wilder_14m:index, stock:sma_50m:price, stock:sma_200m:price]
    rule_file: nse_events.rules.yml
    frequency: 1m
    scope: core
    unit: bool

  - name: kpi:fresh_core_instruments:ratio
    kind: quality
    release: R1
    formula: "count(tick age < 60s) / count(core instruments)"
    inputs: [stock_tick_age_seconds]
    rule_file: nse_kpi_quality.rules.yml
    frequency: 1m
    scope: core
    unit: ratio

  - name: kpi:coverage:ratio
    kind: quality
    release: R1
    formula: "instruments with a fresh KPI value / instruments in scope, label kpi"
    inputs: [stock_tick_age_seconds]
    rule_file: nse_kpi_quality.rules.yml
    frequency: 1m
    scope: market
    unit: ratio

  # --- Price -------------------------------------------------------------------------------
  - name: stock:return_1m:percent
    kind: kpi
    family: technical
    level: stock_intelligence
    capability: price
    release: R1
    formula: "(C / C[1m ago] - 1) * 100"
    inputs: [stock_last_price]
    rule_file: stock_recording.rules.yml
    frequency: 5s
    scope: core
    unit: percent
    warmup: 1m
    quality: exact
    method: simple return
    alertable: true
    coverage: true
    dashboard_default: true

  - name: stock:return_5m:percent
    kind: kpi
    family: technical
    level: stock_intelligence
    capability: price
    release: R1
    formula: "(C / C[5m ago] - 1) * 100"
    inputs: [stock_last_price]
    rule_file: stock_recording.rules.yml
    frequency: 5s
    scope: core
    unit: percent
    warmup: 5m
    quality: exact
    method: simple return
    alertable: true
    coverage: true

  - name: stock:return_15m:percent
    kind: kpi
    family: technical
    level: stock_intelligence
    capability: price
    release: R1
    formula: "(C / C[15m ago] - 1) * 100"
    inputs: [stock_last_price]
    rule_file: stock_recording.rules.yml
    frequency: 5s
    scope: core
    unit: percent
    warmup: 15m
    quality: exact
    method: simple return
    alertable: true
    coverage: true

  - name: stock:gap_open:percent
    kind: kpi
    family: technical
    level: stock_intelligence
    capability: price
    release: R1
    formula: "(O - PC) / PC * 100"
    inputs: [stock_open_price, stock_previous_close_price]
    rule_file: stock_recording.rules.yml
    frequency: 5s
    scope: core
    unit: percent
    warmup: 0s
    quality: exact
    method: opening gap vs previous official close
    alertable: true
    coverage: true

  - name: stock:vwap_deviation:percent
    kind: kpi
    family: technical
    level: stock_intelligence
    capability: price
    release: R1
    formula: "(C - VWAP) / VWAP * 100"
    inputs: [stock_last_price, stock_average_traded_price]
    rule_file: stock_recording.rules.yml
    frequency: 5s
    scope: core
    unit: percent
    warmup: 0s
    quality: exact
    method: exchange VWAP (average traded price)
    alertable: true
    coverage: true
    dashboard_default: true

  - name: stock:intraday_return:percent
    kind: kpi
    family: technical
    level: stock_intelligence
    capability: price
    release: R1
    formula: "(C - O) / O * 100"
    inputs: [stock_last_price, stock_open_price]
    rule_file: nse_price_levels.rules.yml
    frequency: 15s
    scope: core
    unit: percent
    warmup: 0s
    quality: exact
    method: return since today's open
    alertable: true
    coverage: true
    dashboard_default: true

  - name: stock:pivot:price
    kind: kpi
    family: technical
    level: stock_intelligence
    capability: price
    release: R1
    formula: "P = (PH + PL + PC)/3; R1 = 2P - PL; S1 = 2P - PH; R2 = P + (PH - PL); S2 = P - (PH - PL)"
    inputs: [stock:session_high:price, stock:session_low:price, stock_previous_close_price]
    rule_file: nse_price_levels.rules.yml
    frequency: 15s
    scope: core
    unit: price
    warmup: 0s
    warmup_sessions: 1
    quality: exact
    method: classic floor pivots, label level=P|R1|R2|S1|S2, pre_open and open only
    alertable: true
    coverage: true
    dashboard_default: true

  - name: stock:opening_range:price
    kind: kpi
    family: technical
    level: stock_intelligence
    capability: price
    release: R1
    formula: "[L, H] over 09:15-09:30 (ORB-15)"
    inputs: [stock_high_price, stock_low_price, stock_market_seconds_to_close]
    rule_file: nse_price_levels.rules.yml
    frequency: 15s
    scope: core
    unit: price
    warmup: 0s
    quality: exact
    method: day high/low recorded during the first 15 minutes, label bound=high|low; read with last_over_time(...[6h15m])
    alertable: true
    coverage: false
    dashboard_default: true

  # --- Momentum / trend -------------------------------------------------------------------
  - name: stock:rsi_14m:index
    kind: kpi
    family: technical
    level: stock_intelligence
    capability: momentum
    release: R1
    formula: "RSI(14) = 100 - 100 / (1 + avg_gain / avg_loss), 1m bars"
    inputs: [stock_last_price]
    rule_file: nse_momentum.rules.yml
    frequency: 15s
    scope: core
    unit: index
    range: {min: 0, max: 100}
    warmup: 15m
    quality: approximation
    method: Cutler (SMA) RSI; Wilder RSI from R2
    limitation: "flat price over 14 bars gives NaN"
    alertable: true
    coverage: true
    dashboard_default: true

  - name: stock:stochastic_k_14m:percent
    kind: kpi
    family: technical
    level: stock_intelligence
    capability: momentum
    release: R1
    formula: "%K = (C - LL14) / (HH14 - LL14) * 100, HH/LL over 14 minutes"
    inputs: [stock_last_price]
    rule_file: nse_momentum.rules.yml
    frequency: 15s
    scope: core
    unit: percent
    range: {min: 0, max: 100}
    warmup: 14m
    quality: exact
    method: fast stochastic over raw samples
    limitation: "absent when the 14-minute range is zero"
    alertable: true
    coverage: true
    dashboard_default: true

  - name: stock:relative_strength_nifty:percent
    kind: kpi
    family: market
    level: stock_intelligence
    capability: momentum
    release: R1
    formula: "change%(stock) - change%(NIFTY 50)"
    inputs: [stock_change_percent]
    rule_file: nse_momentum.rules.yml
    frequency: 15s
    scope: core
    unit: percent
    warmup: 0s
    quality: exact
    method: percentage-point spread vs the benchmark, core EQ
    alertable: true
    coverage: true
    dashboard_default: true

  - name: stock:macd_12_26m:price
    kind: kpi
    family: technical
    level: stock_intelligence
    capability: momentum
    release: R1
    formula: "MACD = EMA12(C) - EMA26(C), 1m bars"
    inputs: [stock:ema_12m:price, stock:ema_26m:price]
    rule_file: nse_trend.rules.yml
    frequency: 1m
    scope: core
    unit: price
    warmup: 26m
    quality: exact
    method: stateful EMAs seeded with the SMA of the session's first n bars (EMA-based since R2)
    limitation: "re-seeded from the last n bars after a gap longer than 3 minutes"
    alertable: true
    coverage: true
    dashboard_default: true

  # --- Volatility -------------------------------------------------------------------------
  - name: stock:realized_vol_annualised:percent
    kind: kpi
    family: technical
    level: stock_intelligence
    capability: volatility
    release: R1
    formula: "stddev(1m returns over 15m) * sqrt(375 * 252)"
    inputs: [stock:volatility_15m:percent]
    rule_file: nse_volatility.rules.yml
    frequency: 30s
    scope: core
    unit: percent
    warmup: 16m
    quality: exact
    method: population stddev of rolling 1m returns, annualised over 375-minute sessions
    alertable: true
    coverage: true
    dashboard_default: true

  - name: stock:bollinger_width_20m:percent
    kind: kpi
    family: technical
    level: stock_intelligence
    capability: volatility
    release: R1
    formula: "4 * stddev20 / SMA20 * 100, 1m bars"
    inputs: [stock_last_price]
    rule_file: nse_volatility.rules.yml
    frequency: 30s
    scope: core
    unit: percent
    warmup: 20m
    quality: exact
    method: Bollinger(20, 2) bandwidth, population stddev
    alertable: true
    coverage: true
    dashboard_default: true

  - name: stock:bollinger_percent_b_20m:ratio
    kind: kpi
    family: technical
    level: stock_intelligence
    capability: volatility
    release: R1
    formula: "(C - (SMA20 - 2 * stddev20)) / (4 * stddev20), 1m bars"
    inputs: [stock_last_price]
    rule_file: nse_volatility.rules.yml
    frequency: 30s
    scope: core
    unit: ratio
    warmup: 20m
    quality: exact
    method: Bollinger(20, 2) %B
    limitation: "absent when the 20-bar stddev is zero"
    alertable: true
    coverage: true
    dashboard_default: true

  - name: stock:atr_14d:points
    kind: kpi
    family: technical
    level: stock_intelligence
    capability: volatility
    release: R1
    formula: "mean(session true range) over 20 calendar days (~14 sessions), needs >= 10 sessions"
    inputs: [stock:session_true_range:points]
    rule_file: nse_volatility.rules.yml
    frequency: 30s
    scope: core
    unit: points
    warmup: 0s
    warmup_sessions: 10
    quality: approximation
    method: simple mean of daily TR snapshots; Wilder ATR from R2
    limitation: "no corporate-action adjustment"
    alertable: true
    coverage: true

  - name: stock:range_expansion:ratio
    kind: kpi
    family: technical
    level: stock_intelligence
    capability: volatility
    release: R1
    formula: "(H - L) / ATR14"
    inputs: [stock_high_price, stock_low_price, stock:atr_14d:points]
    rule_file: nse_volatility.rules.yml
    frequency: 30s
    scope: core
    unit: ratio
    warmup: 0s
    warmup_sessions: 10
    quality: exact
    method: today's range in ATR units
    alertable: true
    coverage: true
    dashboard_default: true

  # --- Volume / liquidity -----------------------------------------------------------------
  - name: stock:turnover:inr
    kind: kpi
    family: market
    level: stock_intelligence
    capability: volume
    release: R1
    formula: "V * VWAP"
    inputs: [stock_day_volume_shares, stock_average_traded_price]
    rule_file: nse_volume_liquidity.rules.yml
    frequency: 15s
    scope: all_eq
    unit: inr
    warmup: 0s
    quality: exact
    method: day volume times exchange VWAP
    alertable: false
    coverage: true
    dashboard_default: true

  - name: stock:relative_volume:ratio
    kind: kpi
    family: market
    level: stock_intelligence
    capability: volume
    release: R1
    formula: "V / (avg session volume over 14 days * elapsed / 22500), after 09:45"
    inputs: [stock_day_volume_shares, stock:session_volume:shares, stock_market_seconds_to_close]
    rule_file: nse_volume_liquidity.rules.yml
    frequency: 15s
    scope: core
    unit: ratio
    warmup: 30m
    warmup_sessions: 5
    quality: heuristic
    method: time-adjusted relative volume assuming linear intraday volume
    limitation: "NSE intraday volume is U-shaped; gated to after 09:45"
    alertable: true
    coverage: true
    dashboard_default: true

  - name: stock:orderbook_depth:inr
    kind: kpi
    family: microstructure
    level: stock_intelligence
    capability: liquidity
    release: R1
    formula: "sum(price * qty) over top-5 bid and ask levels"
    inputs: [stock_orderbook_notional]
    rule_file: nse_volume_liquidity.rules.yml
    frequency: 15s
    scope: core
    unit: inr
    warmup: 0s
    quality: exact
    method: top-5 depth notional, both sides
    alertable: false
    coverage: true
    dashboard_default: true

  - name: stock:depth_vs_1h:ratio
    kind: kpi
    family: microstructure
    level: stock_intelligence
    capability: liquidity
    release: R1
    formula: "depth / avg_over_time(depth[1h])"
    inputs: [stock:orderbook_depth:inr]
    rule_file: nse_volume_liquidity.rules.yml
    frequency: 15s
    scope: core
    unit: ratio
    warmup: 1h
    quality: exact
    method: depth notional relative to its trailing 1h mean
    alertable: true
    coverage: true
    dashboard_default: true

  # --- Order flow -------------------------------------------------------------------------
  - name: stock:microprice_deviation:bps
    kind: kpi
    family: microstructure
    level: stock_intelligence
    capability: order_flow
    release: R1
    formula: "(microprice - mid) / mid * 1e4"
    inputs: [stock_orderbook_microprice, stock_orderbook_mid_price]
    rule_file: nse_order_flow.rules.yml
    frequency: 5s
    scope: core
    unit: bps
    warmup: 0s
    quality: exact
    method: level-1 size-weighted microprice vs mid
    alertable: true
    coverage: true
    dashboard_default: true

  - name: stock:volume_delta_1h:ratio
    kind: kpi
    family: microstructure
    level: stock_intelligence
    capability: order_flow
    release: R1
    formula: "sum(V_1m * sgn(r_1m)) / sum(V_1m) over 1h of 1m bars"
    inputs: [stock:volume_1m:shares, stock:return_1m:percent]
    rule_file: nse_order_flow.rules.yml
    frequency: 5s
    scope: core
    unit: ratio
    range: {min: -1, max: 1}
    warmup: 1h
    quality: approximation
    method: tick-rule
    limitation: "Kite provides no aggressor side"
    alertable: true
    coverage: true
    dashboard_default: true

  # --- Liquidity / order flow (exporter-native) ---------------------------------------------
  - name: stock_orderbook_spread_bps
    kind: kpi
    family: microstructure
    level: stock_intelligence
    capability: liquidity
    release: R1
    formula: "(ask1 - bid1) / mid * 1e4"
    inputs: [stock_depth_price]
    rule_file: exporter
    frequency: 1s
    scope: core
    unit: bps
    warmup: 0s
    quality: exact
    method: top of book from Kite full-mode depth
    alertable: true
    coverage: true
    dashboard_default: true

  - name: stock_orderbook_imbalance_ratio
    kind: kpi
    family: microstructure
    level: stock_intelligence
    capability: order_flow
    release: R1
    formula: "(sum bidQty - sum askQty) / (sum bidQty + sum askQty), top 5 levels"
    inputs: [stock_depth_quantity]
    rule_file: exporter
    frequency: 1s
    scope: core
    unit: ratio
    range: {min: -1, max: 1}
    warmup: 0s
    quality: exact
    method: top-5 depth quantity imbalance
    alertable: true
    coverage: true
    dashboard_default: true

  # --- Breadth ------------------------------------------------------------------------------
  - name: market:advance_decline:ratio
    kind: kpi
    family: market
    level: market_health
    capability: breadth
    release: R1
    formula: "count(change% > 0) / count(change% < 0), all EQ"
    inputs: [stock_change_percent]
    rule_file: stock_recording.rules.yml
    frequency: 5s
    scope: market
    unit: ratio
    warmup: 0s
    quality: exact
    method: advancers / decliners
    alertable: true
    coverage: true
    dashboard_default: true

  - name: market:above_vwap:ratio
    kind: kpi
    family: market
    level: market_health
    capability: breadth
    release: R1
    formula: "count(C > VWAP) / count(VWAP > 0), all EQ"
    inputs: [stock_last_price, stock_average_traded_price]
    rule_file: nse_market_breadth.rules.yml
    frequency: 15s
    scope: market
    unit: ratio
    range: {min: 0, max: 1}
    warmup: 0s
    quality: exact
    method: share of equities trading above their exchange VWAP
    alertable: true
    coverage: true
    dashboard_default: true

  - name: market:trin:ratio
    kind: kpi
    family: market
    level: market_health
    capability: breadth
    release: R1
    formula: "(advancers / decliners) / (advancing volume / declining volume), all EQ"
    inputs: [stock_change_percent, stock_day_volume_shares]
    rule_file: nse_market_breadth.rules.yml
    frequency: 15s
    scope: market
    unit: ratio
    warmup: 0s
    quality: exact
    method: Arms index on day change and day volume; > 1 bearish, < 1 bullish
    alertable: true
    coverage: true
    dashboard_default: true

  - name: sector:relative_strength:percent
    kind: kpi
    family: market
    level: sector_intelligence
    capability: sector
    release: R1
    formula: "avg change% of core EQ in the sector - NIFTY 50 change%"
    inputs: [stock_change_percent]
    rule_file: nse_market_breadth.rules.yml
    frequency: 15s
    scope: sector
    unit: percent
    warmup: 0s
    quality: exact
    method: equal-weight sector average vs benchmark, excluding unknown and Index
    alertable: true
    coverage: true
    dashboard_default: true

  - name: market:dispersion:percent
    kind: kpi
    family: market
    level: market_health
    capability: market
    release: R1
    formula: "stddev of change% across core EQ"
    inputs: [stock_change_percent]
    rule_file: nse_market_breadth.rules.yml
    frequency: 15s
    scope: market
    unit: percent
    warmup: 0s
    quality: exact
    method: cross-sectional population stddev
    alertable: false
    coverage: true
    dashboard_default: true

  - name: market:circuit_hits:count
    kind: kpi
    family: market
    level: market_health
    capability: market
    release: R1
    formula: "count(C >= upper band), count(C <= lower band), all EQ"
    inputs: [stock_last_price, stock_circuit_upper_limit_price, stock_circuit_lower_limit_price]
    rule_file: nse_market_breadth.rules.yml
    frequency: 15s
    scope: market
    unit: count
    warmup: 0s
    quality: exact
    method: equities locked at a price band, label band=upper|lower
    alertable: true
    coverage: true
    dashboard_default: true

  # --- Circuit ------------------------------------------------------------------------------
  - name: stock:upper_circuit_distance:percent
    kind: kpi
    family: market
    level: stock_intelligence
    capability: circuit
    release: R1
    formula: "(upper - C) / C * 100"
    inputs: [stock_circuit_upper_limit_price, stock_last_price]
    rule_file: stock_recording.rules.yml
    frequency: 5s
    scope: all_eq
    unit: percent
    warmup: 0s
    quality: exact
    method: distance to the daily upper price band
    alertable: true
    coverage: true

  - name: stock:lower_circuit_distance:percent
    kind: kpi
    family: market
    level: stock_intelligence
    capability: circuit
    release: R1
    formula: "(C - lower) / C * 100"
    inputs: [stock_circuit_lower_limit_price, stock_last_price]
    rule_file: stock_recording.rules.yml
    frequency: 5s
    scope: all_eq
    unit: percent
    warmup: 0s
    quality: exact
    method: distance to the daily lower price band
    alertable: true
    coverage: true

  # === Release 2 ============================================================================

  # --- Moving averages and MACD (stateful, 1m) -----------------------------------------------
  - name: stock:ema_9m:price
    kind: kpi
    family: technical
    level: stock_intelligence
    capability: trend
    release: R2
    formula: "EMA9 = 0.2 * C + 0.8 * EMA9[1m ago], 1m bars"
    inputs: [stock_last_price]
    rule_file: nse_moving_averages.rules.yml
    frequency: 1m
    scope: core
    unit: price
    warmup: 9m
    quality: exact
    method: stateful EMA seeded with the SMA of the session's first 9 bars
    limitation: "re-seeded from the last 9 bars after a gap longer than 3 minutes"

  - name: stock:ema_12m:price
    kind: kpi
    family: technical
    level: stock_intelligence
    capability: trend
    release: R2
    formula: "EMA12 = 2/13 * C + 11/13 * EMA12[1m ago], 1m bars"
    inputs: [stock_last_price]
    rule_file: nse_trend.rules.yml
    frequency: 1m
    scope: core
    unit: price
    warmup: 12m
    quality: exact
    method: stateful EMA seeded with the SMA of the session's first 12 bars
    limitation: "re-seeded from the last 12 bars after a gap longer than 3 minutes"

  - name: stock:ema_20m:price
    kind: kpi
    family: technical
    level: stock_intelligence
    capability: trend
    release: R2
    formula: "EMA20 = 2/21 * C + 19/21 * EMA20[1m ago], 1m bars"
    inputs: [stock_last_price]
    rule_file: nse_moving_averages.rules.yml
    frequency: 1m
    scope: core
    unit: price
    warmup: 20m
    quality: exact
    method: stateful EMA seeded with the SMA of the session's first 20 bars
    limitation: "re-seeded from the last 20 bars after a gap longer than 3 minutes"
    dashboard_default: true

  - name: stock:ema_26m:price
    kind: kpi
    family: technical
    level: stock_intelligence
    capability: trend
    release: R2
    formula: "EMA26 = 2/27 * C + 25/27 * EMA26[1m ago], 1m bars"
    inputs: [stock_last_price]
    rule_file: nse_trend.rules.yml
    frequency: 1m
    scope: core
    unit: price
    warmup: 26m
    quality: exact
    method: stateful EMA seeded with the SMA of the session's first 26 bars
    limitation: "re-seeded from the last 26 bars after a gap longer than 3 minutes"

  - name: stock:ema_50m:price
    kind: kpi
    family: technical
    level: stock_intelligence
    capability: trend
    release: R2
    formula: "EMA50 = 2/51 * C + 49/51 * EMA50[1m ago], 1m bars"
    inputs: [stock_last_price]
    rule_file: nse_moving_averages.rules.yml
    frequency: 1m
    scope: core
    unit: price
    warmup: 50m
    quality: exact
    method: stateful EMA seeded with the SMA of the session's first 50 bars
    limitation: "re-seeded from the last 50 bars after a gap longer than 3 minutes"
    dashboard_default: true

  - name: stock:ema_distance_20m:percent
    kind: kpi
    family: technical
    level: stock_intelligence
    capability: trend
    release: R2
    formula: "(C - EMA20) / EMA20 * 100"
    inputs: [stock_last_price, stock:ema_20m:price]
    rule_file: nse_moving_averages.rules.yml
    frequency: 1m
    scope: core
    unit: percent
    warmup: 20m
    quality: exact
    method: distance of the last price from EMA20
    alertable: true

  - name: stock:sma_20m:price
    kind: kpi
    family: technical
    level: stock_intelligence
    capability: trend
    release: R2
    formula: "SMA20 = mean of the last 20 1m closes"
    inputs: [stock_last_price]
    rule_file: nse_moving_averages.rules.yml
    frequency: 1m
    scope: core
    unit: price
    warmup: 20m
    quality: exact
    method: 1m-close SMA, published once 20 bars of the session exist
    dashboard_default: true

  - name: stock:sma_50m:price
    kind: kpi
    family: technical
    level: stock_intelligence
    capability: trend
    release: R2
    formula: "SMA50 = mean of the last 50 1m closes"
    inputs: [stock_last_price]
    rule_file: nse_moving_averages.rules.yml
    frequency: 1m
    scope: core
    unit: price
    warmup: 50m
    quality: exact
    method: 1m-close SMA, published once 50 bars of the session exist

  - name: stock:sma_200m:price
    kind: kpi
    family: technical
    level: stock_intelligence
    capability: trend
    release: R2
    formula: "SMA200 = mean of the last 200 1m closes"
    inputs: [stock_last_price]
    rule_file: nse_moving_averages.rules.yml
    frequency: 1m
    scope: core
    unit: price
    warmup: 200m
    quality: exact
    method: 1m-close SMA, published from 12:35 (200 bars after the open)

  - name: stock:wma_20m:price
    kind: kpi
    family: technical
    level: stock_intelligence
    capability: trend
    release: R2
    formula: "WMA20 = sum(i * C_i) / 210 = (LSMA20 + 2 * SMA20) / 3"
    inputs: [stock_last_price, stock:sma_20m:price]
    rule_file: nse_moving_averages.rules.yml
    frequency: 1m
    scope: core
    unit: price
    warmup: 20m
    quality: approximation
    method: linear-weight identity via predict_linear on 1m closes
    limitation: "exact when the evaluation falls on the bar close; drifts by part of a bar's trend otherwise"

  - name: stock:sma_distance_20m:percent
    kind: kpi
    family: technical
    level: stock_intelligence
    capability: trend
    release: R2
    formula: "(C - SMA20) / SMA20 * 100"
    inputs: [stock_last_price, stock:sma_20m:price]
    rule_file: nse_moving_averages.rules.yml
    frequency: 1m
    scope: core
    unit: percent
    warmup: 20m
    quality: exact
    method: distance of the last price from SMA20

  - name: stock:sma_spread_5_30m:percent
    kind: kpi
    family: technical
    level: stock_intelligence
    capability: trend
    release: R2
    formula: "(SMA5 / SMA30 - 1) * 100 on raw samples"
    inputs: [stock:sma_5m:price, stock:sma_30m:price]
    rule_file: nse_moving_averages.rules.yml
    frequency: 1m
    scope: core
    unit: percent
    warmup: 30m
    quality: exact
    method: spread of the base 5m and 30m moving averages

  - name: stock:sma_20m_slope:percent_per_hour
    kind: kpi
    family: technical
    level: stock_intelligence
    capability: trend
    release: R2
    formula: "(SMA20 - SMA20[10m ago]) / SMA20 * 600"
    inputs: [stock:sma_20m:price]
    rule_file: nse_moving_averages.rules.yml
    frequency: 1m
    scope: core
    unit: percent_per_hour
    warmup: 30m
    quality: exact
    method: 10-minute change of SMA20, scaled to an hour

  - name: stock:macd_signal_9m:price
    kind: kpi
    family: technical
    level: stock_intelligence
    capability: momentum
    release: R2
    formula: "signal = 0.2 * MACD + 0.8 * signal[1m ago]"
    inputs: [stock:macd_12_26m:price]
    rule_file: nse_trend.rules.yml
    frequency: 1m
    scope: core
    unit: price
    warmup: 34m
    quality: exact
    method: stateful EMA9 of MACD seeded with the mean of its first 9 values
    dashboard_default: true

  - name: stock:macd_histogram:price
    kind: kpi
    family: technical
    level: stock_intelligence
    capability: momentum
    release: R2
    formula: "MACD - signal"
    inputs: [stock:macd_12_26m:price, stock:macd_signal_9m:price]
    rule_file: nse_trend.rules.yml
    frequency: 1m
    scope: core
    unit: price
    warmup: 34m
    quality: exact
    method: MACD line minus its EMA9 signal line
    alertable: true
    dashboard_default: true

  # --- Wilder RSI (stateful, 1m) -------------------------------------------------------------
  - name: stock:rsi_avg_gain_14m:points
    kind: helper
    release: R2
    formula: "avg_gain = avg_gain[1m ago] + (max(C - C[1m ago], 0) - avg_gain[1m ago]) / 14"
    inputs: [stock_last_price]
    rule_file: nse_momentum.rules.yml
    frequency: 1m
    scope: core
    unit: points

  - name: stock:rsi_avg_loss_14m:points
    kind: helper
    release: R2
    formula: "avg_loss = avg_loss[1m ago] + (max(C[1m ago] - C, 0) - avg_loss[1m ago]) / 14"
    inputs: [stock_last_price]
    rule_file: nse_momentum.rules.yml
    frequency: 1m
    scope: core
    unit: points

  - name: stock:rsi_wilder_14m:index
    kind: kpi
    family: technical
    level: stock_intelligence
    capability: momentum
    release: R2
    formula: "RSI(14) = 100 - 100 / (1 + avg_gain / avg_loss), Wilder smoothing on 1m bars"
    inputs: [stock:rsi_avg_gain_14m:points, stock:rsi_avg_loss_14m:points]
    rule_file: nse_momentum.rules.yml
    frequency: 1m
    scope: core
    unit: index
    range: {min: 0, max: 100}
    warmup: 14m
    quality: exact
    method: Wilder RSI seeded with the Cutler averages of the session's first 14 bars
    limitation: "no movement since the seed gives NaN"
    alertable: true
    dashboard_default: true

  # --- 1m bars (nse_bars) ----------------------------------------------------------------------
  - name: stock:bar_1m_high:price
    kind: helper
    release: R2
    formula: "max of the 1s LTP samples in the last minute"
    inputs: [stock_last_price]
    rule_file: nse_bars.rules.yml
    frequency: 1m
    scope: core
    unit: price

  - name: stock:bar_1m_low:price
    kind: helper
    release: R2
    formula: "min of the 1s LTP samples in the last minute"
    inputs: [stock_last_price]
    rule_file: nse_bars.rules.yml
    frequency: 1m
    scope: core
    unit: price

  - name: stock:bar_1m_close:price
    kind: helper
    release: R2
    formula: "LTP at the bar close"
    inputs: [stock_last_price]
    rule_file: nse_bars.rules.yml
    frequency: 1m
    scope: core
    unit: price

  - name: stock:bar_1m_volume:shares
    kind: helper
    release: R2
    formula: "V - V[1m ago], or V after the session reset; EQ only"
    inputs: [stock_day_volume_shares]
    rule_file: nse_bars.rules.yml
    frequency: 1m
    scope: core
    unit: shares

  - name: stock:bar_1m_typical:price
    kind: helper
    release: R2
    formula: "(H + L + C) / 3 per 1m bar"
    inputs: [stock:bar_1m_high:price, stock:bar_1m_low:price, stock:bar_1m_close:price]
    rule_file: nse_bars.rules.yml
    frequency: 1m
    scope: core
    unit: price

  - name: stock:bar_1m_money_flow_volume:shares
    kind: helper
    release: R2
    formula: "((C - L) - (H - C)) / (H - L) * V per 1m bar, 0 when H = L"
    inputs: [stock:bar_1m_high:price, stock:bar_1m_low:price, stock:bar_1m_close:price, stock:bar_1m_volume:shares]
    rule_file: nse_bars.rules.yml
    frequency: 1m
    scope: core
    unit: shares

  # --- Returns (nse_returns) -------------------------------------------------------------------
  - name: stock:log_return_1m:ratio
    kind: kpi
    family: technical
    level: stock_intelligence
    capability: price
    release: R2
    formula: "ln(C / C[1m ago]), 1m bars"
    inputs: [stock_last_price]
    rule_file: nse_returns.rules.yml
    frequency: 1m
    scope: core
    unit: ratio
    warmup: 1m
    quality: exact
    method: non-overlapping 1m log return

  - name: stock:return_60m:percent
    kind: kpi
    family: technical
    level: stock_intelligence
    capability: price
    release: R2
    formula: "(C / C[60m ago] - 1) * 100"
    inputs: [stock_last_price]
    rule_file: nse_returns.rules.yml
    frequency: 15s
    scope: core
    unit: percent
    warmup: 60m
    quality: exact
    method: simple return over 60 minutes

  - name: stock:day_range:percent
    kind: kpi
    family: technical
    level: stock_intelligence
    capability: volatility
    release: R2
    formula: "(H - L) / L * 100"
    inputs: [stock_high_price, stock_low_price]
    rule_file: nse_returns.rules.yml
    frequency: 15s
    scope: core
    unit: percent
    warmup: 0s
    quality: exact
    method: day range so far

  - name: stock:range_position:ratio
    kind: kpi
    family: technical
    level: stock_intelligence
    capability: price
    release: R2
    formula: "(C - L) / (H - L)"
    inputs: [stock_last_price, stock_high_price, stock_low_price]
    rule_file: nse_returns.rules.yml
    frequency: 15s
    scope: core
    unit: ratio
    range: {min: 0, max: 1}
    warmup: 0s
    quality: exact
    method: close location within the day range; the post_close value is the daily close location
    limitation: "absent while H = L"

  # --- Trend regression (nse_trend_regression) ------------------------------------------------
  - name: stock:trend_slope_30m:percent_per_hour
    kind: kpi
    family: technical
    level: stock_intelligence
    capability: trend
    release: R2
    formula: "deriv(C[30m:1m]) * 3600 / C * 100"
    inputs: [stock_last_price]
    rule_file: nse_trend.rules.yml
    frequency: 1m
    scope: core
    unit: percent_per_hour
    warmup: 30m
    quality: exact
    method: least-squares slope of the last 30 1m closes
    dashboard_default: true

  - name: stock:trend_r2_30m:ratio
    kind: kpi
    family: technical
    level: stock_intelligence
    capability: trend
    release: R2
    formula: "R^2 = b^2 * 269700 / Var(C), 30 1m closes"
    inputs: [stock_last_price]
    rule_file: nse_trend.rules.yml
    frequency: 1m
    scope: core
    unit: ratio
    range: {min: 0, max: 1}
    warmup: 30m
    quality: exact
    method: coefficient of determination of the 30-bar linear trend
    limitation: "residuals are autocorrelated; use for ranking, not significance"
    dashboard_default: true

  - name: stock:trend_tstat_30m:ratio
    kind: kpi
    family: technical
    level: stock_intelligence
    capability: trend
    release: R2
    formula: "t = sgn(b) * sqrt(R^2 * 28 / (1 - R^2))"
    inputs: [stock:trend_r2_30m:ratio]
    rule_file: nse_trend.rules.yml
    frequency: 1m
    scope: core
    unit: ratio
    warmup: 30m
    quality: exact
    method: t-statistic of the 30-bar slope
    limitation: "absent for a perfect fit; overstates significance (autocorrelated residuals)"

  # --- Momentum oscillators (Release 2) --------------------------------------------------------
  - name: stock:momentum_10m:points
    kind: kpi
    family: technical
    level: stock_intelligence
    capability: momentum
    release: R2
    formula: "C - C[10m ago]"
    inputs: [stock_last_price]
    rule_file: nse_momentum.rules.yml
    frequency: 15s
    scope: core
    unit: points
    warmup: 10m
    quality: exact
    method: 10-minute price momentum

  - name: stock:stochastic_d_3m:percent
    kind: kpi
    family: technical
    level: stock_intelligence
    capability: momentum
    release: R2
    formula: "%D = SMA3(%K) at the last three 1m closes"
    inputs: [stock:stochastic_k_14m:percent]
    rule_file: nse_momentum.rules.yml
    frequency: 15s
    scope: core
    unit: percent
    range: {min: 0, max: 100}
    warmup: 16m
    quality: exact
    method: slow stochastic signal line
    dashboard_default: true

  - name: stock:cci_20m:index
    kind: kpi
    family: technical
    level: stock_intelligence
    capability: momentum
    release: R2
    formula: "CCI = (TP - SMA20(TP)) / (0.015 * MD), MD = rolling mean |TP - SMA20(TP)|"
    inputs: [stock:bar_1m_typical:price]
    rule_file: nse_momentum.rules.yml
    frequency: 1m
    scope: core
    unit: index
    warmup: 20m
    quality: approximation
    method: Lambert CCI on 1m typical prices
    limitation: "mean deviation uses each bar's own SMA (rolling), not the current SMA"

  - name: stock:mfi_14m:index
    kind: kpi
    family: technical
    level: stock_intelligence
    capability: volume
    release: R2
    formula: "MFI = 100 - 100 / (1 + sum(TP*V | TP up) / sum(TP*V | TP down)), 14 1m bars"
    inputs: [stock:bar_1m_typical:price, stock:bar_1m_volume:shares]
    rule_file: nse_momentum.rules.yml
    frequency: 1m
    scope: core
    unit: index
    range: {min: 0, max: 100}
    warmup: 15m
    quality: exact
    method: money-flow index, EQ only
    alertable: true

  - name: stock:awesome_oscillator:price
    kind: kpi
    family: technical
    level: stock_intelligence
    capability: momentum
    release: R2
    formula: "AO = SMA5((H + L) / 2) - SMA34((H + L) / 2), 1m bars"
    inputs: [stock:bar_1m_high:price, stock:bar_1m_low:price]
    rule_file: nse_momentum.rules.yml
    frequency: 1m
    scope: core
    unit: price
    warmup: 34m
    quality: exact
    method: Bill Williams awesome oscillator on 1m bars

  # --- Volatility (Release 2) ------------------------------------------------------------------
  - name: stock:true_range:points
    kind: kpi
    family: technical
    level: stock_intelligence
    capability: volatility
    release: R2
    formula: "max(H, PC) - min(L, PC), live"
    inputs: [stock_high_price, stock_low_price, stock_previous_close_price]
    rule_file: nse_volatility.rules.yml
    frequency: 30s
    scope: core
    unit: points
    warmup: 0s
    quality: exact
    method: today's true range so far

  - name: stock:bollinger_20m:price
    kind: kpi
    family: technical
    level: stock_intelligence
    capability: volatility
    release: R2
    formula: "SMA20 +/- 2 * stddev20, 1m bars"
    inputs: [stock_last_price]
    rule_file: nse_volatility.rules.yml
    frequency: 30s
    scope: core
    unit: price
    warmup: 20m
    quality: exact
    method: Bollinger(20, 2) bands, label band=upper|lower
    dashboard_default: true

  - name: stock:price_zscore_20m:sigma
    kind: kpi
    family: technical
    level: stock_intelligence
    capability: volatility
    release: R2
    formula: "(C - SMA20) / stddev20, 1m bars"
    inputs: [stock_last_price]
    rule_file: nse_volatility.rules.yml
    frequency: 30s
    scope: core
    unit: sigma
    warmup: 20m
    quality: exact
    method: mean-reversion z-score (= 4 * %B - 2)
    alertable: true

  - name: stock:atr_14d:percent
    kind: kpi
    family: technical
    level: stock_intelligence
    capability: volatility
    release: R2
    formula: "ATR14 / C * 100"
    inputs: [stock:atr_14d:points, stock_last_price]
    rule_file: nse_volatility.rules.yml
    frequency: 30s
    scope: core
    unit: percent
    warmup: 0s
    warmup_sessions: 10
    quality: approximation
    method: daily ATR relative to the price

  - name: stock:volatility_change_15m:percent
    kind: kpi
    family: technical
    level: stock_intelligence
    capability: volatility
    release: R2
    formula: "(sigma15 / sigma15[15m ago] - 1) * 100"
    inputs: [stock:volatility_15m:percent]
    rule_file: nse_volatility.rules.yml
    frequency: 30s
    scope: core
    unit: percent
    warmup: 30m
    quality: exact
    method: change of the 15-minute realized volatility

  - name: market:nifty_vol_risk_premium:points
    kind: kpi
    family: market
    level: market_health
    capability: volatility
    release: R2
    formula: "INDIA VIX - realized vol (annualised) of NIFTY 50"
    inputs: [stock_last_price, stock:realized_vol_annualised:percent]
    rule_file: nse_volatility.rules.yml
    frequency: 30s
    scope: market
    unit: points
    warmup: 16m
    quality: proxy
    method: implied minus 15-minute realized volatility; negative = realized exceeds implied
    limitation: "VIX is 30-day implied; realized is a 15-minute window"
    dashboard_default: true

  - name: stock:historical_vol_20d:percent
    kind: kpi
    family: risk
    level: stock_intelligence
    capability: volatility
    release: R2
    formula: "stddev(ln C/PC over 28 days) * sqrt(252) * 100, >= 10 sessions"
    inputs: [stock:session_log_return:ratio]
    rule_file: nse_volatility.rules.yml
    frequency: 30s
    scope: core
    unit: percent
    warmup: 0s
    warmup_sessions: 10
    quality: exact
    method: close-to-close historical volatility (population stddev)

  - name: stock:parkinson_vol_20d:percent
    kind: kpi
    family: risk
    level: stock_intelligence
    capability: volatility
    release: R2
    formula: "sqrt(mean(ln(H/L)^2) / (4 ln 2)) * sqrt(252) * 100 over 28 days, >= 10 sessions"
    inputs: [stock:session_log_range_sq:ratio]
    rule_file: nse_volatility.rules.yml
    frequency: 30s
    scope: core
    unit: percent
    warmup: 0s
    warmup_sessions: 10
    quality: exact
    method: Parkinson high-low volatility

  - name: stock:atr_ratio_5_20d:ratio
    kind: kpi
    family: technical
    level: stock_intelligence
    capability: volatility
    release: R2
    formula: "mean TR over 7 days / mean TR over 28 days (>= 3 and >= 15 sessions)"
    inputs: [stock:session_true_range:points]
    rule_file: nse_volatility.rules.yml
    frequency: 30s
    scope: core
    unit: ratio
    warmup: 0s
    warmup_sessions: 15
    quality: approximation
    method: short over long average true range (~5 / ~20 sessions)

  # --- Trend strength on 1m bars (nse_trend_strength, stateful) --------------------------------
  - name: stock:bar_1m_true_range:points
    kind: helper
    release: R2
    formula: "max(H, Cp) - min(L, Cp) per 1m bar"
    inputs: [stock_last_price]
    rule_file: nse_trend_strength.rules.yml
    frequency: 1m
    scope: core
    unit: points

  - name: stock:bar_1m_buying_pressure:points
    kind: helper
    release: R2
    formula: "C - min(L, Cp) per 1m bar"
    inputs: [stock_last_price]
    rule_file: nse_trend_strength.rules.yml
    frequency: 1m
    scope: core
    unit: points

  - name: stock:bar_1m_dm_plus:points
    kind: helper
    release: R2
    formula: "+DM = H - Hp if > Lp - L and > 0, else 0"
    inputs: [stock_last_price]
    rule_file: nse_trend_strength.rules.yml
    frequency: 1m
    scope: core
    unit: points

  - name: stock:bar_1m_dm_minus:points
    kind: helper
    release: R2
    formula: "-DM = Lp - L if > H - Hp and > 0, else 0"
    inputs: [stock_last_price]
    rule_file: nse_trend_strength.rules.yml
    frequency: 1m
    scope: core
    unit: points

  - name: stock:dm_plus_14m:points
    kind: helper
    release: R2
    formula: "Wilder(+DM, 14)"
    inputs: [stock:bar_1m_dm_plus:points]
    rule_file: nse_trend_strength.rules.yml
    frequency: 1m
    scope: core
    unit: points

  - name: stock:dm_minus_14m:points
    kind: helper
    release: R2
    formula: "Wilder(-DM, 14)"
    inputs: [stock:bar_1m_dm_minus:points]
    rule_file: nse_trend_strength.rules.yml
    frequency: 1m
    scope: core
    unit: points

  - name: stock:dx_14m:index
    kind: helper
    release: R2
    formula: "DX = 100 * |+DI - -DI| / (+DI + -DI)"
    inputs: [stock:di_plus_14m:percent, stock:di_minus_14m:percent]
    rule_file: nse_trend_strength.rules.yml
    frequency: 1m
    scope: core
    unit: index

  - name: stock:trix_ema1_15m:price
    kind: helper
    release: R2
    formula: "EMA15(C)"
    inputs: [stock_last_price]
    rule_file: nse_trend_strength.rules.yml
    frequency: 1m
    scope: core
    unit: price

  - name: stock:trix_ema2_15m:price
    kind: helper
    release: R2
    formula: "EMA15(EMA15(C))"
    inputs: [stock:trix_ema1_15m:price]
    rule_file: nse_trend_strength.rules.yml
    frequency: 1m
    scope: core
    unit: price

  - name: stock:trix_ema3_15m:price
    kind: helper
    release: R2
    formula: "EMA15(EMA15(EMA15(C)))"
    inputs: [stock:trix_ema2_15m:price]
    rule_file: nse_trend_strength.rules.yml
    frequency: 1m
    scope: core
    unit: price

  - name: stock:atr_14m:points
    kind: kpi
    family: technical
    level: stock_intelligence
    capability: volatility
    release: R2
    formula: "ATR14 = Wilder(TR, 14) on 1m bars"
    inputs: [stock:bar_1m_true_range:points]
    rule_file: nse_trend_strength.rules.yml
    frequency: 1m
    scope: core
    unit: points
    warmup: 15m
    quality: exact
    method: intraday Wilder ATR seeded with the mean of the first 14 bar true ranges
    dashboard_default: true

  - name: stock:di_plus_14m:percent
    kind: kpi
    family: technical
    level: stock_intelligence
    capability: trend
    release: R2
    formula: "+DI = 100 * Wilder(+DM, 14) / ATR14"
    inputs: [stock:dm_plus_14m:points, stock:atr_14m:points]
    rule_file: nse_trend_strength.rules.yml
    frequency: 1m
    scope: core
    unit: percent
    warmup: 15m
    quality: exact
    method: Wilder directional indicator on 1m bars

  - name: stock:di_minus_14m:percent
    kind: kpi
    family: technical
    level: stock_intelligence
    capability: trend
    release: R2
    formula: "-DI = 100 * Wilder(-DM, 14) / ATR14"
    inputs: [stock:dm_minus_14m:points, stock:atr_14m:points]
    rule_file: nse_trend_strength.rules.yml
    frequency: 1m
    scope: core
    unit: percent
    warmup: 15m
    quality: exact
    method: Wilder directional indicator on 1m bars

  - name: stock:adx_14m:index
    kind: kpi
    family: technical
    level: stock_intelligence
    capability: trend
    release: R2
    formula: "ADX = Wilder(DX, 14)"
    inputs: [stock:dx_14m:index]
    rule_file: nse_trend_strength.rules.yml
    frequency: 1m
    scope: core
    unit: index
    range: {min: 0, max: 100}
    warmup: 28m
    quality: exact
    method: average directional index on 1m bars, seeded with the mean of the first 14 DX values
    alertable: true
    dashboard_default: true

  - name: stock:trix_15m:percent
    kind: kpi
    family: technical
    level: stock_intelligence
    capability: momentum
    release: R2
    formula: "TRIX = 1-bar % change of EMA15(EMA15(EMA15(C)))"
    inputs: [stock:trix_ema3_15m:price]
    rule_file: nse_trend_strength.rules.yml
    frequency: 1m
    scope: core
    unit: percent
    warmup: 44m
    quality: exact
    method: triple-smoothed EMA rate of change on 1m closes

  - name: stock:ultimate_oscillator:index
    kind: kpi
    family: technical
    level: stock_intelligence
    capability: momentum
    release: R2
    formula: "UO = 100 * (4 A7 + 2 A14 + A28) / 7, A_n = sum(BP) / sum(TR) over n bars"
    inputs: [stock:bar_1m_buying_pressure:points, stock:bar_1m_true_range:points]
    rule_file: nse_trend_strength.rules.yml
    frequency: 1m
    scope: core
    unit: index
    range: {min: 0, max: 100}
    warmup: 29m
    quality: exact
    method: Williams ultimate oscillator on 1m bars

  # --- Volume (Release 2) ----------------------------------------------------------------------
  - name: stock:volume_change_15m:percent
    kind: kpi
    family: market
    level: stock_intelligence
    capability: volume
    release: R2
    formula: "(sum V over 15 bars / sum V over the previous 15 bars - 1) * 100"
    inputs: [stock:bar_1m_volume:shares]
    rule_file: nse_volume_liquidity.rules.yml
    frequency: 1m
    scope: core
    unit: percent
    warmup: 30m
    quality: exact
    method: 15-minute volume rate of change on 1m bars

  - name: stock:cmf_20m:ratio
    kind: kpi
    family: market
    level: stock_intelligence
    capability: volume
    release: R2
    formula: "CMF = sum(MFV) / sum(V) over 20 1m bars"
    inputs: [stock:bar_1m_money_flow_volume:shares, stock:bar_1m_volume:shares]
    rule_file: nse_volume_liquidity.rules.yml
    frequency: 1m
    scope: core
    unit: ratio
    range: {min: -1, max: 1}
    warmup: 20m
    quality: exact
    method: Chaikin money flow on 1m bars (H/L from 1s LTP samples)
    dashboard_default: true

  - name: stock:volume_zscore_1h:sigma
    kind: kpi
    family: market
    level: stock_intelligence
    capability: volume
    release: R2
    formula: "(V_bar - mean) / stddev over the last hour of 1m bars (>= 30 bars)"
    inputs: [stock:bar_1m_volume:shares]
    rule_file: nse_volume_liquidity.rules.yml
    frequency: 1m
    scope: core
    unit: sigma
    warmup: 30m
    quality: exact
    method: volume anomaly z-score
    alertable: true

  - name: stock:price_impact_15m:bps_per_crore
    kind: kpi
    family: microstructure
    level: stock_intelligence
    capability: liquidity
    release: R2
    formula: "Amihud = |return 15m| (bps) / (sum V 15m * VWAP / 1e7)"
    inputs: [stock:return_15m:percent, stock:bar_1m_volume:shares, stock_average_traded_price]
    rule_file: nse_volume_liquidity.rules.yml
    frequency: 1m
    scope: core
    unit: bps_per_crore
    warmup: 15m
    quality: proxy
    method: bps moved per INR 1 crore traded; turnover valued at the day VWAP
    dashboard_default: true

  - name: stock:avg_turnover_20d:inr
    kind: kpi
    family: market
    level: stock_intelligence
    capability: volume
    release: R2
    formula: "mean session turnover over 28 days (>= 10 sessions)"
    inputs: [stock:session_turnover:inr]
    rule_file: nse_volume_liquidity.rules.yml
    frequency: 1m
    scope: core
    unit: inr
    warmup: 0s
    warmup_sessions: 10
    quality: exact
    method: average daily traded value from the EOD snapshots

  - name: stock:obv_session:shares
    kind: kpi
    family: market
    level: stock_intelligence
    capability: volume
    release: R2
    formula: "OBV += sgn(C - Cp) * V per 1m bar, from 0 at the session start"
    inputs: [stock_last_price, stock_day_volume_shares]
    rule_file: nse_volume_liquidity.rules.yml
    frequency: 1m
    scope: core
    unit: shares
    warmup: 0s
    quality: exact
    method: session on-balance volume (stateful)
    limitation: "restarts from 0 after a gap longer than 3 minutes"

  - name: stock:vpt_session:shares
    kind: kpi
    family: market
    level: stock_intelligence
    capability: volume
    release: R2
    formula: "VPT += V * (C - Cp) / Cp per 1m bar, from 0 at the session start"
    inputs: [stock_last_price, stock_day_volume_shares]
    rule_file: nse_volume_liquidity.rules.yml
    frequency: 1m
    scope: core
    unit: shares
    warmup: 0s
    quality: exact
    method: session volume-price trend (stateful)
    limitation: "restarts from 0 after a gap longer than 3 minutes"

  - name: stock:ad_line_session:shares
    kind: kpi
    family: market
    level: stock_intelligence
    capability: volume
    release: R2
    formula: "A/D += ((C - L) - (H - C)) / (H - L) * V per 1m bar, from 0 at the session start"
    inputs: [stock_last_price, stock_day_volume_shares]
    rule_file: nse_volume_liquidity.rules.yml
    frequency: 1m
    scope: core
    unit: shares
    warmup: 0s
    quality: exact
    method: session accumulation/distribution line (stateful)
    limitation: "restarts from 0 after a gap longer than 3 minutes"

  # --- Order flow / microstructure (Release 2) -------------------------------------------------
  - name: stock:buy_volume_1h:percent
    kind: kpi
    family: microstructure
    level: stock_intelligence
    capability: order_flow
    release: R2
    formula: "(1 + volume delta 1h) / 2 * 100"
    inputs: [stock:volume_delta_1h:ratio]
    rule_file: nse_order_flow.rules.yml
    frequency: 5s
    scope: core
    unit: percent
    range: {min: 0, max: 100}
    warmup: 1h
    quality: approximation
    method: tick-rule share of buyer-initiated volume
    limitation: "Kite provides no aggressor side"

  - name: stock:orderbook_weighted_imbalance:ratio
    kind: kpi
    family: microstructure
    level: stock_intelligence
    capability: order_flow
    release: R2
    formula: "WOBI = sum w (bidQty - askQty) / sum w (bidQty + askQty), w = 1, 0.8, 0.6, 0.4, 0.2"
    inputs: [stock_depth_quantity]
    rule_file: nse_order_flow.rules.yml
    frequency: 15s
    scope: core
    unit: ratio
    range: {min: -1, max: 1}
    warmup: 0s
    quality: exact
    method: level-weighted top-5 book imbalance
    alertable: true
    dashboard_default: true

  - name: stock:depth_wall:ratio
    kind: kpi
    family: microstructure
    level: stock_intelligence
    capability: liquidity
    release: R2
    formula: "qty(level) / mean qty of the other levels on that side"
    inputs: [stock_depth_quantity]
    rule_file: nse_order_flow.rules.yml
    frequency: 15s
    scope: core
    unit: ratio
    warmup: 0s
    quality: exact
    method: order-book wall detector, labels side and level
    alertable: true

  - name: stock:depth_bid_ask:ratio
    kind: kpi
    family: microstructure
    level: stock_intelligence
    capability: order_flow
    release: R2
    formula: "sum bidQty / sum askQty over the top 5 levels"
    inputs: [stock_orderbook_quantity]
    rule_file: nse_order_flow.rules.yml
    frequency: 15s
    scope: core
    unit: ratio
    warmup: 0s
    quality: exact
    method: top-5 bid/ask quantity ratio

  - name: stock:avg_trade_size_5m:shares
    kind: kpi
    family: microstructure
    level: stock_intelligence
    capability: liquidity
    release: R2
    formula: "mean of the last traded quantity over 5m of samples"
    inputs: [stock_last_traded_quantity]
    rule_file: nse_order_flow.rules.yml
    frequency: 15s
    scope: core
    unit: shares
    warmup: 5m
    quality: proxy
    method: sampled last-trade size
    limitation: "Kite ticks carry no trade count; trades between scrapes are missed"

  - name: stock:pending_flow_imbalance_1m:ratio
    kind: kpi
    family: microstructure
    level: stock_intelligence
    capability: order_flow
    release: R2
    formula: "((B - B[1m ago]) - (S - S[1m ago])) / (B + S), B/S = total pending buy/sell quantity"
    inputs: [stock_total_buy_quantity, stock_total_sell_quantity]
    rule_file: nse_order_flow.rules.yml
    frequency: 1m
    scope: core
    unit: ratio
    warmup: 1m
    quality: proxy
    method: whole-book order-flow imbalance proxy

  - name: stock:ofi_cont_1m:shares
    kind: kpi
    family: microstructure
    level: stock_intelligence
    capability: order_flow
    release: R2
    formula: "sum over 1s steps of qb 1{pb >= pb'} - qb' 1{pb <= pb'} - qa 1{pa <= pa'} + qa' 1{pa >= pa'}, level 1"
    inputs: [stock_depth_price, stock_depth_quantity]
    rule_file: nse_order_flow.rules.yml
    frequency: 1m
    scope: core
    unit: shares
    warmup: 1m
    quality: approximation
    method: Cont-Kukanov-Stoikov order-flow imbalance on 1s scrapes
    limitation: "book changes between 1s scrapes are netted"
    alertable: true
    dashboard_default: true

  - name: stock:tick_imbalance_1m:ratio
    kind: kpi
    family: microstructure
    level: stock_intelligence
    capability: order_flow
    release: R2
    formula: "sum sgn(dC) / sum |sgn(dC)| over 1s steps in the last minute"
    inputs: [stock_last_price]
    rule_file: nse_order_flow.rules.yml
    frequency: 1m
    scope: core
    unit: ratio
    range: {min: -1, max: 1}
    warmup: 1m
    quality: approximation
    method: up-ticks minus down-ticks on 1s scrapes
    limitation: "absent when the price did not move in the minute"

  - name: stock:ofi_price_impact_60m:bps_per_share
    kind: kpi
    family: microstructure
    level: stock_intelligence
    capability: liquidity
    release: R2
    formula: "Cov(dmid bps, OFI[1m ago]) / Var(OFI[1m ago]) over 60 1m bars (>= 30)"
    inputs: [stock_orderbook_mid_price, stock:ofi_cont_1m:shares]
    rule_file: nse_order_flow.rules.yml
    frequency: 1m
    scope: core
    unit: bps_per_share
    warmup: 31m
    quality: approximation
    method: lagged OFI regression slope (price impact per share of imbalance)
    limitation: "60 noisy bars; for ranking, not significance"

  # --- Regimes and market scores (nse_regimes, heuristic, Release 2) ---------------------------
  - name: market:breadth_score:index
    kind: kpi
    family: market
    level: market_health
    capability: breadth
    release: R2
    formula: "100 * mean(adv / (adv + dec), above-VWAP ratio, clamp(1 - (TRIN - 0.5) / 1.5, 0, 1))"
    inputs: [market:advancers:count, market:decliners:count, market:above_vwap:ratio, market:trin:ratio]
    rule_file: nse_regimes.rules.yml
    frequency: 1m
    scope: market
    unit: index
    range: {min: 0, max: 100}
    warmup: 0s
    quality: heuristic
    method: equal-weight blend of advance share, VWAP participation and inverted TRIN
    limitation: "weights and TRIN scaling uncalibrated until 20 sessions of history"
    dashboard_default: true

  - name: market:momentum_score:index
    kind: kpi
    family: market
    level: market_health
    capability: momentum
    release: R2
    formula: "50 + 50 * clamp(NIFTY 50 change% / 2, -1, 1)"
    inputs: [stock_change_percent]
    rule_file: nse_regimes.rules.yml
    frequency: 1m
    scope: market
    unit: index
    range: {min: 0, max: 100}
    warmup: 0s
    quality: heuristic
    method: benchmark day change mapped linearly, saturating at +/- 2%
    dashboard_default: true

  - name: market:volatility_score:index
    kind: kpi
    family: market
    level: market_health
    capability: volatility
    release: R2
    formula: "100 * clamp((INDIA VIX - 10) / 20, 0, 1)"
    inputs: [stock_last_price]
    rule_file: nse_regimes.rules.yml
    frequency: 1m
    scope: market
    unit: index
    range: {min: 0, max: 100}
    warmup: 0s
    quality: heuristic
    method: INDIA VIX mapped linearly from 10 (0) to 30 (100)
    dashboard_default: true

  - name: market:liquidity_score:index
    kind: kpi
    family: market
    level: market_health
    capability: liquidity
    release: R2
    formula: "100 * clamp(median depth vs 1h across EQ, 0, 1)"
    inputs: [stock:depth_vs_1h:ratio]
    rule_file: nse_regimes.rules.yml
    frequency: 1m
    scope: market
    unit: index
    range: {min: 0, max: 100}
    warmup: 1h
    quality: heuristic
    method: cross-sectional median of book depth relative to its 1h average
    dashboard_default: true

  - name: market:stress_score:index
    kind: kpi
    family: market
    level: market_health
    capability: market
    release: R2
    formula: "0.3 (100 - breadth) + 0.3 volatility + 0.2 (100 - liquidity) + 0.2 * 100 * clamp(lower circuits / 50, 0, 1)"
    inputs: [market:breadth_score:index, market:volatility_score:index, market:liquidity_score:index, market:circuit_hits:count]
    rule_file: nse_regimes.rules.yml
    frequency: 1m
    scope: market
    unit: index
    range: {min: 0, max: 100}
    warmup: 1h
    quality: heuristic
    method: weighted blend of weak breadth, volatility, thin liquidity and lower-circuit hits
    limitation: "weights uncalibrated until 20 sessions of history"
    alertable: true
    dashboard_default: true

  - name: market:risk_score:index
    kind: kpi
    family: market
    level: market_health
    capability: market
    release: R2
    formula: "0.5 volatility + 0.5 stress"
    inputs: [market:volatility_score:index, market:stress_score:index]
    rule_file: nse_regimes.rules.yml
    frequency: 1m
    scope: market
    unit: index
    range: {min: 0, max: 100}
    warmup: 1h
    quality: heuristic
    method: equal blend of volatility and stress scores
    dashboard_default: true

  - name: market:breakout_share:ratio
    kind: kpi
    family: market
    level: market_health
    capability: breadth
    release: R2
    formula: "count(core EQ with C beyond its 20-session high/low) / count(core EQ)"
    inputs: [stock_last_price, stock:session_high:price, stock:session_low:price]
    rule_file: nse_regimes.rules.yml
    frequency: 1m
    scope: market
    unit: ratio
    range: {min: 0, max: 1}
    warmup_sessions: 15
    quality: exact
    method: share of core equities outside the 28-day session range (>= 15 sessions of history)
    dashboard_default: true

  - name: market:sector_rs_dispersion:percent
    kind: kpi
    family: market
    level: sector_intelligence
    capability: sector
    release: R2
    formula: "stddev of sector relative strength"
    inputs: [sector:relative_strength:percent]
    rule_file: nse_regimes.rules.yml
    frequency: 1m
    scope: market
    unit: percent
    warmup: 0s
    quality: exact
    method: cross-sectional population stddev of sector RS vs NIFTY 50
    dashboard_default: true

  - name: market:regime:info
    kind: regime
    release: R2
    formula: "first match of LIQUIDITY_STRESS, HIGH_VOLATILITY, BROAD_MARKET_SELL_OFF, BROAD_MARKET_RALLY, TRENDING_BEAR, TRENDING_BULL, BREAKOUT_REGIME, SECTOR_ROTATION, LOW_VOLATILITY, NORMAL; label regime"
    inputs: [market:liquidity_score:index, market:volatility_score:index, market:breadth_score:index, market:momentum_score:index, stock:trend_r2_30m:ratio, stock:trend_slope_30m:percent_per_hour, market:breakout_share:ratio, market:sector_rs_dispersion:percent, market:dispersion:percent, market:session_dispersion:percent]
    rule_file: nse_regimes.rules.yml
    frequency: 1m
    scope: market
    unit: bool

  - name: market:regime:code
    kind: regime
    release: R2
    formula: "precedence index of market:regime:info (1 = LIQUIDITY_STRESS ... 10 = NORMAL)"
    inputs: [market:regime:info]
    rule_file: nse_regimes.rules.yml
    frequency: 1m
    scope: market
    unit: code

  - name: sector:regime:info
    kind: regime
    release: R2
    formula: "LEADING if RS > 1, LAGGING if RS < -1, else NEUTRAL; label regime"
    inputs: [sector:relative_strength:percent]
    rule_file: nse_regimes.rules.yml
    frequency: 1m
    scope: sector
    unit: bool

  - name: stock:volatility_regime:info
    kind: regime
    release: R2
    formula: "Bollinger width > 1.5x its 2h mean HIGH, < 0.67x LOW, else NORMAL; label regime"
    inputs: [stock:bollinger_width_20m:percent]
    rule_file: nse_regimes.rules.yml
    frequency: 1m
    scope: core
    unit: bool

  - name: stock:liquidity_regime:info
    kind: regime
    release: R2
    formula: "depth vs 1h < 0.5 THIN, > 1.5 DEEP, else NORMAL; label regime"
    inputs: [stock:depth_vs_1h:ratio]
    rule_file: nse_regimes.rules.yml
    frequency: 1m
    scope: core
    unit: bool

  - name: stock:momentum_regime:info
    kind: regime
    release: R2
    formula: "ADX > 25 with +DI > -DI UPTREND (-DI > +DI DOWNTREND), ADX < 20 RANGE, else NEUTRAL; label regime"
    inputs: [stock:adx_14m:index, stock:di_plus_14m:percent, stock:di_minus_14m:percent]
    rule_file: nse_regimes.rules.yml
    frequency: 1m
    scope: core
    unit: bool

  - name: stock:orderflow_regime:info
    kind: regime
    release: R2
    formula: "volume delta > 0.3 and WOBI > 0.2 ACCUMULATION (< -0.3 and < -0.2 DISTRIBUTION), else BALANCED; label regime"
    inputs: [stock:volume_delta_1h:ratio, stock:orderbook_weighted_imbalance:ratio]
    rule_file: nse_regimes.rules.yml
    frequency: 1m
    scope: core
    unit: bool

  # --- Effectiveness ledger (nse_effectiveness, Release 2) ---------------------------------------
  - name: stock:signal_activation:bool
    kind: helper
    release: R2
    formula: "1 in the first minute stock:signal_active:bool holds; labels signal, direction"
    inputs: [stock:signal_active:bool]
    rule_file: nse_effectiveness.rules.yml
    frequency: 1m
    scope: core
    unit: bool

  - name: stock:alert_activation:bool
    kind: helper
    release: R2
    formula: "1 in the first minute a stock-level condition alert fires; labels alertname, direction, band, side"
    inputs: [ALERTS]
    rule_file: nse_effectiveness.rules.yml
    frequency: 1m
    scope: all_eq
    unit: bool

  - name: signal:outcome_return_sum:percent
    kind: helper
    release: R2
    formula: "sum of EQ returns over h for signal activations h ago (h = 5m, 15m, 1h), market open"
    inputs: [stock:signal_activation:bool, stock_last_price]
    rule_file: nse_effectiveness.rules.yml
    frequency: 1m
    scope: market
    unit: percent

  - name: signal:outcome_hits:count
    kind: helper
    release: R2
    formula: "outcomes moving in the signal direction (bullish up, bearish down)"
    inputs: [stock:signal_activation:bool, stock_last_price]
    rule_file: nse_effectiveness.rules.yml
    frequency: 1m
    scope: market
    unit: count

  - name: signal:outcomes:count
    kind: helper
    release: R2
    formula: "number of signal activations maturing this minute, per horizon"
    inputs: [stock:signal_activation:bool, stock_last_price]
    rule_file: nse_effectiveness.rules.yml
    frequency: 1m
    scope: market
    unit: count

  - name: alert:outcome_return_sum:percent
    kind: helper
    release: R2
    formula: "sum of EQ returns over h for condition-alert activations h ago (h = 5m, 15m, 1h), market open"
    inputs: [stock:alert_activation:bool, stock_last_price]
    rule_file: nse_effectiveness.rules.yml
    frequency: 1m
    scope: market
    unit: percent

  - name: alert:outcome_hits:count
    kind: helper
    release: R2
    formula: "outcomes moving in the alert direction (bullish up, bearish down)"
    inputs: [stock:alert_activation:bool, stock_last_price]
    rule_file: nse_effectiveness.rules.yml
    frequency: 1m
    scope: market
    unit: count

  - name: alert:outcomes:count
    kind: helper
    release: R2
    formula: "number of condition-alert activations maturing this minute, per horizon"
    inputs: [stock:alert_activation:bool, stock_last_price]
    rule_file: nse_effectiveness.rules.yml
    frequency: 1m
    scope: market
    unit: count

  - name: signal:occurrences_5d:count
    kind: effectiveness
    release: R2
    formula: "signal activations over the last 5 days"
    inputs: [stock:signal_activation:bool]
    rule_file: nse_effectiveness.rules.yml
    frequency: 15m
    scope: market
    unit: count

  - name: signal:forward_return_5d:percent
    kind: effectiveness
    release: R2
    formula: "mean return h after a signal activation over the last 5 days (>= 5 outcomes); label horizon"
    inputs: [signal:outcome_return_sum:percent, signal:outcomes:count]
    rule_file: nse_effectiveness.rules.yml
    frequency: 15m
    scope: market
    unit: percent

  - name: signal:hit_rate_5d:ratio
    kind: effectiveness
    release: R2
    formula: "share of directional signal outcomes in the signal direction over the last 5 days (>= 5 outcomes)"
    inputs: [signal:outcome_hits:count, signal:outcomes:count]
    rule_file: nse_effectiveness.rules.yml
    frequency: 15m
    scope: market
    unit: ratio
    range: {min: 0, max: 1}

  - name: alert:occurrences_5d:count
    kind: effectiveness
    release: R2
    formula: "stock-level condition alert activations over the last 5 days"
    inputs: [stock:alert_activation:bool]
    rule_file: nse_effectiveness.rules.yml
    frequency: 15m
    scope: market
    unit: count

  - name: alert:forward_return_5d:percent
    kind: effectiveness
    release: R2
    formula: "mean return h after a condition alert fired over the last 5 days (>= 5 outcomes); label horizon"
    inputs: [alert:outcome_return_sum:percent, alert:outcomes:count]
    rule_file: nse_effectiveness.rules.yml
    frequency: 15m
    scope: market
    unit: percent

  - name: alert:hit_rate_5d:ratio
    kind: effectiveness
    release: R2
    formula: "share of directional alert outcomes in the alert direction over the last 5 days (>= 5 outcomes)"
    inputs: [alert:outcome_hits:count, alert:outcomes:count]
    rule_file: nse_effectiveness.rules.yml
    frequency: 15m
    scope: market
    unit: ratio
    range: {min: 0, max: 1}

  # --- Risk intelligence: snapshots and daily risk (nse_eod_snapshot, nse_risk, Release 3) ------
  - name: stock:session_close:price
    kind: snapshot
    release: R3
    formula: "C at post_close"
    inputs: [stock_last_price, stock_market_phase]
    rule_file: nse_eod_snapshot.rules.yml
    frequency: 30m
    scope: core
    unit: price

  - name: stock:session_return_x_nifty:ratio
    kind: snapshot
    release: R3
    formula: "ln(C / PC) * ln(NIFTY C / NIFTY PC) at post_close, EQ"
    inputs: [stock_last_price, stock_previous_close_price, stock_market_phase]
    rule_file: nse_eod_snapshot.rules.yml
    frequency: 30m
    scope: core
    unit: ratio

  - name: stock:session_drawdown:percent
    kind: snapshot
    release: R3
    formula: "(close / max close over 90 days - 1) * 100 at post_close"
    inputs: [stock:session_close:price]
    rule_file: nse_eod_snapshot.rules.yml
    frequency: 30m
    scope: core
    unit: percent

  - name: portfolio:session_return:ratio
    kind: snapshot
    release: R3
    formula: "day_change / (value - day_change) at post_close"
    inputs: [portfolio:day_change:sum, portfolio:holding_value:sum, stock_market_phase]
    rule_file: nse_eod_snapshot.rules.yml
    frequency: 30m
    scope: portfolio
    unit: ratio

  - name: portfolio:session_downside_sq:ratio
    kind: snapshot
    release: R3
    formula: "min(session return, 0)^2"
    inputs: [portfolio:session_return:ratio]
    rule_file: nse_eod_snapshot.rules.yml
    frequency: 30m
    scope: portfolio
    unit: ratio

  - name: stock:var_95_1d:percent
    kind: kpi
    family: risk
    level: risk_intelligence
    capability: risk
    release: R3
    formula: "-quantile_0.05(ln C/PC over 90 days) * 100, >= 20 sessions (loss, positive)"
    inputs: [stock:session_log_return:ratio]
    rule_file: nse_risk.rules.yml
    frequency: 30m
    scope: core
    unit: percent
    warmup: 0s
    warmup_sessions: 20
    quality: exact
    method: historical simulation, linear interpolation between order statistics
    limitation: "~60 sessions of retention: the 5% tail rests on about 3 observations"
    dashboard_default: true

  - name: stock:cvar_95_1d:percent
    kind: kpi
    family: risk
    level: risk_intelligence
    capability: risk
    release: R3
    formula: "(2.063 sigma - mu) * 100 of ln C/PC over 90 days, >= 20 sessions (loss, positive)"
    inputs: [stock:session_log_return:ratio]
    rule_file: nse_risk.rules.yml
    frequency: 30m
    scope: core
    unit: percent
    warmup: 0s
    warmup_sessions: 20
    quality: approximation
    method: parametric normal expected shortfall
    limitation: "historical CVaR needs a moving-threshold filter PromQL lacks; fat tails are understated"

  - name: stock:max_drawdown_60d:percent
    kind: kpi
    family: risk
    level: risk_intelligence
    capability: risk
    release: R3
    formula: "min(session drawdown from the 90-day peak close) over 90 days"
    inputs: [stock:session_drawdown:percent]
    rule_file: nse_risk.rules.yml
    frequency: 30m
    scope: core
    unit: percent
    warmup: 0s
    warmup_sessions: 1
    quality: exact
    method: close-to-close drawdown within retention (~60 sessions)
    dashboard_default: true

  - name: stock:beta_nifty_20d:ratio
    kind: kpi
    family: risk
    level: risk_intelligence
    capability: risk
    release: R3
    formula: "Cov(r, r_NIFTY) / Var(r_NIFTY) of daily log returns over 28 days, >= 15 sessions"
    inputs: [stock:session_return_x_nifty:ratio, stock:session_log_return:ratio]
    rule_file: nse_risk.rules.yml
    frequency: 30m
    scope: core
    unit: ratio
    warmup: 0s
    warmup_sessions: 15
    quality: exact
    method: E[XY] - E[X]E[Y] over population variance
    dashboard_default: true

  - name: stock:alpha_20d:percent
    kind: kpi
    family: risk
    level: risk_intelligence
    capability: risk
    release: R3
    formula: "252 * (mean r - R_f/252 - beta (mean r_NIFTY - R_f/252)) * 100"
    inputs: [stock:session_log_return:ratio, stock:beta_nifty_20d:ratio, stock_risk_free_rate_ratio]
    rule_file: nse_risk.rules.yml
    frequency: 30m
    scope: core
    unit: percent
    warmup: 0s
    warmup_sessions: 15
    quality: approximation
    method: annualised Jensen alpha on daily log returns
    limitation: "R_f is a manually updated textfile value (stock_risk_free_rate_ratio)"

  - name: portfolio:day_return:percent
    kind: kpi
    family: risk
    level: risk_intelligence
    capability: portfolio
    release: R3
    formula: "day_change / (value - day_change) * 100"
    inputs: [portfolio:day_change:sum, portfolio:holding_value:sum]
    rule_file: nse_risk.rules.yml
    frequency: 15s
    scope: portfolio
    unit: percent
    warmup: 0s
    quality: exact
    method: value-weighted holdings return vs the previous close
    alertable: true
    dashboard_default: true

  - name: portfolio:volatility_20d:percent
    kind: kpi
    family: risk
    level: risk_intelligence
    capability: portfolio
    release: R3
    formula: "stddev(portfolio session return over 28 days) * sqrt(252) * 100, >= 10 sessions"
    inputs: [portfolio:session_return:ratio]
    rule_file: nse_risk.rules.yml
    frequency: 30m
    scope: portfolio
    unit: percent
    warmup: 0s
    warmup_sessions: 10
    quality: exact
    method: stddev of the portfolio return series (no covariance matrix needed)
    dashboard_default: true

  - name: portfolio:sharpe_60d:ratio
    kind: kpi
    family: risk
    level: risk_intelligence
    capability: portfolio
    release: R3
    formula: "(mean r - R_f/252) / stddev r * sqrt(252) over 90 days, >= 20 sessions"
    inputs: [portfolio:session_return:ratio, stock_risk_free_rate_ratio]
    rule_file: nse_risk.rules.yml
    frequency: 30m
    scope: portfolio
    unit: ratio
    warmup: 0s
    warmup_sessions: 20
    quality: exact
    method: annualised Sharpe ratio of daily portfolio returns
    dashboard_default: true

  - name: portfolio:sortino_60d:ratio
    kind: kpi
    family: risk
    level: risk_intelligence
    capability: portfolio
    release: R3
    formula: "(mean r - R_f/252) / sqrt(mean min(r, 0)^2) * sqrt(252) over 90 days, >= 20 sessions"
    inputs: [portfolio:session_return:ratio, portfolio:session_downside_sq:ratio, stock_risk_free_rate_ratio]
    rule_file: nse_risk.rules.yml
    frequency: 30m
    scope: portfolio
    unit: ratio
    warmup: 0s
    warmup_sessions: 20
    quality: exact
    method: annualised Sortino ratio, downside deviation vs 0
    dashboard_default: true

  - name: portfolio:var_95_1d:percent
    kind: kpi
    family: risk
    level: risk_intelligence
    capability: portfolio
    release: R3
    formula: "-quantile_0.05(portfolio session return over 90 days) * 100, >= 20 sessions"
    inputs: [portfolio:session_return:ratio]
    rule_file: nse_risk.rules.yml
    frequency: 30m
    scope: portfolio
    unit: percent
    warmup: 0s
    warmup_sessions: 20
    quality: exact
    method: historical simulation on today's holdings' daily returns
    alertable: true
    dashboard_default: true

  # --- Risk intelligence: intraday (nse_returns_1m, nse_risk_intraday, Release 3) ----------------
  - name: stock:log_return_x_nifty_1m:ratio
    kind: helper
    release: R3
    formula: "ln(C/C[1m]) * ln(NIFTY/NIFTY[1m]) per 1m bar, EQ"
    inputs: [stock:log_return_1m:ratio]
    rule_file: nse_returns.rules.yml
    frequency: 1m
    scope: core
    unit: ratio

  - name: stock:covariance_nifty_60m:ratio
    kind: kpi
    family: risk
    level: risk_intelligence
    capability: risk
    release: R3
    formula: "E[r r_N] - E[r] E[r_N] of 1m log returns over 60 minutes, >= 30 bars"
    inputs: [stock:log_return_x_nifty_1m:ratio, stock:log_return_1m:ratio]
    rule_file: nse_risk.rules.yml
    frequency: 1m
    scope: core
    unit: ratio
    warmup: 30m
    quality: exact
    method: population covariance vs NIFTY 50 on 1m bars

  - name: stock:beta_nifty_60m:ratio
    kind: kpi
    family: risk
    level: risk_intelligence
    capability: risk
    release: R3
    formula: "Cov(r, r_N) / Var(r_N) over 60 one-minute bars"
    inputs: [stock:covariance_nifty_60m:ratio, stock:log_return_1m:ratio]
    rule_file: nse_risk.rules.yml
    frequency: 1m
    scope: core
    unit: ratio
    warmup: 30m
    quality: exact
    method: intraday OLS beta vs NIFTY 50
    limitation: "60 noisy bars; asynchronous trading biases beta towards 0 for illiquid names"
    dashboard_default: true

  - name: stock:correlation_nifty_60m:ratio
    kind: kpi
    family: risk
    level: risk_intelligence
    capability: risk
    release: R3
    formula: "Cov(r, r_N) / (sigma sigma_N) over 60 one-minute bars"
    inputs: [stock:covariance_nifty_60m:ratio, stock:log_return_1m:ratio]
    rule_file: nse_risk.rules.yml
    frequency: 1m
    scope: core
    unit: ratio
    range: {min: -1, max: 1}
    warmup: 30m
    quality: exact
    method: Pearson correlation vs NIFTY 50 on 1m bars
    dashboard_default: true

  - name: stock:ewma_variance_1m:ratio
    kind: helper
    release: R3
    formula: "h = 0.94 h[1m ago] + 0.06 r^2, seeded with Var(r) over 60m (>= 30 bars)"
    inputs: [stock_last_price, stock:log_return_1m:ratio]
    rule_file: nse_risk.rules.yml
    frequency: 1m
    scope: core
    unit: ratio

  - name: stock:ewma_vol_annualised:percent
    kind: kpi
    family: risk
    level: risk_intelligence
    capability: volatility
    release: R3
    formula: "sqrt(EWMA variance * 375 * 252) * 100"
    inputs: [stock:ewma_variance_1m:ratio]
    rule_file: nse_risk.rules.yml
    frequency: 1m
    scope: core
    unit: percent
    warmup: 30m
    quality: exact
    method: RiskMetrics EWMA (lambda 0.94) on 1m log returns, stateful
    limitation: "re-seeds after a gap longer than 3 minutes"
    dashboard_default: true

  - name: market:implied_move:points
    kind: kpi
    family: risk
    level: market_health
    capability: volatility
    release: R3
    formula: "NIFTY 50 * INDIA VIX / 100 / sqrt(365); label horizon=1d"
    inputs: [stock_last_price]
    rule_file: nse_risk.rules.yml
    frequency: 1m
    scope: market
    unit: points
    warmup: 0s
    quality: approximation
    method: one-sigma one-day move implied by INDIA VIX (calendar-day convention)
    alertable: true
    dashboard_default: true

  - name: stock:market_model_expected_return_15m:percent
    kind: kpi
    family: risk
    level: risk_intelligence
    capability: risk
    release: R3
    formula: "15 (mean r - beta mean r_N) * 100 + beta * NIFTY 15m return, 60m estimates"
    inputs: [stock:log_return_1m:ratio, stock:beta_nifty_60m:ratio, stock_last_price]
    rule_file: nse_risk.rules.yml
    frequency: 1m
    scope: core
    unit: percent
    warmup: 30m
    quality: approximation
    method: single-index market model, log-return estimates applied to a simple 15m return

  - name: stock:abnormal_return_15m:percent
    kind: kpi
    family: risk
    level: risk_intelligence
    capability: risk
    release: R3
    formula: "15m return - market model expected 15m return"
    inputs: [stock:market_model_expected_return_15m:percent, stock_last_price]
    rule_file: nse_risk.rules.yml
    frequency: 1m
    scope: core
    unit: percent
    warmup: 30m
    quality: approximation
    method: market-model residual (idiosyncratic move)
    alertable: true
    dashboard_default: true

  # --- 52-week and daily SMA levels (exporter `reference` collector, nse_reference_levels, R3) ---
  - name: stock:range_52w_position:ratio
    kind: kpi
    family: technical
    level: risk_intelligence
    capability: price
    release: R3
    formula: "(C - 52W low) / (52W high - 52W low)"
    inputs: [stock_last_price, stock_52w_high_price, stock_52w_low_price]
    rule_file: nse_reference_levels.rules.yml
    frequency: 15s
    scope: core
    unit: ratio
    range: {min: 0, max: 1}
    warmup: 0s
    quality: exact
    method: position within the 52-week range of Kite day candles up to the previous session
    limitation: "needs the Kite historical data add-on; no corporate-action adjustment"
    dashboard_default: true

  - name: stock:distance_52w_high:percent
    kind: kpi
    family: technical
    level: risk_intelligence
    capability: price
    release: R3
    formula: "(C / 52W high - 1) * 100"
    inputs: [stock_last_price, stock_52w_high_price]
    rule_file: nse_reference_levels.rules.yml
    frequency: 15s
    scope: core
    unit: percent
    warmup: 0s
    quality: exact
    method: distance from the 52-week high of Kite day candles up to the previous session
    limitation: "needs the Kite historical data add-on; no corporate-action adjustment"
    alertable: true
    dashboard_default: true

  - name: stock:sma_spread_50_200d:percent
    kind: kpi
    family: technical
    level: stock_intelligence
    capability: trend
    release: R3
    formula: "(SMA50 daily / SMA200 daily - 1) * 100"
    inputs: [stock_sma_50d_price, stock_sma_200d_price]
    rule_file: nse_reference_levels.rules.yml
    frequency: 15s
    scope: core
    unit: percent
    warmup: 0s
    quality: exact
    method: daily golden/death-cross spread from Kite day candles (>= 200 candles)
    limitation: "needs the Kite historical data add-on"
    dashboard_default: true

  # --- F&O intelligence (exporter `derivatives` collector, nse_derivatives, Release 4) ----------
  - name: stock:session_open_interest:contracts
    kind: snapshot
    release: R4
    formula: "OI at post_close"
    inputs: [stock_open_interest, stock_market_phase]
    rule_file: nse_derivatives.rules.yml
    frequency: 30m
    scope: core
    unit: contracts

  - name: underlying:spot:price
    kind: helper
    release: R4
    formula: "spot LTP relabelled to the NFO underlying (NIFTY 50 -> NIFTY, NIFTY BANK -> BANKNIFTY, ...), underlyings with contracts only"
    inputs: [stock_last_price, stock_instrument_info]
    rule_file: nse_derivatives.rules.yml
    frequency: 15s
    scope: market
    unit: price

  - name: underlying:futures_price:price
    kind: helper
    release: R4
    formula: "future LTP per underlying and expiry"
    inputs: [stock_last_price, stock_instrument_info]
    rule_file: nse_derivatives.rules.yml
    frequency: 15s
    scope: market
    unit: price

  - name: underlying:pcr_oi:ratio
    kind: kpi
    family: derivatives
    level: derivatives_intelligence
    capability: derivatives
    release: R4
    formula: "sum OI(PE) / sum OI(CE) per underlying and expiry"
    inputs: [stock_open_interest, stock_instrument_info]
    rule_file: nse_derivatives.rules.yml
    frequency: 15s
    scope: market
    unit: ratio
    warmup: 0s
    quality: exact
    method: open-interest put-call ratio over the tracked strikes
    limitation: "covers only the strikes in the watchlist (Kite subscription limit)"
    alertable: true
    dashboard_default: true

  - name: underlying:pcr_volume:ratio
    kind: kpi
    family: derivatives
    level: derivatives_intelligence
    capability: derivatives
    release: R4
    formula: "sum day volume(PE) / sum day volume(CE) per underlying and expiry"
    inputs: [stock_day_volume_shares, stock_instrument_info]
    rule_file: nse_derivatives.rules.yml
    frequency: 15s
    scope: market
    unit: ratio
    warmup: 0s
    quality: exact
    method: volume put-call ratio over the tracked strikes
    dashboard_default: true

  - name: underlying:futures_basis:points
    kind: kpi
    family: derivatives
    level: derivatives_intelligence
    capability: derivatives
    release: R4
    formula: "F - S per underlying and expiry"
    inputs: [underlying:futures_price:price, underlying:spot:price]
    rule_file: nse_derivatives.rules.yml
    frequency: 15s
    scope: market
    unit: points
    warmup: 0s
    quality: exact
    method: futures LTP minus spot LTP (asynchronous ticks)
    dashboard_default: true

  - name: underlying:futures_premium:percent
    kind: kpi
    family: derivatives
    level: derivatives_intelligence
    capability: derivatives
    release: R4
    formula: "(F / S - 1) * 100"
    inputs: [underlying:futures_price:price, underlying:spot:price]
    rule_file: nse_derivatives.rules.yml
    frequency: 15s
    scope: market
    unit: percent
    warmup: 0s
    quality: exact
    method: futures premium (negative = discount) over spot
    alertable: true
    dashboard_default: true

  - name: underlying:cost_of_carry:percent
    kind: kpi
    family: derivatives
    level: derivatives_intelligence
    capability: derivatives
    release: R4
    formula: "(F / S - 1) * 365 / days to expiry * 100, > 0.5 days to expiry"
    inputs: [underlying:futures_premium:percent, stock_instrument_expiry_timestamp_seconds]
    rule_file: nse_derivatives.rules.yml
    frequency: 15s
    scope: market
    unit: percent
    warmup: 0s
    quality: approximation
    method: simple annualised carry (calendar days)
    limitation: "explodes near expiry; suppressed in the last half day"
    alertable: true
    dashboard_default: true

  - name: stock:oi_change:percent
    kind: kpi
    family: derivatives
    level: derivatives_intelligence
    capability: derivatives
    release: R4
    formula: "(OI / previous session OI - 1) * 100, pre_open and open"
    inputs: [stock_open_interest, stock:session_open_interest:contracts]
    rule_file: nse_derivatives.rules.yml
    frequency: 15s
    scope: core
    unit: percent
    warmup: 0s
    warmup_sessions: 1
    quality: exact
    method: open-interest change vs the previous post-close snapshot
    alertable: true
    dashboard_default: true
