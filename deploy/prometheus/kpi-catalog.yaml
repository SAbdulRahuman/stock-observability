  # --- Risk intelligence: snapshots and daily risk (nse_eod_snapshot, nse_risk, Release 3) ------
  - name: stock:session_close:price
    kind: snapshot
    release: R3
    formula: "C at post_close"
    inputs: [stock_last_price, stock_market_phase]
    rule_file: nse_eod_snapshot.rules.yml
    frequency: 30m
    scope: core
    unit: price

  - name: stock:session_return_x_nifty:ratio
    kind: snapshot
    release: R3
    formula: "ln(C / PC) * ln(NIFTY C / NIFTY PC) at post_close, EQ"
    inputs: [stock_last_price, stock_previous_close_price, stock_market_phase]
    rule_file: nse_eod_snapshot.rules.yml
    frequency: 30m
    scope: core
    unit: ratio

  - name: stock:session_drawdown:percent
    kind: snapshot
    release: R3
    formula: "(close / max close over 90 days - 1) * 100 at post_close"
    inputs: [stock:session_close:price]
    rule_file: nse_eod_snapshot.rules.yml
    frequency: 30m
    scope: core
    unit: percent

  - name: portfolio:session_return:ratio
    kind: snapshot
    release: R3
    formula: "day_change / (value - day_change) at post_close"
    inputs: [portfolio:day_change:sum, portfolio:holding_value:sum, stock_market_phase]
    rule_file: nse_eod_snapshot.rules.yml
    frequency: 30m
    scope: portfolio
    unit: ratio

  - name: portfolio:session_downside_sq:ratio
    kind: snapshot
    release: R3
    formula: "min(session return, 0)^2"
    inputs: [portfolio:session_return:ratio]
    rule_file: nse_eod_snapshot.rules.yml
    frequency: 30m
    scope: portfolio
    unit: ratio

  - name: stock:var_95_1d:percent
    kind: kpi
    family: risk
    level: risk_intelligence
    capability: risk
    release: R3
    formula: "-quantile_0.05(ln C/PC over 90 days) * 100, >= 20 sessions (loss, positive)"
    inputs: [stock:session_log_return:ratio]
    rule_file: nse_risk.rules.yml
    frequency: 30m
    scope: core
    unit: percent
    warmup: 0s
    warmup_sessions: 20
    quality: exact
    method: historical simulation, linear interpolation between order statistics
    limitation: "~60 sessions of retention: the 5% tail rests on about 3 observations"
    dashboard_default: true

  - name: stock:cvar_95_1d:percent
    kind: kpi
    family: risk
    level: risk_intelligence
    capability: risk
    release: R3
    formula: "(2.063 sigma - mu) * 100 of ln C/PC over 90 days, >= 20 sessions (loss, positive)"
    inputs: [stock:session_log_return:ratio]
    rule_file: nse_risk.rules.yml
    frequency: 30m
    scope: core
    unit: percent
    warmup: 0s
    warmup_sessions: 20
    quality: approximation
    method: parametric normal expected shortfall
    limitation: "historical CVaR needs a moving-threshold filter PromQL lacks; fat tails are understated"

  - name: stock:max_drawdown_60d:percent
    kind: kpi
    family: risk
    level: risk_intelligence
    capability: risk
    release: R3
    formula: "min(session drawdown from the 90-day peak close) over 90 days"
    inputs: [stock:session_drawdown:percent]
    rule_file: nse_risk.rules.yml
    frequency: 30m
    scope: core
    unit: percent
    warmup: 0s
    warmup_sessions: 1
    quality: exact
    method: close-to-close drawdown within retention (~60 sessions)
    dashboard_default: true

  - name: stock:beta_nifty_20d:ratio
    kind: kpi
    family: risk
    level: risk_intelligence
    capability: risk
    release: R3
    formula: "Cov(r, r_NIFTY) / Var(r_NIFTY) of daily log returns over 28 days, >= 15 sessions"
    inputs: [stock:session_return_x_nifty:ratio, stock:session_log_return:ratio]
    rule_file: nse_risk.rules.yml
    frequency: 30m
    scope: core
    unit: ratio
    warmup: 0s
    warmup_sessions: 15
    quality: exact
    method: E[XY] - E[X]E[Y] over population variance
    dashboard_default: true

  - name: stock:alpha_20d:percent
    kind: kpi
    family: risk
    level: risk_intelligence
    capability: risk
    release: R3
    formula: "252 * (mean r - R_f/252 - beta (mean r_NIFTY - R_f/252)) * 100"
    inputs: [stock:session_log_return:ratio, stock:beta_nifty_20d:ratio, stock_risk_free_rate_ratio]
    rule_file: nse_risk.rules.yml
    frequency: 30m
    scope: core
    unit: percent
    warmup: 0s
    warmup_sessions: 15
    quality: approximation
    method: annualised Jensen alpha on daily log returns
    limitation: "R_f is a manually updated textfile value (stock_risk_free_rate_ratio)"

  - name: portfolio:day_return:percent
    kind: kpi
    family: risk
    level: risk_intelligence
    capability: portfolio
    release: R3
    formula: "day_change / (value - day_change) * 100"
    inputs: [portfolio:day_change:sum, portfolio:holding_value:sum]
    rule_file: nse_risk.rules.yml
    frequency: 15s
    scope: portfolio
    unit: percent
    warmup: 0s
    quality: exact
    method: value-weighted holdings return vs the previous close
    alertable: true
    dashboard_default: true

  - name: portfolio:volatility_20d:percent
    kind: kpi
    family: risk
    level: risk_intelligence
    capability: portfolio
    release: R3
    formula: "stddev(portfolio session return over 28 days) * sqrt(252) * 100, >= 10 sessions"
    inputs: [portfolio:session_return:ratio]
    rule_file: nse_risk.rules.yml
    frequency: 30m
    scope: portfolio
    unit: percent
    warmup: 0s
    warmup_sessions: 10
    quality: exact
    method: stddev of the portfolio return series (no covariance matrix needed)
    dashboard_default: true

  - name: portfolio:sharpe_60d:ratio
    kind: kpi
    family: risk
    level: risk_intelligence
    capability: portfolio
    release: R3
    formula: "(mean r - R_f/252) / stddev r * sqrt(252) over 90 days, >= 20 sessions"
    inputs: [portfolio:session_return:ratio, stock_risk_free_rate_ratio]
    rule_file: nse_risk.rules.yml
    frequency: 30m
    scope: portfolio
    unit: ratio
    warmup: 0s
    warmup_sessions: 20
    quality: exact
    method: annualised Sharpe ratio of daily portfolio returns
    dashboard_default: true

  - name: portfolio:sortino_60d:ratio
    kind: kpi
    family: risk
    level: risk_intelligence
    capability: portfolio
    release: R3
    formula: "(mean r - R_f/252) / sqrt(mean min(r, 0)^2) * sqrt(252) over 90 days, >= 20 sessions"
    inputs: [portfolio:session_return:ratio, portfolio:session_downside_sq:ratio, stock_risk_free_rate_ratio]
    rule_file: nse_risk.rules.yml
    frequency: 30m
    scope: portfolio
    unit: ratio
    warmup: 0s
    warmup_sessions: 20
    quality: exact
    method: annualised Sortino ratio, downside deviation vs 0
    dashboard_default: true

  - name: portfolio:var_95_1d:percent
    kind: kpi
    family: risk
    level: risk_intelligence
    capability: portfolio
    release: R3
    formula: "-quantile_0.05(portfolio session return over 90 days) * 100, >= 20 sessions"
    inputs: [portfolio:session_return:ratio]
    rule_file: nse_risk.rules.yml
    frequency: 30m
    scope: portfolio
    unit: percent
    warmup: 0s
    warmup_sessions: 20
    quality: exact
    method: historical simulation on today's holdings' daily returns
    alertable: true
    dashboard_default: true

  # --- Risk intelligence: intraday (nse_returns_1m, nse_risk_intraday, Release 3) ----------------
  - name: stock:log_return_x_nifty_1m:ratio
    kind: helper
    release: R3
    formula: "ln(C/C[1m]) * ln(NIFTY/NIFTY[1m]) per 1m bar, EQ"
    inputs: [stock:log_return_1m:ratio]
    rule_file: nse_returns.rules.yml
    frequency: 1m
    scope: core
    unit: ratio

  - name: stock:covariance_nifty_60m:ratio
    kind: kpi
    family: risk
    level: risk_intelligence
    capability: risk
    release: R3
    formula: "E[r r_N] - E[r] E[r_N] of 1m log returns over 60 minutes, >= 30 bars"
    inputs: [stock:log_return_x_nifty_1m:ratio, stock:log_return_1m:ratio]
    rule_file: nse_risk.rules.yml
    frequency: 1m
    scope: core
    unit: ratio
    warmup: 30m
    quality: exact
    method: population covariance vs NIFTY 50 on 1m bars

  - name: stock:beta_nifty_60m:ratio
    kind: kpi
    family: risk
    level: risk_intelligence
    capability: risk
    release: R3
    formula: "Cov(r, r_N) / Var(r_N) over 60 one-minute bars"
    inputs: [stock:covariance_nifty_60m:ratio, stock:log_return_1m:ratio]
    rule_file: nse_risk.rules.yml
    frequency: 1m
    scope: core
    unit: ratio
    warmup: 30m
    quality: exact
    method: intraday OLS beta vs NIFTY 50
    limitation: "60 noisy bars; asynchronous trading biases beta towards 0 for illiquid names"
    dashboard_default: true

  - name: stock:correlation_nifty_60m:ratio
    kind: kpi
    family: risk
    level: risk_intelligence
    capability: risk
    release: R3
    formula: "Cov(r, r_N) / (sigma sigma_N) over 60 one-minute bars"
    inputs: [stock:covariance_nifty_60m:ratio, stock:log_return_1m:ratio]
    rule_file: nse_risk.rules.yml
    frequency: 1m
    scope: core
    unit: ratio
    range: {min: -1, max: 1}
    warmup: 30m
    quality: exact
    method: Pearson correlation vs NIFTY 50 on 1m bars
    dashboard_default: true

  - name: stock:ewma_variance_1m:ratio
    kind: helper
    release: R3
    formula: "h = 0.94 h[1m ago] + 0.06 r^2, seeded with Var(r) over 60m (>= 30 bars)"
    inputs: [stock_last_price, stock:log_return_1m:ratio]
    rule_file: nse_risk.rules.yml
    frequency: 1m
    scope: core
    unit: ratio

  - name: stock:ewma_vol_annualised:percent
    kind: kpi
    family: risk
    level: risk_intelligence
    capability: volatility
    release: R3
    formula: "sqrt(EWMA variance * 375 * 252) * 100"
    inputs: [stock:ewma_variance_1m:ratio]
    rule_file: nse_risk.rules.yml
    frequency: 1m
    scope: core
    unit: percent
    warmup: 30m
    quality: exact
    method: RiskMetrics EWMA (lambda 0.94) on 1m log returns, stateful
    limitation: "re-seeds after a gap longer than 3 minutes"
    dashboard_default: true

  - name: market:implied_move:points
    kind: kpi
    family: risk
    level: market_health
    capability: volatility
    release: R3
    formula: "NIFTY 50 * INDIA VIX / 100 / sqrt(365); label horizon=1d"
    inputs: [stock_last_price]
    rule_file: nse_risk.rules.yml
    frequency: 1m
    scope: market
    unit: points
    warmup: 0s
    quality: approximation
    method: one-sigma one-day move implied by INDIA VIX (calendar-day convention)
    alertable: true
    dashboard_default: true

  - name: stock:market_model_expected_return_15m:percent
    kind: kpi
    family: risk
    level: risk_intelligence
    capability: risk
    release: R3
    formula: "15 (mean r - beta mean r_N) * 100 + beta * NIFTY 15m return, 60m estimates"
    inputs: [stock:log_return_1m:ratio, stock:beta_nifty_60m:ratio, stock_last_price]
    rule_file: nse_risk.rules.yml
    frequency: 1m
    scope: core
    unit: percent
    warmup: 30m
    quality: approximation
    method: single-index market model, log-return estimates applied to a simple 15m return

  - name: stock:abnormal_return_15m:percent
    kind: kpi
    family: risk
    level: risk_intelligence
    capability: risk
    release: R3
    formula: "15m return - market model expected 15m return"
    inputs: [stock:market_model_expected_return_15m:percent, stock_last_price]
    rule_file: nse_risk.rules.yml
    frequency: 1m
    scope: core
    unit: percent
    warmup: 30m
    quality: approximation
    method: market-model residual (idiosyncratic move)
    alertable: true
    dashboard_default: true

  # --- 52-week and daily SMA levels (exporter `reference` collector, nse_reference_levels, R3) ---
  - name: stock:range_52w_position:ratio
    kind: kpi
    family: technical
    level: risk_intelligence
    capability: price
    release: R3
    formula: "(C - 52W low) / (52W high - 52W low)"
    inputs: [stock_last_price, stock_52w_high_price, stock_52w_low_price]
    rule_file: nse_reference_levels.rules.yml
    frequency: 15s
    scope: core
    unit: ratio
    range: {min: 0, max: 1}
    warmup: 0s
    quality: exact
    method: position within the 52-week range of Kite day candles up to the previous session
    limitation: "needs the Kite historical data add-on; no corporate-action adjustment"
    dashboard_default: true

  - name: stock:distance_52w_high:percent
    kind: kpi
    family: technical
    level: risk_intelligence
    capability: price
    release: R3
    formula: "(C / 52W high - 1) * 100"
    inputs: [stock_last_price, stock_52w_high_price]
    rule_file: nse_reference_levels.rules.yml
    frequency: 15s
    scope: core
    unit: percent
    warmup: 0s
    quality: exact
    method: distance from the 52-week high of Kite day candles up to the previous session
    limitation: "needs the Kite historical data add-on; no corporate-action adjustment"
    alertable: true
    dashboard_default: true

  - name: stock:sma_spread_50_200d:percent
    kind: kpi
    family: technical
    level: stock_intelligence
    capability: trend
    release: R3
    formula: "(SMA50 daily / SMA200 daily - 1) * 100"
    inputs: [stock_sma_50d_price, stock_sma_200d_price]
    rule_file: nse_reference_levels.rules.yml
    frequency: 15s
    scope: core
    unit: percent
    warmup: 0s
    quality: exact
    method: daily golden/death-cross spread from Kite day candles (>= 200 candles)
    limitation: "needs the Kite historical data add-on"
    dashboard_default: true

  # --- F&O intelligence (exporter `derivatives` collector, nse_derivatives, Release 4) ----------
  - name: stock:session_open_interest:contracts
    kind: snapshot
    release: R4
    formula: "OI at post_close"
    inputs: [stock_open_interest, stock_market_phase]
    rule_file: nse_derivatives.rules.yml
    frequency: 30m
    scope: core
    unit: contracts

  - name: underlying:spot:price
    kind: helper
    release: R4
    formula: "spot LTP relabelled to the NFO underlying (NIFTY 50 -> NIFTY, NIFTY BANK -> BANKNIFTY, ...), underlyings with contracts only"
    inputs: [stock_last_price, stock_instrument_info]
    rule_file: nse_derivatives.rules.yml
    frequency: 15s
    scope: market
    unit: price

  - name: underlying:futures_price:price
    kind: helper
    release: R4
    formula: "future LTP per underlying and expiry"
    inputs: [stock_last_price, stock_instrument_info]
    rule_file: nse_derivatives.rules.yml
    frequency: 15s
    scope: market
    unit: price

  - name: underlying:pcr_oi:ratio
    kind: kpi
    family: derivatives
    level: derivatives_intelligence
    capability: derivatives
    release: R4
    formula: "sum OI(PE) / sum OI(CE) per underlying and expiry"
    inputs: [stock_open_interest, stock_instrument_info]
    rule_file: nse_derivatives.rules.yml
    frequency: 15s
    scope: market
    unit: ratio
    warmup: 0s
    quality: exact
    method: open-interest put-call ratio over the tracked strikes
    limitation: "covers only the strikes in the watchlist (Kite subscription limit)"
    alertable: true
    dashboard_default: true

  - name: underlying:pcr_volume:ratio
    kind: kpi
    family: derivatives
    level: derivatives_intelligence
    capability: derivatives
    release: R4
    formula: "sum day volume(PE) / sum day volume(CE) per underlying and expiry"
    inputs: [stock_day_volume_shares, stock_instrument_info]
    rule_file: nse_derivatives.rules.yml
    frequency: 15s
    scope: market
    unit: ratio
    warmup: 0s
    quality: exact
    method: volume put-call ratio over the tracked strikes
    dashboard_default: true

  - name: underlying:futures_basis:points
    kind: kpi
    family: derivatives
    level: derivatives_intelligence
    capability: derivatives
    release: R4
    formula: "F - S per underlying and expiry"
    inputs: [underlying:futures_price:price, underlying:spot:price]
    rule_file: nse_derivatives.rules.yml
    frequency: 15s
    scope: market
    unit: points
    warmup: 0s
    quality: exact
    method: futures LTP minus spot LTP (asynchronous ticks)
    dashboard_default: true

  - name: underlying:futures_premium:percent
    kind: kpi
    family: derivatives
    level: derivatives_intelligence
    capability: derivatives
    release: R4
    formula: "(F / S - 1) * 100"
    inputs: [underlying:futures_price:price, underlying:spot:price]
    rule_file: nse_derivatives.rules.yml
    frequency: 15s
    scope: market
    unit: percent
    warmup: 0s
    quality: exact
    method: futures premium (negative = discount) over spot
    alertable: true
    dashboard_default: true

  - name: underlying:cost_of_carry:percent
    kind: kpi
    family: derivatives
    level: derivatives_intelligence
    capability: derivatives
    release: R4
    formula: "(F / S - 1) * 365 / days to expiry * 100, > 0.5 days to expiry"
    inputs: [underlying:futures_premium:percent, stock_instrument_expiry_timestamp_seconds]
    rule_file: nse_derivatives.rules.yml
    frequency: 15s
    scope: market
    unit: percent
    warmup: 0s
    quality: approximation
    method: simple annualised carry (calendar days)
    limitation: "explodes near expiry; suppressed in the last half day"
    alertable: true
    dashboard_default: true

  - name: stock:oi_change:percent
    kind: kpi
    family: derivatives
    level: derivatives_intelligence
    capability: derivatives
    release: R4
    formula: "(OI / previous session OI - 1) * 100, pre_open and open"
    inputs: [stock_open_interest, stock:session_open_interest:contracts]
    rule_file: nse_derivatives.rules.yml
    frequency: 15s
    scope: core
    unit: percent
    warmup: 0s
    warmup_sessions: 1
    quality: exact
    method: open-interest change vs the previous post-close snapshot
    alertable: true
    dashboard_default: true

  # --- Predictive intelligence, Prometheus side (nse_predict, Release 5) -----------------------
  - name: stock:feature:value
    kind: prediction
    release: R5
    formula: "model input per feature label (returns, Wilder RSI, MACD histogram, %B, z-score, R2, RVOL, OBI, WOBI, volume delta, VWAP deviation, abnormal return)"
    inputs: [stock:return_1m:percent, stock:rsi_wilder_14m:index, stock:macd_histogram:price, stock:price_zscore_20m:sigma, stock:relative_volume:ratio, stock:volume_delta_1h:ratio]
    rule_file: nse_predict.rules.yml
    frequency: 1m
    scope: core
    unit: value

  - name: stock:feature:zscore
    kind: prediction
    release: R5
    formula: "(feature - mean over 1 day) / stddev over 1 day"
    inputs: [stock:feature:value]
    rule_file: nse_predict.rules.yml
    frequency: 1m
    scope: core
    unit: sigma

  - name: stock:prob_up:ratio
    kind: prediction
    release: R5
    formula: "P(up over horizon) from the Quant Lab; labels model, horizon"
    inputs: [stock_prediction_prob_up]
    rule_file: nse_predict.rules.yml
    frequency: 15s
    scope: core
    unit: ratio

  - name: stock:model_return:percent
    kind: prediction
    release: R5
    formula: "Quant Lab expected return over the horizon; labels model, horizon"
    inputs: [stock_prediction_expected_return_percent]
    rule_file: nse_predict.rules.yml
    frequency: 15s
    scope: core
    unit: percent

  - name: stock:vol_forecast:percent
    kind: prediction
    release: R5
    formula: "Quant Lab expected return stddev over the horizon; labels model, horizon"
    inputs: [stock_prediction_volatility_percent]
    rule_file: nse_predict.rules.yml
    frequency: 15s
    scope: core
    unit: percent

  - name: underlying:max_pain_distance:percent
    kind: prediction
    release: R5
    formula: "(spot / Quant Lab max pain strike - 1) * 100 per underlying and expiry"
    inputs: [underlying:spot:price, underlying_max_pain_strike_price]
    rule_file: nse_predict.rules.yml
    frequency: 15s
    scope: market
    unit: percent

  - name: stock:forecast:price
    kind: prediction
    release: R5
    formula: "naive forecast C (horizons 1m, 15m) and C * (1 + model return / 100) per model"
    inputs: [stock_last_price, stock:model_return:percent]
    rule_file: nse_predict.rules.yml
    frequency: 1m
    scope: core
    unit: price

  - name: stock:forecast_error:percent
    kind: prediction
    release: R5
    formula: "(C - F[h ago]) / C * 100, scored inside the session; label horizon"
    inputs: [stock:forecast:price, stock_last_price]
    rule_file: nse_predict.rules.yml
    frequency: 1m
    scope: core
    unit: percent

  - name: stock:forecast_squared_error:percent2
    kind: helper
    release: R5
    formula: "forecast error squared"
    inputs: [stock:forecast_error:percent]
    rule_file: nse_predict.rules.yml
    frequency: 1m
    scope: core
    unit: percent2

  - name: stock:forecast_direction_hit:bool
    kind: prediction
    release: R5
    formula: "sign(C - C[15m ago]) == sign(F[15m ago] - C[15m ago]), models except naive"
    inputs: [stock:forecast:price, stock_last_price]
    rule_file: nse_predict.rules.yml
    frequency: 1m
    scope: core
    unit: bool

  - name: stock:price_up_15m:bool
    kind: helper
    release: R5
    formula: "1 if C > C[15m ago] inside the session"
    inputs: [stock_last_price]
    rule_file: nse_predict.rules.yml
    frequency: 1m
    scope: core
    unit: bool

  - name: stock:prob_brier:ratio
    kind: prediction
    release: R5
    formula: "(P(up)[15m ago] - 1{C > C[15m ago]})^2"
    inputs: [stock:prob_up:ratio, stock:price_up_15m:bool]
    rule_file: nse_predict.rules.yml
    frequency: 1m
    scope: core
    unit: ratio

  - name: stock:forecast_rmse_1d:percent
    kind: prediction
    release: R5
    formula: "sqrt(mean squared forecast error over 1 day)"
    inputs: [stock:forecast_squared_error:percent2]
    rule_file: nse_predict.rules.yml
    frequency: 15m
    scope: core
    unit: percent

  - name: stock:forecast_theil_u_1d:ratio
    kind: prediction
    release: R5
    formula: "RMSE(model) / RMSE(naive) over 1 day (< 1 beats the random walk)"
    inputs: [stock:forecast_rmse_1d:percent]
    rule_file: nse_predict.rules.yml
    frequency: 15m
    scope: core
    unit: ratio

  - name: stock:forecast_hit_rate_1d:ratio
    kind: prediction
    release: R5
    formula: "share of direction hits over 1 day"
    inputs: [stock:forecast_direction_hit:bool]
    rule_file: nse_predict.rules.yml
    frequency: 15m
    scope: core
    unit: ratio

  - name: stock:prob_skill_1d:ratio
    kind: prediction
    release: R5
    formula: "1 - Brier / (base (1 - base)) over 1 day, base = share of up windows"
    inputs: [stock:prob_brier:ratio, stock:price_up_15m:bool]
    rule_file: nse_predict.rules.yml
    frequency: 15m
    scope: core
    unit: ratio

  - name: model:theil_u_1d:median
    kind: prediction
    release: R5
    formula: "median Theil U across instruments by model and horizon"
    inputs: [stock:forecast_theil_u_1d:ratio]
    rule_file: nse_predict.rules.yml
    frequency: 15m
    scope: market
    unit: ratio

  - name: model:prob_skill_1d:median
    kind: prediction
    release: R5
    formula: "median Brier skill across instruments by model and horizon"
    inputs: [stock:prob_skill_1d:ratio]
    rule_file: nse_predict.rules.yml
    frequency: 15m
    scope: market
    unit: ratio

  # Daily-candle forecast rules SF-101..129 (Stock_forecast_Prometheus_Rules.md v1.4).
  - {name: 'stock:sma_spread_20_50d:percent', kind: helper, release: R6, formula: '(SMA20/SMA50 - 1) * 100 from daily closes', inputs: [stock_sma_20d_price, stock_sma_50d_price], rule_file: nse_forecast.rules.yml, frequency: 1m, scope: core, unit: percent}
  - {name: 'stock:realized_vol_ratio_10d_60d:ratio', kind: helper, release: R6, formula: 'RV10 / RV60 (annualized close-to-close)', inputs: [stock_realized_vol_10d_percent, stock_realized_vol_60d_percent], rule_file: nse_forecast.rules.yml, frequency: 1m, scope: core, unit: ratio}
  - {name: 'stock:relative_return_20d_nifty:percent', kind: helper, release: R6, formula: '20-session return minus NIFTY 50 20-session return', inputs: [stock_daily_return_20d_percent], rule_file: nse_forecast.rules.yml, frequency: 1m, scope: core, unit: percent}
  - {name: 'stock:momentum_6_1:percent', kind: helper, release: R6, formula: 'Return from t-126 to t-21 sessions', inputs: [stock_daily_return_126_21d_percent], rule_file: nse_forecast.rules.yml, frequency: 1m, scope: core, unit: percent}
  - {name: 'stock:sector_relative_return_20d:percent', kind: helper, release: R6, formula: '20-session return minus the median of its sector', inputs: [stock_daily_return_20d_percent], rule_file: nse_forecast.rules.yml, frequency: 1m, scope: core, unit: percent}
  - {name: 'stock:ewma_vol_forecast_ratio:ratio', kind: helper, release: R6, formula: 'EWMA(0.94) volatility forecast / RV60', inputs: [stock_daily_ewma_vol_forecast_percent, stock_realized_vol_60d_percent], rule_file: nse_forecast.rules.yml, frequency: 1m, scope: core, unit: ratio}
  - {name: 'stock:daily_feature:zscore', kind: helper, release: R6, formula: 'Cross-sectional z-score of a daily feature by feature label', inputs: [stock_daily_return_5d_percent, stock_daily_return_20d_percent, stock_rsi_14d_index, stock_daily_relative_volume_20d_ratio, stock_daily_close_zscore_20d_sigma], rule_file: nse_forecast.rules.yml, frequency: 1m, scope: core, unit: sigma}
  - {name: 'stock:prob_up_5d:ratio', kind: prediction, release: R6, formula: 'logistic(intercept + sum(weight * feature z-score))', inputs: ['stock:daily_feature:zscore', stock_forecast_model_weight, stock_forecast_model_intercept], rule_file: nse_forecast.rules.yml, frequency: 1m, scope: core, unit: ratio, limitation: 'Absent until the offline refit publishes logit_5d weights to the textfile directory'}
  - {name: 'stock:forecast_state:bool', kind: helper, release: R6, formula: 'Hysteresis: fire threshold, or clear threshold while the state held 30m ago', inputs: ['stock:realized_vol_ratio_10d_60d:ratio', 'stock:relative_return_20d_nifty:percent', stock_adx_14d_index, stock_daily_close_zscore_20d_sigma, 'stock:momentum_6_1:percent', 'stock:sector_relative_return_20d:percent', 'stock:prob_up_5d:ratio', 'stock:ewma_vol_forecast_ratio:ratio'], rule_file: nse_forecast.rules.yml, frequency: 1m, scope: core, unit: bool}
  - {name: 'stock:forecast_signal:value', kind: signal, release: R6, formula: 'Active forecast condition by rule_id, technique, direction, horizon', inputs: ['stock:forecast_state:bool', stock_daily_signal_age_sessions, stock_daily_trend_streak_sessions], rule_file: nse_forecast.rules.yml, frequency: 1m, scope: core, unit: bool, limitation: 'A condition, not a validated prediction; see forecast:hit_rate_60d:ratio'}
  - {name: 'stock:forecast_confluence:count', kind: signal, release: R6, formula: 'Number of distinct directional rules active per symbol and direction', inputs: ['stock:forecast_signal:value'], rule_file: nse_forecast.rules.yml, frequency: 1m, scope: core, unit: count}
  - {name: 'stock:forecast_activation:session', kind: helper, release: R6, formula: 'Session index at the first minute of a forecast episode', inputs: ['stock:forecast_signal:value', stock_daily_session_index], rule_file: nse_forecast.rules.yml, frequency: 1m, scope: core, unit: sessions}
  - {name: 'stock:forecast_activation:price', kind: helper, release: R6, formula: 'Daily close at forecast activation', inputs: ['stock:forecast_activation:session', stock_daily_close_price], rule_file: nse_forecast.rules.yml, frequency: 1m, scope: core, unit: price}
  - {name: 'stock:forecast_activation_benchmark:price', kind: helper, release: R6, formula: 'NIFTY 50 daily close at forecast activation', inputs: ['stock:forecast_activation:session', stock_daily_close_price], rule_file: nse_forecast.rules.yml, frequency: 1m, scope: core, unit: price}
  - {name: 'stock:forecast_activation_baseline:percent', kind: helper, release: R6, formula: 'RV60 (RV20 for SF-120) at activation of a volatility forecast', inputs: ['stock:forecast_activation:session', stock_realized_vol_60d_percent, stock_realized_vol_20d_percent], rule_file: nse_forecast.rules.yml, frequency: 1m, scope: core, unit: percent}
  - {name: 'stock:forecast_age:sessions', kind: helper, release: R6, formula: 'Session index minus activation session', inputs: ['stock:forecast_activation:session', stock_daily_session_index], rule_file: nse_forecast.rules.yml, frequency: 1m, scope: core, unit: sessions, limitation: 'Activations older than 35 days are not read'}
  - {name: 'stock:forecast_progress:excess_percent', kind: effectiveness, release: R6, formula: 'Return since activation minus NIFTY 50 return since activation', inputs: ['stock:forecast_activation:price', 'stock:forecast_activation_benchmark:price', stock_daily_close_price], rule_file: nse_forecast.rules.yml, frequency: 1m, scope: core, unit: percent}
  - {name: 'stock:forecast_outcome:excess_percent', kind: effectiveness, release: R6, formula: 'Excess return when the forecast age equals its horizon', inputs: ['stock:forecast_progress:excess_percent', 'stock:forecast_age:sessions'], rule_file: nse_forecast.rules.yml, frequency: 1m, scope: core, unit: percent}
  - {name: 'stock:forecast_outcome:hit', kind: effectiveness, release: R6, formula: 'Directional: sign of excess return matches direction; volatility: RV5 vs activation baseline', inputs: ['stock:forecast_outcome:excess_percent', 'stock:forecast_activation_baseline:percent', stock_realized_vol_5d_percent], rule_file: nse_forecast.rules.yml, frequency: 1m, scope: core, unit: bool}
  - {name: 'stock:forecast_outcome_event:hit', kind: effectiveness, release: R6, formula: 'First minute of each verdict series', inputs: ['stock:forecast_outcome:hit'], rule_file: nse_forecast.rules.yml, frequency: 1m, scope: core, unit: bool}
  - {name: 'forecast:outcomes_60d:count', kind: effectiveness, release: R6, formula: 'Verdicts per rule_id, direction, horizon over 60 days', inputs: ['stock:forecast_outcome_event:hit'], rule_file: nse_forecast.rules.yml, frequency: 15m, scope: market, unit: count}
  - {name: 'forecast:hit_rate_60d:ratio', kind: effectiveness, release: R6, formula: 'Hits / verdicts over 60 days (>= 5 verdicts)', inputs: ['stock:forecast_outcome_event:hit', 'forecast:outcomes_60d:count'], rule_file: nse_forecast.rules.yml, frequency: 15m, scope: market, unit: ratio, limitation: 'Not corrected for base rate or multiple testing; the offline replay is authoritative'}

