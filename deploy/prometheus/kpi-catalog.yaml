    dashboard_default: true

  - name: stock:cci_20m:index
    kind: kpi
    family: technical
    level: stock_intelligence
    capability: momentum
    release: R2
    formula: "CCI = (TP - SMA20(TP)) / (0.015 * MD), MD = rolling mean |TP - SMA20(TP)|"
    inputs: [stock:bar_1m_typical:price]
    rule_file: nse_momentum.rules.yml
    frequency: 1m
    scope: core
    unit: index
    warmup: 20m
    quality: approximation
    method: Lambert CCI on 1m typical prices
    limitation: "mean deviation uses each bar's own SMA (rolling), not the current SMA"

  - name: stock:mfi_14m:index
    kind: kpi
    family: technical
    level: stock_intelligence
    capability: volume
    release: R2
    formula: "MFI = 100 - 100 / (1 + sum(TP*V | TP up) / sum(TP*V | TP down)), 14 1m bars"
    inputs: [stock:bar_1m_typical:price, stock:bar_1m_volume:shares]
    rule_file: nse_momentum.rules.yml
    frequency: 1m
    scope: core
    unit: index
    range: {min: 0, max: 100}
    warmup: 15m
    quality: exact
    method: money-flow index, EQ only
    alertable: true

  - name: stock:awesome_oscillator:price
    kind: kpi
    family: technical
    level: stock_intelligence
    capability: momentum
    release: R2
    formula: "AO = SMA5((H + L) / 2) - SMA34((H + L) / 2), 1m bars"
    inputs: [stock:bar_1m_high:price, stock:bar_1m_low:price]
    rule_file: nse_momentum.rules.yml
    frequency: 1m
    scope: core
    unit: price
    warmup: 34m
    quality: exact
    method: Bill Williams awesome oscillator on 1m bars

