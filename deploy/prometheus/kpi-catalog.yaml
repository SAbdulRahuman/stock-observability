    scope: core
    unit: points
    warmup: 10m
    quality: exact
    method: 10-minute price momentum

  - name: stock:stochastic_d_3m:percent
    kind: kpi
    family: technical
    level: stock_intelligence
    capability: momentum
    release: R2
    formula: "%D = SMA3(%K) at the last three 1m closes"
    inputs: [stock:stochastic_k_14m:percent]
    rule_file: nse_momentum.rules.yml
    frequency: 15s
    scope: core
    unit: percent
    range: {min: 0, max: 100}
    warmup: 16m
    quality: exact
