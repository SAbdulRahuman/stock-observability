# Override for development/demo with the simulated feed (no Kite credentials needed).
services:
  stock_exporter:
    command:
      - --feed.source=sim
      - --market.force-open
      - --stock.watchlist-file=/etc/stock_exporter/watchlist.yml
      - --market.holidays-file=/etc/stock_exporter/holidays.yml
      - --collector.textfile.directory=/etc/stock_exporter/textfile
    secrets: !reset []

secrets: !reset {}
